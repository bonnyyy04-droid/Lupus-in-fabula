// ── ANONYMOUS AUTH ────────────────────────────────────────────────────────────
// Firma anonima all'avvio: l'utente non vede nulla, ma Firebase assegna un UID
// stabile per sessione che le Security Rules possono verificare.
// L'UID viene memorizzato in window._fbUid non appena disponibile e sostituisce
// il vecchio id random da localStorage per tutte le operazioni multiplayer.
window._fbUid = null;
window._fbAuthReady = false;
window._fbAuthCallbacks = [];

firebase.auth().onAuthStateChanged(function(user) {
  if (user) {
    window._fbUid = user.uid;
    window._fbAuthReady = true;
    window._fbAuthCallbacks.forEach(function(cb){ cb(user.uid); });
    window._fbAuthCallbacks = [];
  }
});

// signInAnonymously con retry: se fallisce (rete assente) riprova dopo 3s
(function trySignIn(attempt) {
  firebase.auth().signInAnonymously().catch(function(err) {
    console.warn('[Auth] signInAnonymously fallito (tentativo ' + attempt + '):', err.code);
    if (attempt < 5) setTimeout(function(){ trySignIn(attempt + 1); }, 3000);
    else {
      // Fallback: usa il vecchio id localStorage — le Security Rules rifiuteranno
      // le scritture ma il gioco locale continua a funzionare.
      console.warn('[Auth] Fallback su id locale. Modalità offline limitata.');
      window._fbAuthReady = true;
      window._fbAuthCallbacks.forEach(function(cb){ cb(null); });
      window._fbAuthCallbacks = [];
    }
  });
})(1);

// ── waitForAuth: attende l'UID Firebase con timeout 8s ───────────────────────
// Più robusto di onFbAuth perché usa onAuthStateChanged direttamente
// e non dipende dal timing di window._fbAuthReady
window.waitForAuth = function() {
  return new Promise(function(resolve) {
    var user = firebase.auth().currentUser;
    if (user) { resolve(user.uid); return; }
    var unsub = firebase.auth().onAuthStateChanged(function(u) {
      if (u) { unsub(); resolve(u.uid); }
    });
    // Timeout 8s: fallback a null (Security Rules bloccheranno ma non crasherà)
    setTimeout(function() { unsub(); resolve(null); }, 8000);
  });
};
</script>

<style>
/* ── RESET ── */
*{box-sizing:border-box;margin:0;padding:0}

  --gold:#d6b23a;--gold-dim:#b08f30;--gold-glow:rgba(201,162,39,.22);

html{overflow-x:hidden}
body{background:var(--n-bg);color:var(--text);font-family:'EB Garamond',serif;font-size:18px;min-height:100vh;-webkit-text-size-adjust:100%;overflow-x:hidden;max-width:100vw}

@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

/* ── APP WRAPPERS ── */

.app.night::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(1.5px 1.5px at 8% 12%,rgba(255,250,235,.9),transparent 60%),

    radial-gradient(1px 1px at 58% 6%,rgba(255,250,235,.75),transparent 60%),
    radial-gradient(1px 1px at 12% 42%,rgba(220,230,255,.5),transparent 60%),

/* ── TYPOGRAPHY ── */

.input-row{display:flex;gap:8px;margin-bottom:12px}
