<style>
/* ── RESET ── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#c9a227;--gold-dim:#6a4e12;--gold-glow:rgba(201,162,39,.22);
  --red:#c0392b;--green:#1a7a45;--blue:#2475b0;--purple:#7d3c98;
  --text:#ddd0b8;--text-dim:#6b5a3e;--text-muted:#48392a;
  --n-bg:#04080f;--n-s1:#08101e;--n-s2:#0d1628;
  --d-bg:#100a04;--d-s1:#1c1106;--d-s2:#261808;
  --r:12px;--r-sm:8px;--r-lg:18px;
}
body{background:var(--n-bg);color:var(--text);font-family:'EB Garamond',serif;font-size:16px;min-height:100vh;-webkit-text-size-adjust:100%}
#root{min-height:100vh}

/* ── LOADING ── */
#loading{position:fixed;inset:0;background:#04080f;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:100}
#loading span{font-size:3.5rem;animation:pulse 2s ease infinite}
#loading p{font-family:'Cinzel',serif;color:#2e240f;font-size:.68rem;letter-spacing:.32em;text-transform:uppercase}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

/* ── APP WRAPPERS ── */
.app{position:relative;min-height:100vh}
.app.night{background:var(--n-bg)}
.app.day{background:var(--d-bg)}
.app.night::before{content:'';position:fixed;inset:0;background:
  radial-gradient(ellipse 65% 30% at 80% 0%,rgba(30,70,160,.14) 0%,transparent 60%),
  radial-gradient(ellipse 30% 40% at 10% 100%,rgba(50,15,110,.1) 0%,transparent 55%);
  pointer-events:none;z-index:0}
.app.day::before{content:'';position:fixed;inset:0;background:
  radial-gradient(ellipse 70% 35% at 50% 0%,rgba(180,90,15,.2) 0%,transparent 55%),
  radial-gradient(ellipse 35% 25% at 95% 85%,rgba(100,35,5,.1) 0%,transparent 50%);
  pointer-events:none;z-index:0}

/* ── CELESTIAL BODY ── */
.astro{position:fixed;top:-75px;right:-55px;width:260px;height:260px;border-radius:50%;pointer-events:none;z-index:0}
.astro.moon{background:radial-gradient(circle at 36% 36%,#e8e0d0,#b0883a 42%,#3a1e06 72%,#08040e);opacity:.08;filter:blur(2px)}
.astro.sun{background:radial-gradient(circle at 50% 50%,#fff5d0,#d47a08 48%,#6a2000);opacity:.09;width:320px;height:320px;top:-100px;right:-80px;filter:blur(4px)}

/* ── SCREEN ── */
.screen{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:30px 18px 80px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeUp .32s ease both}

/* ── TYPOGRAPHY ── */
.title{font-family:'Cinzel Decorative',serif;font-size:clamp(1.5rem,7.5vw,2.2rem);color:var(--gold);text-align:center;letter-spacing:.03em;line-height:1.2}
.subtitle{font-family:'Cinzel',serif;font-size:.64rem;color:#3a2c14;text-align:center;letter-spacing:.28em;text-transform:uppercase;margin-top:8px;margin-bottom:28px}
.lbl{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:9px}
.nlbl{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.muted{color:var(--text-dim);font-size:.9rem;font-style:italic}
.warn{color:#7a5428;font-size:.83rem;font-style:italic;margin-bottom:10px}

@keyframes titleGlow{0%,100%{text-shadow:0 0 25px rgba(201,162,39,.2)}50%{text-shadow:0 0 55px rgba(201,162,39,.5),0 0 110px rgba(201,162,39,.12)}}
.glow{animation:titleGlow 4s ease-in-out infinite}

/* ── PILL / BADGE ── */
.pill{display:inline-block;font-family:'Cinzel',serif;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;padding:4px 14px;border-radius:20px;background:rgba(201,162,39,.1);border:1px solid rgba(201,162,39,.2);color:var(--gold)}
.pill-center{text-align:center;margin-bottom:18px}

/* ── CARD ── */
.card{background:rgba(255,255,255,.04);border:1px solid rgba(201,162,39,.12);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.card-warm{background:rgba(255,200,80,.03);border:1px solid rgba(180,100,15,.15);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}

/* ── INPUTS ── */
.input-row{display:flex;gap:8px;margin-bottom:12px}
input[type=text]{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(201,162,39,.2);border-radius:var(--r-sm);padding:12px 16px;color:var(--text);font-family:'EB Garamond',serif;font-size:.98rem;outline:none;transition:border-color .2s,background .2s;-webkit-appearance:none}
input[type=text]:focus{border-color:rgba(201,162,39,.48);background:rgba(255,255,255,.06)}
input[type=text]::placeholder{color:#2e2214}

/* ── CHIPS ── */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:5px 12px;font-size:.9rem;color:var(--text)}
.chip button{background:none;border:none;color:#4a3820;cursor:pointer;font-size:.8rem;padding:0;line-height:1;transition:color .15s}
.chip button:hover{color:var(--red)}

/* ── BUTTONS ── */
.btn{font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;border:none;border-radius:var(--r-sm);padding:13px 20px;cursor:pointer;transition:transform .12s,box-shadow .15s,opacity .15s;-webkit-tap-highlight-color:transparent;display:block;width:100%;text-align:center}
.btn:disabled{opacity:.26;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.97)}
.btn-gold{background:linear-gradient(145deg,#c9a227 0%,#7a4e08 100%);color:#0a0700;font-weight:700;box-shadow:0 2px 14px rgba(201,162,39,.22)}
.btn-gold:hover:not(:disabled){box-shadow:0 4px 26px rgba(201,162,39,.42)}
.btn-outline{background:transparent;color:var(--gold);border:1px solid rgba(201,162,39,.3)}
.btn-outline:hover:not(:disabled){background:rgba(201,162,39,.07)}
.btn-red{background:linear-gradient(145deg,#c0392b,#7b1e15);color:#fff;font-weight:700;box-shadow:0 2px 10px rgba(192,57,43,.22)}
.btn-red:hover:not(:disabled){box-shadow:0 4px 24px rgba(192,57,43,.42)}
.btn-magic{background:linear-gradient(145deg,#2e1060,#12082e);color:#c0a0f0;border:1px solid rgba(160,100,240,.32);font-weight:600}
.btn-magic:hover:not(:disabled){box-shadow:0 4px 24px rgba(120,60,200,.35)}
.btn-sm{width:auto;padding:12px 18px}
.mt8{margin-top:8px}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}

/* ── MUTE BTN ── */
.mute-btn{position:fixed;top:14px;right:14px;z-index:500;width:38px;height:38px;border-radius:50%;background:rgba(4,8,15,.88);border:1px solid rgba(201,162,39,.18);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.92rem;backdrop-filter:blur(8px);-webkit-tap-highlight-color:transparent;transition:border-color .2s}
.mute-btn:hover{border-color:rgba(201,162,39,.44)}

/* ── DIVIDER ── */
.div{height:1px;background:linear-gradient(to right,transparent,rgba(201,162,39,.16),transparent);margin:22px 0}

/* ────────────────────────────────────────────────────────────
   PLAYER GRID — the big new thing for day + night status
   ──────────────────────────────────────────────────────── */
.player-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.p-tok{position:relative;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 6px 8px;text-align:center;transition:opacity .4s,border-color .3s,filter .4s;cursor:default}
.p-tok.alive{border-color:rgba(201,162,39,.18)}
.p-tok.dead{opacity:.32;filter:grayscale(.8);border-color:rgba(255,255,255,.04);background:rgba(0,0,0,.12)}
.p-tok .pt-em{font-size:1.45rem;line-height:1;display:block;margin-bottom:4px}
.p-tok .pt-name{font-size:.78rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-family:'Cinzel',serif;font-weight:600;letter-spacing:.03em}
.p-tok .pt-role{font-size:.65rem;font-family:'Cinzel',serif;display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-dim)}
.p-tok .pt-sindaco{position:absolute;top:4px;left:6px;font-size:.75rem;line-height:1}
.p-tok .pt-dead-x{position:absolute;top:4px;right:6px;font-size:.7rem;color:#6b2020;font-family:'Cinzel',serif;font-weight:700}
.p-tok.alive:hover{border-color:rgba(201,162,39,.35);background:rgba(255,255,255,.06)}

/* ── SELECTION LIST ── */
.slist{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.sbtn{display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:var(--r-sm);color:var(--text);font-family:'EB Garamond',serif;font-size:.93rem;cursor:pointer;transition:all .12s;text-align:left;-webkit-tap-highlight-color:transparent;width:100%}
.sbtn:hover{background:rgba(255,255,255,.07);border-color:rgba(201,162,39,.28)}
.sbtn.sel{background:rgba(201,162,39,.1);border-color:rgba(201,162,39,.44)}
.sbtn:disabled{opacity:.3;cursor:not-allowed}
.ck{margin-left:auto;color:var(--gold);font-size:.9rem}

/* ── NIGHT STEP WRAPPER ── */
.night-hdr{text-align:center;padding:32px 16px 16px}
.night-hdr .ni-em{font-size:3.8rem;display:block;margin-bottom:10px;filter:drop-shadow(0 0 16px var(--ni-col,#fff4))}
.night-hdr .ni-title{font-family:'Cinzel',serif;font-size:1.12rem;letter-spacing:.06em;color:var(--ni-col,var(--gold))}
.night-pill-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}

/* ── INSTRUCTION BOX ── */
.instr{background:rgba(201,162,39,.05);border:1px solid rgba(201,162,39,.14);border-radius:10px;padding:13px 16px;margin-bottom:14px;font-size:.9rem;line-height:1.7;font-style:italic;color:#a08850}

/* ── VISION BOX ── */
.vbox{background:rgba(125,60,152,.1);border:1px solid rgba(125,60,152,.24);border-radius:12px;padding:16px;text-align:center;margin-bottom:14px}
.vlbl{font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:#9b59b6;margin-bottom:8px}

/* ── ROLE REVEAL ── */
@keyframes cardIn{from{opacity:0;transform:rotateY(-22deg) scale(.94)}to{opacity:1;transform:rotateY(0) scale(1)}}
.reveal-back{background:var(--n-s1);border:2px dashed rgba(201,162,39,.18);border-radius:18px;padding:54px 24px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:14px;transition:all .2s;-webkit-tap-highlight-color:transparent;user-select:none}
.reveal-back:active{background:rgba(201,162,39,.06);border-color:rgba(201,162,39,.38);transform:scale(.98)}
.reveal-hint{font-family:'Cinzel',serif;font-size:.73rem;letter-spacing:.16em;color:#4a3820;text-transform:uppercase}
.reveal-front{background:var(--n-s1);border:1px solid rgba(201,162,39,.2);border-radius:18px;padding:30px 24px 26px;text-align:center;animation:cardIn .35s ease both}
.re{font-size:4.5rem;display:block;margin-bottom:16px;filter:drop-shadow(0 4px 18px var(--role-glow,rgba(255,255,255,.1)))}
.rn{font-family:'Cinzel',serif;font-size:1.45rem;font-weight:700;margin-bottom:12px}
.rd{color:#8a7860;font-style:italic;line-height:1.7;font-size:.92rem;max-width:290px;margin:0 auto}
.rt{font-family:'Cinzel',serif;font-size:.63rem;letter-spacing:.18em;text-transform:uppercase;margin-top:12px;padding:5px 14px;border-radius:20px;display:inline-block;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04)}

/* ── EVENTS ── */
.ev{padding:11px 14px;border-radius:9px;margin-bottom:8px;font-size:.9rem;line-height:1.6}
.ev-death{background:rgba(176,32,32,.12);border:1px solid rgba(176,32,32,.25)}
.ev-protected{background:rgba(36,117,176,.1);border:1px solid rgba(36,117,176,.22)}
.ev-peaceful{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07)}
.ev-info{background:rgba(201,162,39,.06);border:1px solid rgba(201,162,39,.17)}
.ev-revive{background:rgba(26,122,69,.1);border:1px solid rgba(26,122,69,.22)}

/* ── COMPACT PLAYER ROWS (status panel) ── */
.prow{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:8px;margin-bottom:4px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);font-size:.87rem}
.prow.dead{opacity:.3}
.pl{display:flex;align-items:center;gap:9px}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.da{background:#1a7a45;box-shadow:0 0 5px rgba(26,122,69,.5)}
.dd{background:#6b2020}

/* ── WIN SCREEN ── */
.wh{text-align:center;padding:18px 0 30px}
.we{font-size:5rem;display:block;margin-bottom:16px}
.wt{font-family:'Cinzel Decorative',serif;font-size:clamp(1.2rem,5.5vw,1.8rem);margin-bottom:10px;line-height:1.25}
.ws{color:#5a4830;font-style:italic;font-size:.92rem}
.fr{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;margin-bottom:4px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);font-size:.87rem}
.fr.fdead{opacity:.38}
.fn{flex:1}
.frn{font-family:'Cinzel',serif;font-size:.72rem}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal{background:#0c101a;border:1px solid rgba(201,162,39,.26);border-radius:18px;padding:28px 22px;max-width:360px;width:100%;position:relative;max-height:82vh;overflow-y:auto}
.modal-close{position:absolute;top:14px;right:16px;background:none;border:none;color:#5a4830;font-size:1.3rem;cursor:pointer;line-height:1;transition:color .15s}
.modal-close:hover{color:var(--gold)}
.ibtn{width:26px;height:26px;border-radius:50%;border:1px solid rgba(201,162,39,.28);background:rgba(201,162,39,.07);color:var(--gold);font-size:.7rem;font-family:'Cinzel',serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;-webkit-tap-highlight-color:transparent}
.ibtn:hover{background:rgba(201,162,39,.2)}

/* ── NIGHT LOG MATRIX TABLE ── */
.nlog-wrap{overflow-x:auto;margin-bottom:16px;border-radius:10px;border:1px solid rgba(201,162,39,.12);-webkit-overflow-scrolling:touch}
.nlog-table{border-collapse:collapse;font-family:'Cinzel',serif;width:100%}
.nlog-corner{padding:8px 12px;font-size:.55rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dim);border-bottom:2px solid rgba(201,162,39,.16);background:rgba(0,0,0,.25);white-space:nowrap;position:sticky;left:0;z-index:2}
.nlog-th{padding:9px 12px;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-dim);border-bottom:2px solid rgba(201,162,39,.16);border-left:1px solid rgba(255,255,255,.04);white-space:nowrap;text-align:center;background:rgba(0,0,0,.18);min-width:68px}
.nlog-td-name{padding:7px 12px;font-size:.72rem;white-space:nowrap;border-bottom:1px solid rgba(255,255,255,.03);background:rgba(0,0,0,.15);position:sticky;left:0;z-index:1;max-width:120px}
.nlog-td{padding:6px 8px;text-align:center;font-size:.72rem;border-bottom:1px solid rgba(255,255,255,.03);border-left:1px solid rgba(255,255,255,.04);min-width:68px;vertical-align:middle}
.nlog-td.dead-night{background:rgba(176,32,32,.1)}
.nlog-td.dead-vote{background:rgba(201,162,39,.07)}
.nlog-td.past-death{opacity:.22;background:rgba(0,0,0,.2)}
.nlog-choice{font-size:.62rem;color:#7a6848;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60px;margin:0 auto;line-height:1.3}
.nlog-role-seen{font-size:.7rem;display:inline-block;margin-left:2px;vertical-align:middle}
.nlog-death{font-size:.88rem;display:block;line-height:1;margin-top:2px}
.nlog-action-icon{font-size:.65rem;display:block;opacity:.55;margin-bottom:1px}
.nlog-name-cell{display:flex;align-items:center;gap:6px}
.nlog-name-em{font-size:.95rem;flex-shrink:0}
.nlog-name-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-family:'Cinzel',serif;font-size:.7rem;max-width:80px}
.nlog-name-role{font-size:.58rem;color:var(--text-dim);display:block;font-family:'Cinzel',serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80px}
.nlog-row-dead .nlog-td-name .nlog-name-txt{text-decoration:line-through;opacity:.5}


.book-overlay{position:fixed;inset:0;z-index:600;display:flex;align-items:stretch;justify-content:center;background:#040810}
.book-bg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 20%,rgba(130,75,15,.14) 0%,transparent 70%);pointer-events:none}
.book-wrap{position:relative;z-index:1;width:100%;max-width:480px;display:flex;flex-direction:column;overflow:hidden}
.book-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;border-bottom:1px solid rgba(201,162,39,.14);flex-shrink:0}
.book-title{font-family:'Cinzel Decorative',serif;font-size:1.1rem;color:var(--gold);letter-spacing:.04em}
.book-close{background:none;border:1px solid rgba(201,162,39,.26);border-radius:50%;width:34px;height:34px;color:var(--gold);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
.book-close:hover{background:rgba(201,162,39,.1)}
.book-nav{display:flex;padding:10px 20px;border-bottom:1px solid rgba(201,162,39,.1);flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:4px}
.book-nav::-webkit-scrollbar{display:none}
.book-tab{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border-radius:20px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:all .15s;background:transparent;color:#3a2c14;-webkit-tap-highlight-color:transparent}
.book-tab.active{background:rgba(201,162,39,.14);color:var(--gold);border-color:rgba(201,162,39,.28)}
.book-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:24px 20px 40px}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function buildRolesFromDist(dist){
  const a=[];
  Object.entries(dist).forEach(([k,c])=>{for(let i=0;i<c;i++)a.push(k);});
  const hasR=a.includes('romeo'),hasG=a.includes('giulietta');
  if(hasR&&!hasG){const vi=a.lastIndexOf('villico');if(vi!==-1)a.splice(vi,1,'giulietta');}
  if(hasG&&!hasR){const vi=a.lastIndexOf('villico');if(vi!==-1)a.splice(vi,1,'romeo');}
  return shuffle(a);
}

function getSuggestedDist(n){
  const base={lupo:0,cucciolo:0,veggente:0,guardia:0,meretrice:0,arciere:0,avvocato:0,negromante:0,gesu:0,cappuccetto:0,romeo:0,giulietta:0,orfano:0,contaminato:0,piromane:0,accusatore:0,funambolo:0,custode:0,araldo:0,alchimista:0,criceto:0,misantropo:0,incompreso:0,lupoAlpha:0,suicida:0,mutaforma:0,condor:0,corvo:0,vampiro:0,villico:0};
  if(n<=7)  return {...base,lupo:1,veggente:1,villico:n-2};
  if(n<=11) return {...base,lupo:1,cucciolo:1,veggente:1,guardia:1,meretrice:1,villico:n-5};
  return         {...base,lupo:2,cucciolo:1,veggente:1,guardia:1,meretrice:1,criceto:1,misantropo:1,incompreso:1,villico:n-9};
}

// helper: check if a night step has an active player
function stepHasPlayer(step,ps){
  if(step==='lupi')return ps.some(p=>(p.role==='lupo'||p.role==='cucciolo')&&p.alive);
  return ps.some(p=>p.role===step&&p.alive);
}

// ─── WIN CHECK ────────────────────────────────────────────────────────────────
function checkWin(ps, ordineMode, vampPrede=[], mutRole=null, conRole=null){
  // Effective role: mutaforma/condor adopt their copied role for win checks
  const eR=p=>(p.role==='mutaforma'&&mutRole)?mutRole:(p.role==='condor'&&conRole)?conRole:p.role;
  // vampiro win: vamp + prede > others alive
  const vampAlive=ps.find(p=>p.alive&&p.role==='vampiro');
  if(vampAlive){
    const prAlive=vampPrede.filter(i=>ps[i]&&ps[i].alive).length;
    const aliveAll=ps.filter(p=>p.alive).length;
    const aliveNonVamp=aliveAll-1;
    if(prAlive>0&&1+prAlive>aliveNonVamp-prAlive)return'vampiro';
  }
  const wolves=ps.filter(p=>p.alive&&eR(p)!=='criceto'&&eR(p)!=='suicida'&&(ROLES[eR(p)].wolfTeam||ROLES[eR(p)].winsWithWolves)).length;
  const criceto=ps.find(p=>p.alive&&eR(p)==='criceto');
  if(ordineMode){
    const ordine =ps.filter(p=>p.alive&&eR(p)!=='criceto'&&eR(p)!=='suicida'&&!ROLES[eR(p)].wolfTeam&&!ROLES[eR(p)].winsWithWolves&&ROLES[eR(p)].isOrdine).length;
    const regular=ps.filter(p=>p.alive&&eR(p)!=='criceto'&&eR(p)!=='suicida'&&!ROLES[eR(p)].wolfTeam&&!ROLES[eR(p)].winsWithWolves&&!ROLES[eR(p)].isOrdine).length;
    const others=ordine+regular;
    if(criceto&&((wolves===0)!==(others===0)))return'criceto';
    if(wolves===0){if(ordine>0&&ordine>regular)return'ordine';return'villici';}
    if(wolves>others)return'lupi';
  }else{
    const others=ps.filter(p=>p.alive&&eR(p)!=='criceto'&&eR(p)!=='suicida'&&!ROLES[eR(p)].wolfTeam&&!ROLES[eR(p)].winsWithWolves).length;
    if(criceto&&((wolves===0)!==(others===0)))return'criceto';
    if(wolves===0)return'villici';
    if(wolves>others)return'lupi';
  }
  return null;
}

function getPoints(player,win,mutRole=null,conRole=null){
  const effKey=(player.role==='mutaforma'&&mutRole)?mutRole:(player.role==='condor'&&conRole)?conRole:player.role;
  const r=ROLES[effKey];const alive=player.alive;
  if(win==='criceto'&&effKey==='criceto')return 3.5;
  if(win==='suicida'&&effKey==='suicida'&&!alive)return 2.5;
  // corvo: vince se sopravvive (indipendentemente da chi vince)
  if(effKey==='corvo')return alive?1.5:0;
  // misantropo: 1.0 se vince coi lupi, +0.5 se vivo
  if(effKey==='misantropo'&&win==='lupi')return alive?1.5:1.0;
  if(win==='lupi'&&(r.wolfTeam||r.winsWithWolves))return alive?2.5:2.0;
  if((win==='villici'||win==='ordine')&&!r.wolfTeam&&!r.soloTeam&&!r.winsWithWolves)return alive?1.5:1.0;
  return 0;
}

// ─── QR DISPLAY ───────────────────────────────────────────────────────────────
function QRDisplay({text,size=160}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!ref.current||!window.QRCode)return;
    ref.current.innerHTML='';
    try{new window.QRCode(ref.current,{text,width:size,height:size,colorDark:'#c9a227',colorLight:'#04080f'});}
    catch(e){if(ref.current)ref.current.textContent=text;}
  },[text,size]);
  return <div ref={ref} style={{display:'flex',justifyContent:'center'}}/>;
}

function PList({players,sel,onSel,multi=false,disabledIds,badges}){
  const dSet=disabledIds instanceof Set?disabledIds:new Set(disabledIds||[]);
  const bdg=badges||{};
  return(
    <div className="slist">
      {players.map(p=>{
        const isSel=multi?(sel||[]).includes(p._i):sel===p._i;
        const isDisabled=dSet.has(p._i);
        return(
          <button key={p.id??p._i} className={`sbtn${isSel?' sel':''}`} disabled={isDisabled} onClick={()=>{
            if(isDisabled)return;
            if(multi){const c=sel||[];onSel(isSel?c.filter(x=>x!==p._i):[...c,p._i]);}
            else onSel(isSel?null:p._i);
          }}>
            <span style={{opacity:.4,fontSize:'.8rem'}}>👤</span>{p.name}
            {bdg[p._i]&&<span style={{fontSize:'.65rem',color:'#c9a227',fontFamily:'Cinzel,serif',marginLeft:5,opacity:.9}}>{bdg[p._i]}</span>}
            {isSel&&<span className="ck">✓</span>}
          </button>
        );
      })}
    </div>
  );
}

  const tc=r.soloTeam?'#f39c12':r.wolfTeam||r.winsWithWolves?'#e74c3c':'#2ecc71';

// ─── ERROR BOUNDARY ───────────────────────────────────────────────────────────
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return{err:e};}
  componentDidCatch(e,i){console.error('Lupus crash:',e,i);}
  render(){
    if(this.state.err){
      const msg=this.state.err?.message||'Errore sconosciuto';
      return(
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
          height:'100vh',background:'#04080f',color:'#c9a227',padding:24,textAlign:'center',fontFamily:'Cinzel,serif'}}>
          <div style={{fontSize:'3rem',marginBottom:16}}>🐺</div>
          <h2 style={{marginBottom:10,fontSize:'1.1rem'}}>Qualcosa è andato storto</h2>
          <p style={{color:'#5a4a30',fontSize:'.78rem',marginBottom:24,fontStyle:'italic',maxWidth:300,lineHeight:1.6}}>{msg}</p>
          <button onClick={()=>{try{localStorage.removeItem('lupus_v3');}catch(e){}window.location.reload();}}
            style={{background:'rgba(201,162,39,.15)',border:'1px solid rgba(201,162,39,.35)',borderRadius:10,
              padding:'12px 24px',color:'#c9a227',fontFamily:'Cinzel,serif',fontSize:'.85rem',cursor:'pointer',letterSpacing:'.05em'}}>
            🔄 Ricomincia
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

  // ── AUDIO ──────────────────────────────────────────────────────────────────

  const stopBg=()=>{
    if(sfxTRef.current){clearTimeout(sfxTRef.current);sfxTRef.current=null;}
    if(bgRef.current){bgRef.current.pause();bgRef.current=null;}
  };
  const playBg=(file,vol=0.35)=>{
    stopBg();
    const a=new Audio(file);
    a.loop=true;a.volume=mutedRef.current?0:vol;
    a.play().catch(()=>{});
    bgRef.current=a;
  };
  const playSfx=(file,vol=0.75)=>{
    if(mutedRef.current)return;
    const a=new Audio(file);a.volume=vol;
    a.play().catch(()=>{});
  };
  useEffect(()=>{
    mutedRef.current=muted;
    if(bgRef.current)bgRef.current.volume=muted?0:0.35;
  },[muted]);
  useEffect(()=>{
    if(sc==='night'){
      playSfx('transition_night.mp3');
      sfxTRef.current=setTimeout(()=>playBg('night.mp3',0.35),2200);
    }else if(sc==='day'){
      playSfx('transition_day.mp3');
      sfxTRef.current=setTimeout(()=>playBg('day.mp3',0.35),2200);
    }else if(sc==='roleReveal'){
      playBg('night.mp3',0.2);
    }else if(sc==='setup'||sc==='home'||sc==='gameOver'||sc==='rolePick'){

  // ── SAVE SCORES on game over ───────────────────────────────────────────────
  useEffect(()=>{
    if(sc==='gameOver'&&win&&players.length>0&&!scoresSavedRef.current){
      scoresSavedRef.current=true;
      const ns={...scores};
      players.forEach(p=>{
        const pts=getPoints(p,win,mutRole,conRole);
        if(!ns[p.name])ns[p.name]={pts:0,games:0,wins:0};
        ns[p.name].pts=Math.round((ns[p.name].pts+pts)*10)/10;
        ns[p.name].games+=1;
        if(pts>0)ns[p.name].wins+=1;
      });
      setScores(ns);
      saveScores(ns);
    }
  },[sc,win]);

  // ── LOAD ──

  useEffect(()=>{

  // ── NIGHT CONFIRMS ──
  const confGuard=()=>{if(gc===null)return;const guardIdx=players.findIndex(p=>p.role==='guardia'&&p.alive);if(gc===guardIdx)setGuardSelfUsed(true);const u=players.map((p,i)=>({...p,protected:i===gc}));setPlayers(u);advance('guardia',u);};
  const confArc=()=>{advance('arciere',players,{arcT:ac});};

  const confCus=()=>{if(cusC===null)return;setSilenced(cusC);advance('custode',players);};
  const skipCus=()=>{advance('custode',players);};

  const confSeer=()=>{

        });

  const endSeer=()=>{advance('veggente',players);};
  const confMer=()=>{if(mc===null)return;advance('meretrice',players,{mt:mc});};
  const skipMer=()=>{setMc(null);advance('meretrice',players,{mt:null});};
  const confNeg=()=>{

  const endAcc=()=>{setAccLast(round);advance('accusatore',players,{accRes:accR});};

  const skipCor=()=>{advance('corvo',players);};

  // ── RESOLVE ────────────────────────────────────────────────────────────────
  const PEACEFUL=['🌙 L\'alba sorge silenziosa. Il villaggio si desta indisturbato.','🌑 La notte scivola via come un segreto non detto.','🍂 Qualcosa si è mosso nel buio... ma all\'alba non manca nessuno.','🌫️ Una notte densa di sussurri, ma nessuna perdita da piangere.','🕯️ Le candele si sono spente una ad una. Il mattino arriva in pace.'];

  const resolve=(curP,ov={})=>{
    const evs=[];const np=curP.map(p=>({...p}));const dying=new Set();
    const wolfT=ov.wt!==undefined?ov.wt:wc;
    const merT=ov.mt!==undefined?ov.mt:mc;
    const arcT=ov.arcT!==undefined?ov.arcT:ac;
    const pirT=ov.pt!==undefined?ov.pt:pirC;
    const accRes=ov.accRes!==undefined?ov.accRes:accR;
    const aAct=ov.aAct!==undefined?ov.aAct:alchAct;
    const aT=ov.aT!==undefined?ov.aT:alchT;
    const aTs=ov.aTs!==undefined?ov.aTs:alchTs;
    const guardT=np.findIndex(p=>p.protected);
    const effRoleOf=(p)=>(p.role==='mutaforma'&&mutRole)?mutRole:(p.role==='condor'&&conRole)?conRole:p.role;

    // block set (arciere)
    const blocked=arcT!==null&&arcT!==undefined?new Set([arcT]):new Set();

    // meretrice
    const merIdx=np.findIndex(p=>p.role==='meretrice'&&p.alive);
    const cricIdx=np.findIndex(p=>p.role==='criceto'&&p.alive);
    const wolfOnMer=wolfT===merIdx&&merIdx!==-1;
    let merOnWolf=false,merOnSameAsWolf=false,merOut=false;
    if(merIdx!==-1&&merT!==null&&merT!==undefined){
      merOnWolf=ROLES[np[merT].role].wolfTeam;
      merOnSameAsWolf=merT===wolfT;
      merOut=true;
    }

    // wolf attack
    if(wolfT!==null&&wolfT!==undefined){
      const isCric=wolfT===cricIdx&&cricIdx!==-1;
      const isAlpha=np[wolfT]&&np[wolfT].role==='lupoAlpha'&&!alphaTransf&&!blocked.has(wolfT);
      const isFun=np[wolfT]&&np[wolfT].role==='funambolo';
      const funTesta=isFun&&funamboloCoin==='testa';
      const funCroce=isFun&&funamboloCoin==='croce';
      if(wolfOnMer){/* silent */}
      else if(isCric){/* silent – criceto survives */}
      else if(isAlpha){setAlphaTransf(true);/* silent – transforms next night */}
      else if(funTesta){/* funambolo immune stanotte */}
      else if(guardT===wolfT&&!funCroce){
        evs.push({t:'protected',tx:'🛡️ I morsi della notte non hanno trovato carne — qualcuno era sotto protezione.'});
        if(merOnSameAsWolf&&merIdx!==-1){/* also protected, silent */}
      }else{
        if(np[wolfT].role==='contaminato'){
          dying.add(wolfT);
          // Un Lupo Grande a caso muore la stessa mattina del Contaminato
          const lupiVivi=np.map((p,i)=>i).filter(i=>np[i].role==='lupo'&&np[i].alive);
          if(lupiVivi.length>0){
            dying.add(lupiVivi[Math.floor(Math.random()*lupiVivi.length)]);
          }
        }else{dying.add(wolfT);}
        if(merOnSameAsWolf&&merIdx!==-1)dying.add(merIdx);
        if(np[wolfT].role==='orfano')setOrfanoEff(true);
        if(np[wolfT].role==='cappuccetto')setCappKilled(true);
      }
    }

    // meretrice slept with wolf
    if(merIdx!==-1&&merOut&&merOnWolf&&!wolfOnMer)dying.add(merIdx);

    // veggente kills criceto
    if(seerKill!==null&&seerKill!==undefined&&np[seerKill]?.alive)dying.add(seerKill);

    // piromane
    if(pirT!==null&&pirT!==undefined&&np[pirT]){
      if(ROLES[np[pirT].role].wolfTeam)dying.add(pirT);
      else{const pIdx=np.findIndex(p=>p.role==='piromane'&&p.alive);if(pIdx!==-1)dying.add(pIdx);}
    }

    // accusatore
    if(accRes&&!accRes.isWolf){const aIdx=np.findIndex(p=>p.role==='accusatore'&&p.alive);if(aIdx!==-1)dying.add(aIdx);}

    // alchimista pozione nera (apply poison from PREVIOUS night)
    np.forEach((p,i)=>{if(p.poisoned&&p.alive){dying.add(i);np[i]={...np[i],poisoned:false};}});
    // mark new poison
    if(aAct==='nera'&&aT!==null&&aT!==undefined&&np[aT])np[aT]={...np[aT],poisoned:true};
    // pozione rossa
    if(aAct==='rossa'&&aTs.length===2){
      const chosen=aTs[Math.floor(Math.random()*2)];
      if(np[chosen]&&!np[chosen].alive){np[chosen]={...np[chosen],alive:true};evs.push({t:'revive',tx:`✨ La magia dell'Alchimista riporta in vita qualcuno… ${np[chosen].name} risorge!`});}
    }

    // apply deaths
    dying.forEach(i=>{
      if(np[i]?.alive){
        // funambolo testa: immune a qualsiasi morte
        const funIdx2=np.findIndex(p=>p.role==='funambolo'&&p.alive);
        if(i===funIdx2&&funamboloCoin==='testa')return;
        np[i]={...np[i],alive:false};
        evs.push({t:'death',tx:`💀 ${np[i].name} è stato trovato morto all'alba.`});
        // clear corvo votes if corvo dies
        if(effRoleOf(np[i])==='corvo')setCorvoVotes({});
        // gesù morto di notte → segna il round per resurrezione
        if(np[i].role==='gesu')setGesuDeath(round);
        // Romeo/Giulietta chain — ALL partners die, using effective role
        const er=effRoleOf(np[i]);
        if(er==='romeo'){
          np.forEach((p,j)=>{if(p.alive&&effRoleOf(p)==='giulietta'){np[j]={...np[j],alive:false};evs.push({t:'death',tx:`💀 ${np[j].name} non regge al dolore — muore anche lei.`});}});
        }
        if(er==='giulietta'){
          np.forEach((p,j)=>{if(p.alive&&effRoleOf(p)==='romeo'){np[j]={...np[j],alive:false};evs.push({t:'death',tx:`💀 ${np[j].name} non regge al dolore — muore anche lui.`});}});
        }
      }
    });

    // accusatore reveal
    if(accRes?.isWolf&&np[accRes.idx]){evs.push({t:'info',tx:`👁️ L'Accusatore rivela: ${np[accRes.idx].name} è un ${ROLES[np[accRes.idx].role].name}!`});}

    if(evs.length===0)evs.push({t:'peaceful',tx:PEACEFUL[Math.floor(Math.random()*PEACEFUL.length)]});

    // cucciolo transform
    const lupoOk=np.some(p=>p.role==='lupo'&&p.alive);
    const cucOk=np.some(p=>p.role==='cucciolo'&&p.alive);
    let nca=cAlone,ncf=false;
    if(!lupoOk&&cucOk&&!cAlone){nca=true;ncf=true;}
    else if(cAlone&&cFirst){nca=true;ncf=false;const ci=np.findIndex(p=>p.role==='cucciolo'&&p.alive);if(ci!==-1)np[ci]={...np[ci],role:'lupo'};}

    // gesù resurrezione — 3 mattine dopo la morte
    // Es: muore Notte 1 (round=1) → gesuDeath=1, resurge quando round-gesuDeath>=3
    // → Night 4 resolve (round=4): 4-1=3 ✓ → annuncio Mattina 4
    if(gesuDeath!==null&&round-gesuDeath>=3){
      const gi=np.findIndex(p=>p.role==='gesu'&&!p.alive);
      if(gi!==-1){np[gi]={...np[gi],alive:true};evs.push({t:'revive',tx:`✝️ Miracolo! ${np[gi].name} (Gesù) risorge dalla morte!`});setGesuDeath(null);}
    }

    setPlayers(np);setDe(evs);setSeerKill(null);setCAlone(nca);setCFirst(ncf);
    // ── Build night log entry ──────────────────────────────────────────────
    const na={};
    curP.forEach((p,i)=>{
      if(!p.alive)return;
      const r=p.role;
      if((r==='lupo'||r==='cucciolo'||r==='lupoAlpha'||(ROLES[r]&&ROLES[r].wolfTeam))&&wolfT!==null&&wolfT!==undefined)na[i]={target:wolfT,type:'wolf'};
      else if(r==='veggente'&&vc!==null&&vc!==undefined)na[i]={target:vc,type:'seer',seerRole:vr};
      else if(r==='guardia'&&gc!==null&&gc!==undefined)na[i]={target:gc,type:'guard'};
      else if(r==='meretrice'&&mc!==null&&mc!==undefined)na[i]={target:mc,type:'mer'};
      else if(r==='arciere'&&arcT!==null&&arcT!==undefined)na[i]={target:arcT,type:'arc'};
      else if(r==='custode'&&cusC!==null)na[i]={target:cusC,type:'custode'};
      else if(r==='negromante'&&negC!==null)na[i]={target:negC,type:'neg'};
      else if(r==='piromane'&&pirT!==null&&pirT!==undefined)na[i]={target:pirT,type:'pir'};
      else if(r==='accusatore'&&accC!==null)na[i]={target:accC,type:'acc'};
      else if(r==='mutaforma'&&mutC!==null)na[i]={target:mutC,type:'mut'};
      else if(r==='condor'&&conC!==null)na[i]={target:conC,type:'con'};
      else if(r==='corvo'&&corC!==null)na[i]={target:corC,type:'cor'};
      else if(r==='vampiro'&&vampC!==null)na[i]={target:vampC,type:'vamp'};
      else if(r==='alchimista'&&aAct!==null)na[i]={target:aAct==='rossa'?null:aT,type:'alch',act:aAct};
    });
    const nd={};
    dying.forEach(i=>{
      const cause=(seerKill!==null&&seerKill===i)?'seer':(wolfT===i)?'wolf':(merIdx!==undefined&&merIdx!==-1&&merOnWolf&&i===merIdx)?'mer':'other';
      nd[i]=cause;
    });
    setGameLog(prev=>[...prev,{round,actions:na,deaths:nd,voteVictim:null}]);
    const w=checkWin(np,ordineMode,vampPrede,mutRole,conRole);
    if(w){setWin(w);setSc('gameOver');}
    else{setVi(null);setSc('day');}
  };

  // ── VOTE ────────────────────────────────────────────────────────────────────
  const elimVote=()=>{
    if(vi===null)return;
    let np=players.map((p,i)=>i===vi?{...p,alive:false}:p);
    const vRole=players[vi].role;
    const vEffRole=(vRole==='mutaforma'&&mutRole)?mutRole:(vRole==='condor'&&conRole)?conRole:vRole;
    const effRoleOf2=(p)=>(p.role==='mutaforma'&&mutRole)?mutRole:(p.role==='condor'&&conRole)?conRole:p.role;
    if(vRole==='suicida'){
      const sName=players[vi].name;
      if(sName){
        const newSc={...scores};
        if(!newSc[sName])newSc[sName]={pts:0,wins:0,games:0};
        newSc[sName].pts+=2.5;newSc[sName].wins+=1;newSc[sName].games+=1;
        saveScores(newSc);setScores(newSc);
      }
      setSuicidaWonInfo(sName);
    }
    // corvo dies → clear all accumulated votes
    if(vEffRole==='corvo')setCorvoVotes({});
    // Romeo/Giulietta chain — use effective role, ALL partners die
    if(vEffRole==='romeo'){np=np.map((p,i)=>i!==vi&&p.alive&&effRoleOf2(p)==='giulietta'?{...p,alive:false}:p);}
    if(vEffRole==='giulietta'){np=np.map((p,i)=>i!==vi&&p.alive&&effRoleOf2(p)==='romeo'?{...p,alive:false}:p);}
    if(vRole==='gesu')setGesuDeath(round);
    // cappuccetto revival
    if(cappKilled&&ROLES[vEffRole]?.wolfTeam){
      np=np.map(p=>p.role==='cappuccetto'?{...p,alive:true}:p);
      setCappKilled(false);
    }
    setOrfanoEff(false);setSilenced(null);setAvvRm(null);
    setGameLog(prev=>{if(!prev.length)return prev;const a=[...prev];a[a.length-1]={...a[a.length-1],voteVictim:vi};return a;});
    setPlayers(np);
    const w=checkWin(np,ordineMode,vampPrede,mutRole,conRole);
    if(w){setWin(w);setSc('gameOver');}
    else{
      setRound(r=>r+1);
      const la=np.some(p=>p.role==='lupo'&&p.alive),ca2=np.some(p=>p.role==='cucciolo'&&p.alive);
      let nca=cAlone,ncf=cFirst;
      if(!la&&ca2&&!cAlone){nca=true;ncf=true;}
      startNight(np,nca,ncf);
    }
  };

  const skipVote=()=>{setOrfanoEff(false);setSilenced(null);setAvvRm(null);setRound(r=>r+1);startNight(players,cAlone,cFirst);};

  // ── DERIVED ────────────────────────────────────────────────────────────────
  const alive=players.map((p,i)=>({...p,_i:i})).filter(p=>p.alive);
  const dead=players.map((p,i)=>({...p,_i:i})).filter(p=>!p.alive);
  // returns true if the arciere has blocked the ONLY alive player of that role
  const isBlocked=(role)=>{
    if(ac===null||ac===undefined)return false;
    const idx=players.findIndex(p=>p.role===role&&p.alive);
    return idx!==-1&&ac===idx;
  };

  // ── NIGHT BACK ───────────────────────────────────────────────────────────────
  const goBackNightStep=()=>{
    // Smart back: if in a sub-phase of current step, reset to start of current step first
    if(ns==='veggente'&&vr!==null){setVc(null);setVr(null);return;}
    if(ns==='negromante'&&negR!==null){setNegC(null);setNegR(null);return;}
    if(ns==='accusatore'&&accR!==null){setAccC(null);setAccR(null);return;}
    if((ns==='mutaforma'||ns==='condor')&&mimicPhase==='result'){setMimicSel(null);setMimicData(null);setMimicPhase('select');return;}
    if(ns==='mutaforma'&&mutShowReveal){setMutShowReveal(false);setMutC(null);return;}
    if(ns==='condor'&&conShowReveal){setConShowReveal(false);setConC(null);return;}
    if(ns==='alchimista'&&alchAct!==null&&alchT===null&&alchTs.length===0){setAlchAct(null);setAlchUsed(false);return;}
    // Go to previous step
    const available=NIGHT_STEPS.filter(s=>stepHasPlayer(s,players));
    const idx=available.indexOf(ns);
    if(idx<=0)return;
    const prev=available[idx-1];
    setNs(prev);
    setShowStepHint(false);
    if(prev==='guardia'){setGc(null);setPlayers(ps=>ps.map(p=>({...p,protected:false})));}
    if(prev==='meretrice')setMc(null);
    if(prev==='lupi')setWc(null);
    if(prev==='veggente'){setVc(null);setVr(null);}
    if(prev==='arciere')setAc(null);
    if(prev==='custode')setCusC(null);
    if(prev==='negromante'){setNegC(null);setNegR(null);}
    if(prev==='accusatore'){setAccC(null);setAccR(null);}
    if(prev==='piromane')setPirC(null);
    if(prev==='alchimista'){setAlchAct(null);setAlchT(null);setAlchTs([]);setAlchUsed(false);}
    if(prev==='araldo')setAraldoCands([]);
    if(prev==='funambolo')setFunamboloCoin(null);
    if(prev==='mutaforma'){setMutC(null);setMutShowReveal(false);setMimicSel(null);setMimicData(null);setMimicPhase('select');}
    if(prev==='condor'){setConC(null);setConShowReveal(false);setMimicSel(null);setMimicData(null);setMimicPhase('select');}
    if(prev==='corvo')setCorC(null);
  };
  const canGoBack=()=>{
    if(ns==='veggente'&&vr!==null)return true;
    if(ns==='negromante'&&negR!==null)return true;
    if(ns==='accusatore'&&accR!==null)return true;
    if((ns==='mutaforma'||ns==='condor')&&mimicPhase==='result')return true;
    if(ns==='mutaforma'&&mutShowReveal)return true;
    if(ns==='condor'&&conShowReveal)return true;
    if(ns==='alchimista'&&alchAct!==null&&alchT===null&&alchTs.length===0)return true;
    const available=NIGHT_STEPS.filter(s=>stepHasPlayer(s,players));
    return available.indexOf(ns)>0;
  };

  // ── NightWrap component ────────────────────────────────────────────────────
  const NW=({color,emoji,title,children})=>(
    <div className="app night" style={{'--ni-col':color}}><MuteBtn/><div className="astro moon"/>
    <div style={{position:'fixed',inset:0,background:`radial-gradient(ellipse 60% 45% at 50% 20%,${color}18 0%,transparent 65%)`,pointerEvents:'none',zIndex:0}}/>
    {diceEv&&(
      <div className="dev-bg" onClick={()=>setDiceEv(null)}>

          <p className="dev-desc">{diceEv.desc}</p>
          <button className="btn btn-outline" style={{marginBottom:8}} onClick={()=>setDiceEv(RANDOM_EVENTS[Math.floor(Math.random()*RANDOM_EVENTS.length)])}>🎲 Tira di nuovo</button>
          <button className="btn btn-gold" onClick={()=>setDiceEv(null)}>Applica questo evento</button>
        </div>
      </div>
    )}
    <div className="screen fade">
      <div className="dice-row">
        <span className="pill">🌙 Notte {round}</span>
        <div style={{display:'flex',gap:6}}>
          {canGoBack()&&<button className="dbtn" style={{color:'#a09070',borderColor:'rgba(160,140,90,.3)'}} onClick={goBackNightStep}>← Indietro</button>}
          <button className="dbtn" onClick={()=>setDiceEv(RANDOM_EVENTS[Math.floor(Math.random()*RANDOM_EVENTS.length)])}>🎲 Dado</button>
        </div>
      </div>
      <div className="night-hdr"><span className="ni-em">{emoji}</span><div className="ni-title">{title}</div></div>
      {(()=>{
        // Progress dots: only steps with active players tonight
        const actSteps=NIGHT_STEPS.filter(s=>s==='lupi'?players.some(p=>(p.role==='lupo'||p.role==='cucciolo')&&p.alive):players.some(p=>p.role===s&&p.alive));
        const curIdx=actSteps.indexOf(ns);
        const hint=STEP_HINTS[ns];
        return(<>
          {actSteps.length>1&&(
            <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:5,marginBottom:14,flexWrap:'wrap'}}>
              {actSteps.map((s,i)=>{
                const done=i<curIdx, active=i===curIdx;
                return(<div key={s} title={ROLES[s==='lupi'?'lupo':s]?.name||s} style={{width:active?28:8,height:8,borderRadius:4,background:active?color:done?'rgba(201,162,39,.5)':'rgba(255,255,255,.12)',transition:'all .25s',flexShrink:0}}/>);
              })}
              <span style={{fontFamily:'Cinzel,serif',fontSize:'.6rem',letterSpacing:'.12em',color:'#4a3a20',marginLeft:4}}>{curIdx+1}/{actSteps.length}</span>
            </div>
          )}
          {hint&&(
            <div style={{marginBottom:14}}>
              <button onClick={()=>setShowStepHint(v=>!v)} style={{display:'flex',alignItems:'center',gap:6,background:'rgba(255,255,255,.04)',border:'1px solid rgba(255,255,255,.09)',borderRadius:20,padding:'5px 13px',cursor:'pointer',color:'#6a5a3a',fontFamily:'Cinzel,serif',fontSize:'.62rem',letterSpacing:'.1em',textTransform:'uppercase',WebkitTapHighlightColor:'transparent',transition:'border-color .15s',width:'100%',justifyContent:'space-between'}}
                onMouseEnter={e=>{e.currentTarget.style.borderColor='rgba(201,162,39,.3)'}} onMouseLeave={e=>{e.currentTarget.style.borderColor='rgba(255,255,255,.09)'}}>
                <span>📖 Regole del ruolo</span>
                <span style={{fontSize:'.7rem',transform:showStepHint?'rotate(180deg)':'none',transition:'transform .2s'}}>▼</span>
              </button>
              {showStepHint&&(
                <div style={{marginTop:6,background:'rgba(201,162,39,.05)',border:'1px solid rgba(201,162,39,.14)',borderRadius:10,padding:'12px 14px',animation:'fadeUp .2s ease'}}>
                  <ul style={{listStyle:'none',padding:0,margin:0}}>
                    {hint.rules.map((r,i)=>(
                      <li key={i} style={{display:'flex',gap:8,padding:'4px 0',fontSize:'.86rem',color:'#9a8660',lineHeight:1.5,borderBottom:i<hint.rules.length-1?'1px solid rgba(255,255,255,.04)':'none'}}>
                        <span style={{color:color,flexShrink:0,marginTop:2}}>•</span><span>{r}</span>
                      </li>
                    ))}
                  </ul>
                </div>
              )}
            </div>
          )}
        </>);
      })()}
      {children}
      <div className="div"/>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
        <div className="lbl" style={{marginBottom:0}}>Stato Giocatori</div>
        <button onClick={()=>setShowRoles(r=>!r)} style={{fontFamily:'Cinzel,serif',fontSize:'.62rem',letterSpacing:'.1em',textTransform:'uppercase',border:'1px solid rgba(200,160,90,.35)',borderRadius:20,padding:'4px 12px',background:showRoles?'rgba(200,160,90,.15)':'transparent',color:showRoles?'#c8a05a':'#6a5a40',cursor:'pointer',transition:'all .15s'}}>
          {showRoles?'👁 Nascondi':'👁 Ruoli'}
        </button>
      </div>
      <div className="player-grid">
        {players.map(p=>{
          const rawRk=p.role;
          const effRk=(rawRk==='mutaforma'&&mutRole)?mutRole:(rawRk==='condor'&&conRole)?conRole:rawRk;
          const r=ROLES[effRk];
          const isMimic=(rawRk==='mutaforma'||rawRk==='condor')&&effRk!==rawRk;
          return(
            <div key={p.id} className={`p-tok ${p.alive?'alive':'dead'}`}>
              {sindacoIdx>=0&&players[sindacoIdx]?.id===p.id&&p.alive&&<span className="pt-sindaco">🏛️</span>}
              {!p.alive&&<span className="pt-dead-x">✕</span>}
              <span className="pt-em">{showRoles||!p.alive?r.emoji:'👤'}</span>
              <span className="pt-name">{p.name}</span>
              {(showRoles||!p.alive)&&<span className="pt-role" style={{color:r.color}}>{r.name}{isMimic&&<span style={{opacity:.45,fontSize:'.8em'}}> ({ROLES[rawRk].emoji})</span>}</span>}
            </div>
          );
        })}
      </div>
      <div className="div"/>
      {!menuConfirm?(
        <button className="btn btn-outline" style={{color:'#6a5a40',borderColor:'rgba(100,80,50,.3)',fontSize:'.68rem'}} onClick={()=>setMenuConfirm(true)}>↩ Menu Principale</button>
      ):(
        <div style={{background:'rgba(192,57,43,.08)',border:'1px solid rgba(192,57,43,.25)',borderRadius:10,padding:'14px 16px'}}>
          <p style={{fontFamily:'Cinzel,serif',fontSize:'.78rem',color:'#e07060',letterSpacing:'.06em',marginBottom:10}}>⚠️ Tornare al menu? La partita verrà salvata.</p>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-red" style={{flex:1,padding:'10px'}} onClick={()=>{setMenuConfirm(false);newGame();}}>✓ Conferma</button>
            <button className="btn btn-outline" style={{flex:1,padding:'10px'}} onClick={()=>setMenuConfirm(false)}>✗ Annulla</button>
          </div>
        </div>
      )}
    </div></div>
  );

  // ═══════════════════════════════════════════════════════════════════════════
  // ── SETUP ──────────────────────────────────────────────────────────────────

                <span style={{width:72,textAlign:'right',flexShrink:0,fontFamily:'Cinzel,serif',fontSize:'.62rem',letterSpacing:'.1em',textTransform:'uppercase',color:'#6a5a40'}}>Partite</span>

        </div>

  // ── MUTE BUTTON (always visible) ───────────────────────────────────────────
  const MuteBtn=()=>(
    <button className="mute-btn" onClick={()=>setMuted(m=>!m)} title={muted?'Attiva audio':'Disattiva audio'}>
      {muted?'🔇':'🔊'}
    </button>
  );

  // ── HOME ────────────────────────────────────────────────────────────────────
  if(sc==='home'){
    const saved=loadGame();
    return(
      <div style={{position:'fixed',inset:0,overflow:'hidden',background:'#0d0a06'}}>
        <MuteBtn/>
        {showGuide&&<GuideModal/>}
        {infoModal&&<RoleModal roleKey={infoModal} onClose={()=>setInfoModal(null)}/>}
        {libro&&<LibroMagico onClose={()=>{setLibro(false);setLibroTab('tutti');}} initialCat={libroTab}/>}
        {showScores&&<ScoreboardModal/>}

        {/* Immagine fullscreen */}
        <div style={{position:'absolute',inset:0,backgroundImage:`url(${BG_IMG})`,backgroundSize:'cover',backgroundPosition:'center top'}}/>

        {/* Gradiente scuro nella metà bassa */}
        <div style={{position:'absolute',inset:0,background:'linear-gradient(to bottom,transparent 30%,rgba(8,4,1,.75) 52%,rgba(8,4,1,.96) 72%,rgba(8,4,1,1) 88%)'}}/>

        {/* Contenuto sopra */}
        <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',justifyContent:'space-between',padding:'16px 20px 36px'}}>

          {/* Top bar */}
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontFamily:'Cinzel,serif',fontSize:'.52rem',letterSpacing:'.14em',color:'rgba(255,255,255,.4)',textTransform:'uppercase'}}>v2.1</span>
            <button onClick={()=>{setGuideStep(0);setShowGuide(true);}}
              style={{background:'rgba(201,162,39,.12)',border:'1px solid rgba(201,162,39,.3)',borderRadius:'50%',width:22,height:22,color:'rgba(255,255,255,.65)',fontFamily:'Cinzel,serif',fontWeight:700,fontSize:'.72rem',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>?</button>
          </div>

          {/* Titolo (centrato verticalmente nella parte alta) */}
          <div style={{textAlign:'center',marginTop:'auto',marginBottom:'auto',paddingBottom:'5vh'}}>
            <h1 className="title glow" style={{fontSize:'clamp(1.7rem,7vw,2.6rem)',marginBottom:6,textShadow:'0 2px 20px rgba(0,0,0,.8)'}}>Lupus in Fabula</h1>
            <p className="subtitle" style={{opacity:.7,fontSize:'.85rem'}}>Narratore — Gestione Partita</p>
          </div>

          {/* Pulsanti nella parte bassa dell'immagine */}
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {saved&&(
              <button className="btn btn-gold" style={{fontSize:'.88rem',padding:'12px 16px'}}
                onClick={()=>{const s=loadGame();if(!s)return;
                  setSc(s.sc);setNames(s.names||[]);setVName(s.vName||'');setPlayers(s.players||[]);
                  setRi(s.ri||0);setRound(s.round||1);setNs(s.ns||'lupi');setDist(s.dist??null);
                  setDe(s.de||[]);setVi(s.vi??null);setWin(s.win??null);
                  setCAlone(s.cAlone||false);setCFirst(s.cFirst||false);
                  setPirUsed(s.pirUsed||false);setAlchUsed(s.alchUsed||false);setAraldoUsed(s.araldoUsed||false);
