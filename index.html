          <button className="btn btn-gold" onClick={skipCus}>Continua →</button></>
        ):round<2?(
          <><div className="instr">Il Custode non può ancora agire — il suo potere si attiva dalla seconda notte.</div>
          <button className="btn btn-gold" onClick={skipCus}>Continua →</button></>
        ):(
          <><div className="instr">Il Custode indica chi sarà costretto al silenzio domani.</div>
          <div className="nlbl">Chi silenziare?</div>
          <PList players={alive.filter(p=>p.role!=='custode')} sel={cusC} onSel={setCusC}/>
          <button className="btn btn-gold mb8" onClick={confCus} disabled={cusC===null}>Conferma</button>
          <button className="btn btn-outline" onClick={skipCus}>Passa senza agire</button></>
        )}
      </NW>
    );

    if(ns==='funambolo'){
      const flipCoin=()=>{setFunamboloCoin(Math.random()<0.5?'testa':'croce');};
      return(
        <NW color="#16a085" emoji="🎪" title="Il Funambolo cammina sul filo">
          <div className="instr">Il Narratore lancia in segreto la moneta del destino. Il risultato è solo suo.</div>
          {!funamboloCoin?(
            <>
              <div style={{textAlign:'center',padding:'24px 0'}}>
                <div style={{fontSize:'4rem',marginBottom:16,filter:'drop-shadow(0 0 12px rgba(22,160,133,.6))'}}>🪙</div>
                <p style={{color:'#5a8070',fontStyle:'italic',fontSize:'.88rem',marginBottom:20}}>Testa = immune a qualsiasi morte stanotte<br/>Croce = muore comunque, anche se protetto</p>
              </div>
              <button className="btn btn-gold mb8" style={{background:'rgba(22,160,133,.2)',borderColor:'rgba(22,160,133,.5)',color:'#1abc9c'}} onClick={flipCoin}>🪙 Lancia la Moneta</button>
            </>
          ):(
            <>
              <div style={{textAlign:'center',padding:'20px 0'}}>
                <div style={{fontSize:'4rem',marginBottom:12,animation:'fadeUp .4s ease'}}>{funamboloCoin==='testa'?'⭕':'❌'}</div>
                <div style={{fontFamily:'Cinzel,serif',fontSize:'1.2rem',color:funamboloCoin==='testa'?'#1abc9c':'#e74c3c',marginBottom:8,fontWeight:600}}>
                  {funamboloCoin==='testa'?'TESTA — Immune!':'CROCE — Vulnerabile!'}
                </div>
                <p style={{color:'#5a8070',fontStyle:'italic',fontSize:'.85rem'}}>
                  {funamboloCoin==='testa'?'Il Funambolo non può morire stanotte.':'Il Funambolo muore anche se protetto dalla Guardia.'}
                </p>
              </div>
              <button className="btn btn-outline mb8" style={{fontSize:'.72rem',color:'#5a8070'}} onClick={flipCoin}>↺ Rilancia</button>
              <button className="btn btn-gold" onClick={()=>advance('funambolo',players)}>Conferma →</button>
            </>
          )}
        </NW>
      );
    }

    if(ns==='lupi'){
      const lupoOk=players.some(p=>p.role==='lupo'&&p.alive);
      const cucHere=!lupoOk&&players.some(p=>p.role==='cucciolo'&&p.alive);
      const cucBlock=cucHere&&cFirst;
      // Arciere logic: lupoAlpha blocked = no attack; lupo (Lupo Alpha) blocked = no attack; cucciolo-solo blocked = no attack
      const alphaIdx=players.findIndex(p=>p.role==='lupoAlpha'&&p.alive);
      const arcBlockedAlpha=ac!==null&&ac===alphaIdx&&alphaIdx!==-1;
      const arcBlockedLupo=ac!==null&&players[ac]?.role==='lupo';
      const arcBlockedCucSolo=cucHere&&ac!==null&&players[ac]?.role==='cucciolo';
      const wolvesBlocked=arcBlockedAlpha||arcBlockedLupo||arcBlockedCucSolo;
      return(
        <NW color="#e74c3c" emoji="🐺" title={cucHere?'Il Lupo Cucciolo si sveglia':'I Lupi si svegliano'}>
          {wolvesBlocked?(
            <><div className="instr" style={{borderColor:'rgba(39,174,96,.3)',color:'#70a080'}}>🏹 L'Arciere ha bloccato {arcBlockedAlpha?'il Lupo Mannaro':arcBlockedLupo?'il Lupo Alpha':'il Cucciolo'}. Nessun attacco questa notte.</div>
            <button className="btn btn-gold" onClick={()=>confWolves(true)}>Conferma — nessuna vittima →</button></>
          ):cucBlock?(
            <><div className="instr">🐶 Il Cucciolo ha perso il suo branco. Questa notte non riesce ad agire — dalla prossima potrà uccidere.</div>
            <button className="btn btn-gold" onClick={()=>confWolves(true)}>Notte senza vittima →</button></>
          ):(
            <><div className="instr">{cucHere?'Il Cucciolo si è trasformato. Indica la vittima.':'I Lupi si riconoscono e scelgono la vittima in silenzio.'}</div>
            {lupoAlphaActivatedName&&<div style={{fontSize:'.82rem',color:'#e74c3c',fontWeight:600,marginBottom:10,padding:'8px 12px',background:'rgba(231,76,60,.1)',borderRadius:8,border:'1px solid rgba(231,76,60,.3)'}}>🐺 <strong>{lupoAlphaActivatedName}</strong> si è appena trasformato — è ora un Lupo Alpha. Chiamatelo stanotte nel turno del branco!</div>}
            {(()=>{const mIdx=players.findIndex(p=>p.role==='mutaforma'&&p.alive);const cIdx=players.findIndex(p=>p.role==='condor'&&p.alive);const mutW=mutRole&&ROLES[mutRole]?.wolfTeam;const conW=conRole&&ROLES[conRole]?.wolfTeam;return(<>{mutW&&mIdx!==-1&&<div style={{fontSize:'.78rem',color:'#bdc3c7',fontStyle:'italic',marginBottom:8,padding:'6px 10px',background:'rgba(189,195,199,.08)',borderRadius:6,border:'1px solid rgba(189,195,199,.2)'}}>🔄 {players[mIdx].name} (Mutaforma → {ROLES[mutRole].emoji}{ROLES[mutRole].name}) si sveglia con il branco.</div>}{conW&&cIdx!==-1&&<div style={{fontSize:'.78rem',color:'#d35400',fontStyle:'italic',marginBottom:8,padding:'6px 10px',background:'rgba(211,84,0,.08)',borderRadius:6,border:'1px solid rgba(211,84,0,.2)'}}>🦅 {players[cIdx].name} (Condor → {ROLES[conRole].emoji}{ROLES[conRole].name}) si sveglia con il branco.</div>}</>);})()}
            <div className="nlbl">Chi attaccano i Lupi?</div>
            <PList players={alive.filter(p=>{const ek=(p.role==='mutaforma'&&mutRole)?mutRole:(p.role==='condor'&&conRole)?conRole:p.role;return!ROLES[ek].wolfTeam&&!ROLES[ek].winsWithWolves&&ek!=='cucciolo';})} sel={wc} onSel={setWc}/>
            <button className="btn btn-gold mb8" onClick={()=>confWolves(false)} disabled={wc===null}>Conferma Vittima</button>
            <button className="btn btn-outline" onClick={()=>confWolves(true)}>Nessuna vittima</button></>
          )}
        </NW>
      );
    }

    if(ns==='veggente') return(
      <NW color="#9b59b6" emoji="🔮" title="La Veggente si sveglia">
        {isBlocked('veggente')?(
          <><div className="instr" style={{borderColor:'rgba(39,174,96,.3)',color:'#70a080'}}>🏹 L'Arciere ha bloccato la Veggente. Non può scrutare nessuno stanotte.</div>
          <button className="btn btn-gold" onClick={endSeer}>Continua →</button></>
        ):<><div className="instr">La Veggente scruta l'anima di un giocatore.</div>
        {vr?(
          <><div className="vbox fade">
            <div className="vlbl">Solo per il Narratore</div>
            <div style={{marginBottom:8,fontSize:'.95rem'}}><strong style={{color:'#c8a05a'}}>{players[vr.idx].name}</strong> appare come...</div>
            {(()=>{
              const isLupo=vr.seen==='lupo';
              return(
                <><div style={{fontSize:'2.5rem',marginBottom:8}}>{isLupo?'🐺':'🧑‍🌾'}</div>
                <div style={{color:isLupo?'#e74c3c':'#2ecc71',fontFamily:'Cinzel,serif',fontWeight:600}}>{isLupo?(vr.role==='lupo'?'Lupo Alpha':'Lupo Mannaro'):'Innocente'}</div>
                {vr.role==='lupo'&&<div style={{fontSize:'.74rem',marginTop:6,color:'#6a5a40',fontStyle:'italic'}}>(È il Lupo Alpha del branco)</div>}
                {vr.role==='cucciolo'&&<div style={{fontSize:'.74rem',marginTop:6,color:'#6a5a40',fontStyle:'italic'}}>(In realtà è il Lupo Cucciolo)</div>}
                {vr.role==='incompreso'&&<div style={{fontSize:'.74rem',marginTop:6,color:'#6a5a40',fontStyle:'italic'}}>(In realtà è l'Incompreso — è innocente)</div>}
                {vr.role==='lupoAlpha'&&<div style={{fontSize:'.74rem',marginTop:6,color:'#6a5a40',fontStyle:'italic'}}>(In realtà è il Lupo Mannaro — ancora innocente)</div>}
                {vr.role==='criceto'&&<div style={{fontSize:'.74rem',marginTop:8,color:'#c0392b',fontStyle:'italic',borderTop:'1px solid rgba(192,57,43,.25)',paddingTop:8}}>⚠️ Narratore: è il Criceto — morirà all'alba.</div>}
                </>
              );
            })()}
          </div>
          <p className="muted mb8" style={{textAlign:'center'}}>La Veggente richiude gli occhi</p>
          <button className="btn btn-gold" onClick={endSeer}>Fine turno →</button></>
        ):(
          <><div className="nlbl">Chi scruta?</div>
          <PList players={alive.filter(p=>p.role!=='veggente')} sel={vc} onSel={setVc}/>
          <button className="btn btn-gold" onClick={confSeer} disabled={vc===null}>Rivela Identità</button></>
        )}</>}
      </NW>
    );

    if(ns==='meretrice') return(
      <NW color="#c0392b" emoji="💋" title="La Meretrice si sveglia">
        {isBlocked('meretrice')?(
          <><div className="instr" style={{borderColor:'rgba(39,174,96,.3)',color:'#70a080'}}>🏹 L'Arciere ha bloccato la Meretrice. Resta a casa stanotte.</div>
          <button className="btn btn-gold" onClick={skipMer}>Continua →</button></>
        ):(
          <><div className="instr">La Meretrice indica da chi vuole passare la notte.</div>
          <div className="nlbl">Da chi va?</div>
          <PList players={alive.filter(p=>p.role!=='meretrice')} sel={mc} onSel={setMc}/>
          <button className="btn btn-gold mb8" onClick={confMer} disabled={mc===null}>Conferma</button>
          <button className="btn btn-outline" onClick={skipMer}>Resta a casa stanotte</button></>
        )}
      </NW>
    );

    if(ns==='negromante') return(
      <NW color="#7f8c8d" emoji="💀" title="Il Negromante si sveglia">
        {isBlocked('negromante')?(
          <><div className="instr" style={{borderColor:'rgba(39,174,96,.3)',color:'#70a080'}}>🏹 L'Arciere ha bloccato il Negromante. Non può interrogare i morti stanotte.</div>
          <button className="btn btn-gold" onClick={()=>{setNegC(null);endNeg();}}>Continua →</button></>
        ):negR?(
          <><div className="vbox fade">
            <div className="vlbl">Solo per il Narratore</div>
            <div style={{marginBottom:8}}><strong style={{color:'#c8a05a'}}>{players[negR.idx].name}</strong> era...</div>
            <div style={{fontSize:'2rem',marginBottom:6}}>{ROLES[negR.role].emoji}</div>
            <div style={{color:ROLES[negR.role].color,fontFamily:'Cinzel,serif',fontWeight:600}}>{ROLES[negR.role].name}</div>
          </div>
          <button className="btn btn-gold" onClick={endNeg}>Fine turno →</button></>
        ):(
          <>{dead.length===0?(
            <><div className="instr">Non ci sono ancora morti.</div>
            <button className="btn btn-gold" onClick={()=>{setNegC(null);endNeg();}}>Continua →</button></>
          ):(
            <><div className="nlbl">Quale morto esamina?</div>
            <PList players={dead} sel={negC} onSel={setNegC}/>
            <button className="btn btn-gold mb8" onClick={confNeg} disabled={negC===null}>Rivela Ruolo</button>
            <button className="btn btn-outline" onClick={()=>{setNegC(null);endNeg();}}>Passa senza agire</button></>
          )}</>
        )}
      </NW>
    );

    if(ns==='accusatore'){
      const canAct=round>=2&&(accLast===-1||round-accLast>=2);
      return(
        <NW color="#c0392b" emoji="👉" title="L'Accusatore si sveglia">
          {isBlocked('accusatore')?(
            <><div className="instr" style={{borderColor:'rgba(39,174,96,.3)',color:'#70a080'}}>🏹 L'Arciere ha bloccato l'Accusatore. Non può accusare stanotte.</div>
            <button className="btn btn-gold" onClick={skipAcc}>Continua →</button></>
          ):!canAct?(
            <><div className="instr">{round<2?'L\'Accusatore agisce dalla seconda notte.':'L\'Accusatore deve aspettare ancora una notte.'}</div>
            <button className="btn btn-gold" onClick={skipAcc}>Continua →</button></>
          ):accR?(
            <><div className="vbox fade">
              <div className="vlbl">Solo per il Narratore</div>
              {accR.isWolf?(<><div style={{fontSize:'2rem',marginBottom:6}}>🐺</div><div style={{color:'#e74c3c',fontFamily:'Cinzel,serif',fontWeight:600}}>È un Lupo! Verrà rivelato all'alba.</div></>
              ):(<><div style={{fontSize:'2rem',marginBottom:6}}>☠️</div><div style={{color:'#e74c3c',fontFamily:'Cinzel,serif',fontWeight:600}}>È innocente. L'Accusatore muore.</div></>)}
            </div>
            <button className="btn btn-gold" onClick={endAcc}>Fine turno →</button></>
          ):(
            <><div className="instr">L'Accusatore punta il dito. Se sbaglia, paga con la vita.</div>
            <div className="nlbl">Chi accusa?</div>
            <PList players={alive.filter(p=>p.role!=='accusatore')} sel={accC} onSel={setAccC}/>
            <button className="btn btn-gold mb8" onClick={confAcc} disabled={accC===null}>Accusa</button>
            <button className="btn btn-outline" onClick={skipAcc}>Passa senza agire</button></>
          )}
        </NW>
      );
    }

    if(ns==='piromane') return(
      <NW color="#e67e22" emoji="🔥" title="Il Piromane si sveglia">
        {isBlocked('piromane')?(
          <><div className="instr" style={{borderColor:'rgba(39,174,96,.3)',color:'#70a080'}}>🏹 L'Arciere ha bloccato il Piromane. Non può incendiare stanotte.</div>
          <button className="btn btn-gold" onClick={skipPir}>Continua →</button></>
        ):pirUsed?(
          <><div className="instr">Il Piromane ha già usato il suo fuoco. Osserva in silenzio.</div>
          <button className="btn btn-gold" onClick={skipPir}>Continua →</button></>
        ):(
          <><div className="instr">Il Piromane può incendiare una casa. Se è un lupo muore lui; se è innocente muore il Piromane.</div>
          <div className="nlbl">Chi incendia?</div>
          <PList players={alive.filter(p=>p.role!=='piromane')} sel={pirC} onSel={setPirC}/>
          <button className="btn btn-gold mb8" onClick={confPir} disabled={pirC===null}>Appicca il fuoco</button>
          <button className="btn btn-outline" onClick={skipPir}>Passa senza agire</button></>
        )}
      </NW>
    );

    if(ns==='alchimista') return(
      <NW color="#1abc9c" emoji="⚗️" title="L'Alchimista si sveglia">
        {isBlocked('alchimista')?(
          <><div className="instr" style={{borderColor:'rgba(39,174,96,.3)',color:'#70a080'}}>🏹 L'Arciere ha bloccato l'Alchimista. Non può usare pozioni stanotte.</div>
          <button className="btn btn-gold" onClick={skipAlch}>Continua →</button></>
        ):alchUsed?(
          <><div className="instr">L'Alchimista ha già usato la sua pozione.</div>
          <button className="btn btn-gold" onClick={skipAlch}>Continua →</button></>
        ):!alchAct?(
          <><div className="instr">L'Alchimista sceglie quale pozione usare.</div>
          <button className="btn btn-gold mb8" onClick={()=>confAlchAct('rossa')}>🔴 Pozione Rossa — Resuscita</button>
          <button className="btn btn-gold mb8" onClick={()=>confAlchAct('nera')}>⚫ Pozione Nera — Avvelena</button>
          <button className="btn btn-outline" onClick={skipAlch}>Passa senza agire</button></>
        ):alchAct==='rossa'?(
          <><div className="instr">Scegli 2 giocatori morti: uno verrà resuscitato a caso.</div>
          <div className="nlbl">Scegli 2 morti ({alchTs.length}/2)</div>
          <PList players={dead} sel={alchTs} onSel={setAlchTs} multi={true}/>
          <button className="btn btn-gold mb8" onClick={confAlchTarget} disabled={alchTs.length!==2}>Usa Pozione</button>
          <button className="btn btn-outline" onClick={()=>{setAlchAct(null);setAlchUsed(false);}}>← Indietro</button></>
        ):(
          <><div className="instr">Scegli un giocatore vivo da avvelenare. Morirà la prossima notte.</div>
          <div className="nlbl">Chi avvelena?</div>
          <PList players={alive.filter(p=>p.role!=='alchimista')} sel={alchT} onSel={setAlchT}/>
          <button className="btn btn-gold mb8" onClick={confAlchTarget} disabled={alchT===null}>Usa Pozione</button>
          <button className="btn btn-outline" onClick={()=>{setAlchAct(null);setAlchUsed(false);}}>← Indietro</button></>
        )}
      </NW>
    );

    if(ns==='araldo') return(
      <NW color="#d4ac0d" emoji="📯" title="L'Araldo del Crepuscolo si desta">
        {isBlocked('araldo')?(
          <><div className="instr" style={{borderColor:'rgba(39,174,96,.3)',color:'#70a080'}}>🏹 L'Arciere ha bloccato l'Araldo. Non può agire stanotte.</div>
          <button className="btn btn-gold" onClick={()=>advance('araldo',players)}>Continua →</button></>
        ):araldoUsed?(
          <><div className="instr">L'Araldo ha già usato il suo potere. Giace in silenzio.</div>
          <button className="btn btn-gold" onClick={()=>advance('araldo',players)}>Continua →</button></>
        ):round>3?(
          <><div className="instr">Il potere dell'Araldo è scaduto — poteva agire solo entro la terza notte.</div>
          <button className="btn btn-gold" onClick={()=>advance('araldo',players)}>Continua →</button></>
        ):(
          <>
            <div className="instr">L'Araldo forza il villaggio a scegliere tra due soli candidati per la votazione di oggi. Scegli i due nomi da imporre — poi l'Araldo muore.</div>
            <div className="nlbl">Primo candidato ({araldoCands.length>=1?players[araldoCands[0]].name:'non scelto'})</div>
            <PList players={alive.filter(p=>p.role!=='araldo'&&p._i!==araldoCands[1])} sel={araldoCands[0]??null} onSel={i=>{
              setAraldoCands(prev=>{const n=[...prev];n[0]=i;return n.filter((_,idx)=>idx<2);});
            }}/>
            <div className="nlbl" style={{marginTop:8}}>Secondo candidato ({araldoCands.length>=2?players[araldoCands[1]].name:'non scelto'})</div>
            <PList players={alive.filter(p=>p.role!=='araldo'&&p._i!==araldoCands[0])} sel={araldoCands[1]??null} onSel={i=>{
              setAraldoCands(prev=>{const n=[...prev];n[1]=i;return n.filter((_,idx)=>idx<2);});
            }}/>
            <button className="btn btn-gold mb8" onClick={()=>{
              setAraldoUsed(true);
              // l'araldo muore dopo aver usato il potere
              const np=players.map(p=>p.role==='araldo'?{...p,alive:false}:p);
              setPlayers(np);
              advance('araldo',np);
            }} disabled={araldoCands.length<2}>📯 Attiva il Potere (e muori)</button>
            <button className="btn btn-outline" onClick={()=>advance('araldo',players)}>Passa senza agire</button>
          </>
        )}
      </NW>
    );


    // ── MIMIC ACTION RENDERER (Mutaforma & Condor) ─────────────────────────────
    const renderMimicAction=(copiedRole,skipFn,advFn,actLabel,actorRole)=>{
      const r=ROLES[copiedRole];
      if(!r)return(<><div className="instr">Ruolo sconosciuto.</div><button className="btn btn-gold" onClick={skipFn}>Continua →</button></>);
      const hdr=<p style={{fontSize:'.76rem',color:r.color,fontStyle:'italic',textAlign:'center',marginBottom:10}}>{actLabel} {r.emoji} {r.name}</p>;
      // Wolf → handled in lupi step
      if(r.wolfTeam)return(<><div className="instr">Agisce con il branco nel turno dei Lupi.</div>{hdr}<button className="btn btn-gold" onClick={skipFn}>Continua →</button></>);
      // Powerless roles
      const powerless=['villico','avvocato','gesu','cappuccetto','romeo','giulietta','orfano','contaminato','misantropo','incompreso','suicida','criceto','lupoAlpha'];
      if(powerless.includes(copiedRole))return(<><div className="instr">Nessun potere notturno da esercitare.</div>{hdr}<button className="btn btn-gold" onClick={skipFn}>Continua →</button></>);
      // Funambolo
      if(copiedRole==='funambolo'){
        const coin=funamboloCoin!==null?funamboloCoin:null;
        return(<><div className="instr">Il Funambolo lancia la moneta ogni notte. Risultato di questa notte:<br/><strong style={{color:coin===true?'#2ecc71':coin===false?'#e74c3c':'#c9a227'}}>{coin===true?'🟢 Testa — Protetto':coin===false?'🔴 Croce — Esposto':'⏳ Ancora da lanciare questa notte'}</strong></div>{hdr}<button className="btn btn-gold" onClick={skipFn}>Continua →</button></>);
      }
      // Veggente → two-phase
      if(copiedRole==='veggente'){
        if(mimicPhase==='result'&&mimicData){
          const seen=mimicData.seen;
          return(<><div className="vbox fade"><div className="vlbl">Solo per il Narratore</div>
            <div style={{marginBottom:8,fontSize:'.95rem'}}><strong style={{color:'#c8a05a'}}>{players[mimicData.idx]?.name}</strong> appare come...</div>
            <div style={{fontSize:'2.5rem',marginBottom:8}}>{seen==='lupo'?'🐺':'🧑‍🌾'}</div>
            <div style={{color:seen==='lupo'?'#e74c3c':'#2ecc71',fontFamily:'Cinzel,serif',fontWeight:600}}>{seen==='lupo'?(mimicData.role==='lupo'?'Lupo Alpha':'Lupo Mannaro'):'Innocente'}</div>
            {mimicData.role==='lupo'&&<div style={{fontSize:'.74rem',marginTop:6,color:'#6a5a40',fontStyle:'italic'}}>(È il Lupo Alpha del branco)</div>}
            {mimicData.role==='criceto'&&<div style={{fontSize:'.74rem',marginTop:8,color:'#c0392b',fontStyle:'italic',borderTop:'1px solid rgba(192,57,43,.25)',paddingTop:8}}>⚠️ Narratore: è il Criceto — morirà all'alba.</div>}
          </div>{hdr}
          <button className="btn btn-gold" onClick={()=>{setMimicPhase('select');setMimicData(null);setMimicSel(null);advFn();}}>Fine turno →</button></>);
        }
        return(<><div className="instr">Scruta l'anima di un giocatore.</div>{hdr}
          <div className="nlbl">Chi scruta?</div>
          <PList players={alive.filter(p=>p.role!==actorRole)} sel={mimicSel} onSel={setMimicSel}/>
          <button className="btn btn-gold" onClick={()=>{if(mimicSel===null)return;const rawR2=players[mimicSel].role;const effR2=(rawR2==='mutaforma'&&mutRole)?mutRole:(rawR2==='condor'&&conRole)?conRole:rawR2;const seen=ROLES[effR2].seerSees;if(effR2==='criceto')setSeerKill(mimicSel);setMimicData({idx:mimicSel,role:effR2,seen});setMimicPhase('result');}} disabled={mimicSel===null}>Rivela Identità</button></>);
      }
      // Negromante → two-phase
      if(copiedRole==='negromante'){
        if(mimicPhase==='result'&&mimicData){
          const dr=ROLES[players[mimicData.idx]?.role];
          return(<><div className="vbox fade"><div className="vlbl">Solo per il Narratore</div>
            <div style={{marginBottom:8,fontSize:'.95rem'}}><strong style={{color:'#c8a05a'}}>{players[mimicData.idx]?.name}</strong> in vita era...</div>
            <div style={{fontSize:'2.5rem',marginBottom:8}}>{dr?.emoji}</div>
            <div style={{color:dr?.color,fontFamily:'Cinzel,serif',fontWeight:600}}>{dr?.name}</div>
          </div>{hdr}
          <button className="btn btn-gold" onClick={()=>{setMimicPhase('select');setMimicData(null);setMimicSel(null);advFn();}}>Fine turno →</button></>);
        }
        return(<><div className="instr">Evoca lo spirito di un morto per scoprirne il ruolo.</div>{hdr}
          <div className="nlbl">Chi evoca?</div>
          <PList players={dead} sel={mimicSel} onSel={setMimicSel}/>
          <button className="btn btn-gold" onClick={()=>{if(mimicSel===null||!dead.length)return;setMimicData({idx:mimicSel});setMimicPhase('result');}} disabled={mimicSel===null||!dead.length}>Evoca Spirito</button></>);
      }
      // Accusatore → two-phase
      if(copiedRole==='accusatore'){
        if(mimicPhase==='result'&&mimicData){
          const isW=mimicData.isWolf;
          return(<><div className="vbox fade"><div className="vlbl">Solo per il Narratore</div>
            <div style={{marginBottom:8,fontSize:'.95rem'}}><strong style={{color:'#c8a05a'}}>{players[mimicData.idx]?.name}</strong>...</div>
            {isW?(<><div style={{fontSize:'2rem',marginBottom:6}}>🐺</div><div style={{color:'#e74c3c',fontFamily:'Cinzel,serif',fontWeight:600}}>È un Lupo! Viene rivelato domani.</div></>):
              (<><div style={{fontSize:'2rem',marginBottom:6}}>☠️</div><div style={{color:'#9a8870',fontFamily:'Cinzel,serif',fontWeight:600}}>Innocente — l'Accusatore sarebbe morto.</div></>)}
          </div>{hdr}
          <button className="btn btn-gold" onClick={()=>{setMimicPhase('select');setMimicData(null);setMimicSel(null);advFn();}}>Continua →</button></>);
        }
        return(<><div className="instr">Accusa un giocatore — scopre se è Lupo o innocente (con conseguenze).</div>{hdr}
          <div className="nlbl">Chi accusa?</div>
          <PList players={alive.filter(p=>p.role!==actorRole)} sel={mimicSel} onSel={setMimicSel}/>
          <button className="btn btn-gold" onClick={()=>{if(mimicSel===null)return;const rawAm=players[mimicSel].role;const effAm=(rawAm==='mutaforma'&&mutRole)?mutRole:(rawAm==='condor'&&conRole)?conRole:rawAm;setMimicData({idx:mimicSel,isWolf:ROLES[effAm].wolfTeam||ROLES[effAm].winsWithWolves});setMimicPhase('result');}} disabled={mimicSel===null}>Accusa</button></>);
      }
      // Guardia → protect
      if(copiedRole==='guardia'){
        if(mimicPhase==='result'&&mimicData)return(<><div className="instr">✅ <strong>{players[mimicData.idx]?.name}</strong> è protetto stanotte.</div>{hdr}<button className="btn btn-gold" onClick={()=>{setMimicPhase('select');setMimicData(null);setMimicSel(null);advFn();}}>Continua →</button></>);
        return(<><div className="instr">Protegge silenziosamente un giocatore.</div>{hdr}
          <div className="nlbl">Chi protegge?</div>
          <PList players={alive.filter(p=>p.role!==actorRole)} sel={mimicSel} onSel={setMimicSel}/>
          <button className="btn btn-gold" onClick={()=>{if(mimicSel===null)return;setPlayers(ps=>ps.map((p,i)=>({...p,protected:i===mimicSel?true:p.protected})));setMimicData({idx:mimicSel});setMimicPhase('result');}} disabled={mimicSel===null}>Conferma Protezione</button></>);
      }
      // Custode → silence
      if(copiedRole==='custode'){
        if(mimicPhase==='result'&&mimicData)return(<><div className="instr">🤫 <strong>{players[mimicData.idx]?.name}</strong> sarà silenziato domani.</div>{hdr}<button className="btn btn-gold" onClick={()=>{setMimicPhase('select');setMimicData(null);setMimicSel(null);advFn();}}>Continua →</button></>);
        return(<><div className="instr">Silenzia un giocatore: non potrà parlare né votare domani.</div>{hdr}
          <div className="nlbl">Chi silenzia?</div>
          <PList players={alive.filter(p=>p.role!==actorRole)} sel={mimicSel} onSel={setMimicSel}/>
          <button className="btn btn-gold" onClick={()=>{if(mimicSel===null)return;setSilenced(mimicSel);setMimicData({idx:mimicSel});setMimicPhase('result');}} disabled={mimicSel===null}>Silenzia</button></>);
      }
      // Condor → pick a dead player, absorb their role (updates mutRole for mutaforma)
      if(copiedRole==='condor'){
        if(mimicPhase==='result'&&mimicData){
          const dr=ROLES[players[mimicData.idx]?.role];
          return(<><div className="vbox fade"><div className="vlbl">Solo per il Narratore</div>
            <div style={{marginBottom:8,fontSize:'.95rem'}}><strong style={{color:'#c8a05a'}}>{players[mimicData.idx]?.name}</strong> era...</div>
            <div style={{fontSize:'2.5rem',marginBottom:8}}>{dr?.emoji}</div>
            <div style={{color:dr?.color,fontFamily:'Cinzel,serif',fontWeight:600}}>{dr?.name}</div>
            <div style={{fontSize:'.74rem',marginTop:8,color:'#6a5a40',fontStyle:'italic'}}>Assorbito — dalla prossima notte agirà con questo ruolo.</div>
          </div>{hdr}
          <button className="btn btn-gold" onClick={()=>{
            const absorbed=players[mimicData.idx]?.role;
            if(absorbed&&actorRole==='mutaforma')setMutRole(absorbed);
            setMimicPhase('select');setMimicData(null);setMimicSel(null);
            advFn();
          }}>Fine turno →</button></>);
        }
        if(!dead.length)return(<><div className="instr">Nessun morto da cui assorbire ancora — aspetta che cada qualcuno.</div>{hdr}<button className="btn btn-gold" onClick={skipFn}>Continua →</button></>);
        return(<><div className="instr">Assorbe l'essenza di un caduto — sceglie chi tra i morti.</div>{hdr}
          <div className="nlbl">Chi assorbe?</div>
          <PList players={dead} sel={mimicSel} onSel={setMimicSel}/>
          <button className="btn btn-gold" onClick={()=>{if(mimicSel===null)return;setMimicData({idx:mimicSel});setMimicPhase('result');}} disabled={mimicSel===null}>🦅 Assorbi Essenza</button>
          <button className="btn btn-outline" onClick={skipFn}>Passa senza scegliere</button></>);
      }
      // Corvo → add hidden vote
      if(copiedRole==='corvo'){        if(mimicPhase==='result'&&mimicData)return(<><div className="instr">🪶 Voto nascosto aggiunto contro <strong>{players[mimicData.idx]?.name}</strong>.</div>{hdr}<button className="btn btn-gold" onClick={()=>{setMimicPhase('select');setMimicData(null);setMimicSel(null);advFn();}}>Continua →</button></>);
        return(<><div className="instr">Aggiunge un voto nascosto contro un giocatore.</div>{hdr}
          <div className="nlbl">Chi colpisce?</div>
          <PList players={alive.filter(p=>p.role!==actorRole)} sel={mimicSel} onSel={setMimicSel}/>
          <button className="btn btn-gold" onClick={()=>{if(mimicSel===null)return;setCorvoVotes(cv=>({...cv,[mimicSel]:(cv[mimicSel]||0)+1}));setMimicData({idx:mimicSel});setMimicPhase('result');}} disabled={mimicSel===null}>Aggiungi Voto</button></>);
      }
      // Vampiro → bite
      if(copiedRole==='vampiro'){
        if(mimicPhase==='result'&&mimicData)return(<><div className="instr">🧛 <strong>{players[mimicData.idx]?.name}</strong> è stata morsa — è una nuova Preda.</div>{hdr}<button className="btn btn-gold" onClick={()=>{setMimicPhase('select');setMimicData(null);setMimicSel(null);advFn();}}>Continua →</button></>);
        const bitable=alive.filter(p=>p.role!==actorRole&&p.role!=='vampiro'&&!vampPrede.includes(p._i));
        return(<><div className="instr">Morde una vittima che diventa sua Preda segreta.</div>{hdr}
          <div className="nlbl">Chi morde?</div>
          <PList players={bitable} sel={mimicSel} onSel={setMimicSel}/>
          <button className="btn btn-gold mb8" onClick={()=>{if(mimicSel===null)return;setVampPrede(vp=>[...vp,mimicSel]);setMimicData({idx:mimicSel});setMimicPhase('result');}} disabled={mimicSel===null}>Mordi</button>
          <button className="btn btn-outline" onClick={skipFn}>Passa senza mordere</button></>);
      }
      // Arciere → narrator note
      if(copiedRole==='arciere'){
        if(mimicPhase==='result'&&mimicData)return(<><div className="instr">🏹 <strong>{players[mimicData.idx]?.name}</strong> è bloccato stanotte (il Narratore gestisce gli effetti).</div>{hdr}<button className="btn btn-gold" onClick={()=>{setMimicPhase('select');setMimicData(null);setMimicSel(null);advFn();}}>Continua →</button></>);
        return(<><div className="instr">Blocca i poteri di un giocatore stanotte (il Narratore gestisce gli effetti).</div>{hdr}
          <div className="nlbl">Chi blocca?</div>
          <PList players={alive.filter(p=>p.role!==actorRole)} sel={mimicSel} onSel={setMimicSel}/>
          <button className="btn btn-gold" onClick={()=>{if(mimicSel===null)return;setMimicData({idx:mimicSel});setMimicPhase('result');}} disabled={mimicSel===null}>Conferma</button></>);
      }
      // Meretrice → narrator note
      if(copiedRole==='meretrice'){
        return(<><div className="instr">Visita qualcuno stanotte — il Narratore gestisce gli effetti.</div>{hdr}
          <div className="nlbl">Chi visita?</div>
          <PList players={alive.filter(p=>p.role!==actorRole)} sel={mimicSel} onSel={setMimicSel}/>
          <button className="btn btn-gold mb8" onClick={()=>{setMimicSel(null);advFn();}} disabled={mimicSel===null}>Azione compiuta →</button>
          <button className="btn btn-outline" onClick={skipFn}>Passa senza agire</button></>);
      }
      // Alchimista → narrator note
      if(copiedRole==='alchimista'){
        return(<><div className="instr">Usa la pozione (Rossa o Nera) — il Narratore gestisce l'effetto.</div>{hdr}
          <button className="btn btn-gold mb8" onClick={()=>advFn()}>Pozione usata →</button>
          <button className="btn btn-outline" onClick={skipFn}>Passa senza usarla</button></>);
      }
      // Piromane → narrator note
      if(copiedRole==='piromane'){
        return(<><div className="instr">Può incendiare una casa (una volta per partita) — il Narratore gestisce.</div>{hdr}
          <div className="nlbl">Chi incendia (opzionale)?</div>
          <PList players={alive.filter(p=>p.role!==actorRole)} sel={mimicSel} onSel={setMimicSel}/>
          <button className="btn btn-gold mb8" onClick={()=>advFn()}>Azione compiuta →</button>
          <button className="btn btn-outline" onClick={skipFn}>Passa senza agire</button></>);
      }
      // Araldo → narrator note
      if(copiedRole==='araldo'){
        return(<><div className="instr">Forza il voto tra due candidati (una volta per partita) — il Narratore gestisce.</div>{hdr}
          <button className="btn btn-gold" onClick={()=>advFn()}>Azione compiuta →</button></>);
      }
      // Fallback
      return(<><div className="instr">Agisce come <strong style={{color:r.color}}>{r.name}</strong>. Il Narratore gestisce.</div>{hdr}
        <button className="btn btn-gold mb8" onClick={()=>advFn()}>Azione compiuta →</button>
        <button className="btn btn-outline" onClick={skipFn}>Passa senza agire</button></>);
    };

    if(ns==='mutaforma'){
      const mutIsWolf=mutRole&&ROLES[mutRole]?.wolfTeam;
      return(
        <NW color="#bdc3c7" emoji="👤" title="Il Mutaforma si sveglia">
          {isBlocked('mutaforma')?(
            <><div className="instr" style={{borderColor:'rgba(39,174,96,.3)',color:'#70a080'}}>🏹 L'Arciere ha bloccato il Mutaforma. Non può agire stanotte.</div>
            <button className="btn btn-gold" onClick={skipMut}>Continua →</button></>
          ):round<2?(
            <><div className="instr">Il Mutaforma è in attesa — si attiva dalla seconda notte.</div>
            <button className="btn btn-gold" onClick={skipMut}>Continua →</button></>
          ):mutShowReveal?(
            <><div className="vbox fade">
              <div className="vlbl">Solo per il Narratore</div>
              <div style={{marginBottom:8,fontSize:'.95rem'}}><strong style={{color:'#c8a05a'}}>{players[mutC]?.name}</strong> era...</div>
              <div style={{fontSize:'2.5rem',marginBottom:8}}>{ROLES[players[mutC]?.role]?.emoji}</div>
              <div style={{color:ROLES[players[mutC]?.role]?.color,fontFamily:'Cinzel,serif',fontWeight:600}}>{ROLES[players[mutC]?.role]?.name}</div>
              <div style={{fontSize:'.74rem',marginTop:8,color:'#6a5a40',fontStyle:'italic'}}>Il Mutaforma ha assunto questo ruolo per sempre.</div>
            </div>
            <button className="btn btn-gold" onClick={()=>{setMutShowReveal(false);advance('mutaforma',players);}}>Fine turno →</button></>
          ):mutRole?(
            mutIsWolf?(
              <><div className="instr">🐺 Il Mutaforma si è trasformato in <strong style={{color:ROLES[mutRole].color}}>{ROLES[mutRole].name}</strong>.<br/>Ha già agito con il branco — nessuna azione separata.</div>
              <p style={{fontSize:'.76rem',color:'#7a6a50',fontStyle:'italic',textAlign:'center',marginBottom:10}}>🔄 In metamorfosi: {ROLES[mutRole].emoji} {ROLES[mutRole].name}</p>
              <button className="btn btn-gold" onClick={skipMut}>Continua →</button></>
            ):(
              renderMimicAction(mutRole,skipMut,()=>advance('mutaforma',players),'🔄 In metamorfosi:','mutaforma')
            )
          ):(
            <><div className="instr">Prima trasformazione — il Mutaforma sceglie chi assumere per sempre.</div>
            <div className="nlbl">Chi copia?</div>
            <PList players={alive.filter(p=>p.role!=='mutaforma')} sel={mutC} onSel={setMutC}/>
            <button className="btn btn-gold mb8" onClick={confMut} disabled={mutC===null}>🔄 Trasformati</button>
            <button className="btn btn-outline" onClick={skipMut}>Passa senza scegliere</button></>
          )}
        </NW>
      );
    }

    if(ns==='condor'){
      const conIsWolf=conRole&&ROLES[conRole]?.wolfTeam;
      return(
        <NW color="#d35400" emoji="🦅" title="Il Condor si sveglia">
          {isBlocked('condor')?(
            <><div className="instr" style={{borderColor:'rgba(39,174,96,.3)',color:'#70a080'}}>🏹 L'Arciere ha bloccato il Condor. Non può agire stanotte.</div>
            <button className="btn btn-gold" onClick={skipCon}>Continua →</button></>
          ):round<2?(
            <><div className="instr">Il Condor non è ancora pronto — si attiva dalla seconda notte.</div>
            <button className="btn btn-gold" onClick={skipCon}>Continua →</button></>
          ):conRole?(
            conIsWolf?(
              <><div className="instr">🐺 Il Condor ha assorbito l'essenza di <strong style={{color:ROLES[conRole].color}}>{ROLES[conRole].name}</strong>.<br/>Ha già agito con il branco — nessuna azione separata.</div>
              <p style={{fontSize:'.76rem',color:'#7a6a50',fontStyle:'italic',textAlign:'center',marginBottom:10}}>🦅 Assorbito: {ROLES[conRole].emoji} {ROLES[conRole].name}</p>
              <button className="btn btn-gold" onClick={skipCon}>Continua →</button></>
            ):(
              renderMimicAction(conRole,skipCon,()=>advance('condor',players),'🦅 Assorbito:','condor')
            )
          ):conShowReveal?(
            <><div className="vbox fade">
              <div className="vlbl">Solo per il Narratore</div>
              <div style={{marginBottom:8,fontSize:'.95rem'}}><strong style={{color:'#c8a05a'}}>{players[conC]?.name}</strong> era...</div>
              <div style={{fontSize:'2.5rem',marginBottom:8}}>{ROLES[players[conC]?.role]?.emoji}</div>
              <div style={{color:ROLES[players[conC]?.role]?.color,fontFamily:'Cinzel,serif',fontWeight:600}}>{ROLES[players[conC]?.role]?.name}</div>
              <div style={{fontSize:'.74rem',marginTop:8,color:'#6a5a40',fontStyle:'italic'}}>Il Condor ha assorbito questa essenza per sempre.</div>
            </div>
            <button className="btn btn-gold" onClick={()=>{setConShowReveal(false);advance('condor',players);}}>Fine turno →</button></>
          ):dead.length===0?(
            <><div className="instr">Nessun morto da cui assorbire ancora — il Condor attende.</div>
            <button className="btn btn-gold" onClick={skipCon}>Continua →</button></>
          ):(
            <><div className="instr">Prima apertura d'ali — il Condor assorbe l'essenza di un caduto per sempre.</div>
            <div className="nlbl">Chi assorbe?</div>
            <PList players={dead} sel={conC} onSel={setConC}/>
            <button className="btn btn-gold mb8" onClick={confCon} disabled={conC===null}>🦅 Assorbi</button>
            <button className="btn btn-outline" onClick={skipCon}>Passa senza scegliere</button></>
          )}
        </NW>
      );
    }

    if(ns==='corvo') return(
      <NW color="#2c3e50" emoji="🪶" title="Il Corvo gracchia nell'ombra">
        {isBlocked('corvo')?(
          <><div className="instr" style={{borderColor:'rgba(39,174,96,.3)',color:'#70a080'}}>🏹 L'Arciere ha bloccato il Corvo. Non può aggiungere voti stanotte.</div>
          <button className="btn btn-gold" onClick={skipCor}>Continua →</button></>
        ):(
          <><div className="instr">Il Corvo aggiunge un voto nascosto. Domani quel giocatore inizierà con un voto in più.</div>
          <div className="nlbl">Chi colpisce?</div>
          <PList players={alive.filter(p=>p.role!=='corvo')} sel={corC} onSel={setCorC}/>
          <button className="btn btn-gold mb8" onClick={confCor} disabled={corC===null}>Aggiungi Voto</button>
          <button className="btn btn-outline" onClick={skipCor}>Passa senza agire</button></>
        )}
      </NW>
    );

    if(ns==='vampiro'){
      const alivePrede=vampPrede.filter(i=>players[i]&&players[i].alive);
      const aliveNotPredaNotVamp=alive.filter(p=>p.role!=='vampiro'&&!vampPrede.includes(p._i));
      return(
        <NW color="#6c3483" emoji="🧛" title="Il Vampiro si desta nell'ombra">
          {isBlocked('vampiro')?(
            <><div className="instr" style={{borderColor:'rgba(39,174,96,.3)',color:'#70a080'}}>🏹 L'Arciere ha bloccato il Vampiro. Non può mordere stanotte.</div>
            <button className="btn btn-gold" onClick={skipVamp}>Continua →</button></>
          ):(
            <>
              {alivePrede.length>0&&(
                <div style={{background:'rgba(108,52,131,.1)',border:'1px solid rgba(108,52,131,.3)',borderRadius:10,padding:'10px 14px',marginBottom:14}}>
                  <div style={{fontFamily:'Cinzel,serif',fontSize:'.65rem',letterSpacing:'.15em',textTransform:'uppercase',color:'#9b59b6',marginBottom:6}}>🩸 Prede in vita ({alivePrede.length})</div>
                  <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                    {alivePrede.map(i=>(
                      <span key={i} style={{fontFamily:'Cinzel,serif',fontSize:'.7rem',padding:'3px 9px',borderRadius:10,background:'rgba(108,52,131,.2)',border:'1px solid rgba(108,52,131,.35)',color:'#b080d0'}}>{players[i].name}</span>
                    ))}
                  </div>
                </div>
              )}
              <div className="instr">Il Vampiro sceglie chi mordere stanotte. La nuova Preda non lo saprà finché non sarà troppo tardi.</div>
              <div className="nlbl">Chi morde?</div>
              <PList players={aliveNotPredaNotVamp} sel={vampC} onSel={setVampC}/>
              <button className="btn btn-gold mb8" style={{background:'rgba(108,52,131,.2)',borderColor:'rgba(108,52,131,.5)',color:'#b080d0'}} onClick={confVamp} disabled={vampC===null}>🩸 Morde</button>
              <button className="btn btn-outline" onClick={skipVamp}>Passa senza mordere</button>
            </>
          )}
        </NW>
      );
    }
  }

  // ── DAY ─────────────────────────────────────────────────────────────────────
  if(sc==='day'){
    const corvoThisRound=Object.entries(corvoVotes).filter(([i])=>players[i]?.alive);
    const silName=silenced!==null&&players[silenced]?players[silenced].name:null;
    const rollDice=()=>setDiceEv(RANDOM_EVENTS[Math.floor(Math.random()*RANDOM_EVENTS.length)]);
    return(
      <div className="app day"><MuteBtn/><div className="astro sun"/>
      {diceEv&&(
        <div className="dev-bg" onClick={()=>setDiceEv(null)}>
          <div className="dev-box" onClick={e=>e.stopPropagation()}>
            <button className="dev-close" onClick={()=>setDiceEv(null)}>✕</button>
            <span className="dev-icon">{diceEv.icon}</span>
            <div className="dev-name">{diceEv.name}</div>
            <div className="dev-when" style={{color:diceEv.color}}>⏱ {diceEv.when} • #{diceEv.id}/6</div>
            <p className="dev-desc">{diceEv.desc}</p>
            <button className="btn btn-outline" style={{marginBottom:8}} onClick={()=>setDiceEv(RANDOM_EVENTS[Math.floor(Math.random()*RANDOM_EVENTS.length)])}>🎲 Tira di nuovo</button>
            <button className="btn btn-gold" onClick={()=>setDiceEv(null)}>Applica questo evento</button>
          </div>
        </div>
      )}
      <div className="screen fade">
        <div className="dice-row">
          <span className="pill" style={{background:'rgba(200,120,20,.12)',borderColor:'rgba(200,120,20,.28)',color:'#d4821a'}}>☀️ Giorno {round}</span>
          <button className="dbtn" onClick={rollDice}>🎲 Dado</button>
        </div>
        <div style={{textAlign:'center',marginBottom:20}}>
          <span style={{fontSize:'2.8rem',display:'block',marginBottom:6,filter:'drop-shadow(0 0 20px rgba(210,120,10,.35))'}}>☀️</span>
          <div style={{fontFamily:'Cinzel,serif',fontSize:'1rem',color:'#d4821a',letterSpacing:'.06em'}}>{vName} si sveglia</div>
        </div>
        {/* ── GUIDA FASI GIORNO ── */}
        <div style={{background:'rgba(200,120,10,.05)',border:'1px solid rgba(200,120,10,.14)',borderRadius:10,marginBottom:16,overflow:'hidden'}}>
          <button onClick={()=>setDayGuideOpen(v=>!v)} style={{display:'flex',alignItems:'center',justifyContent:'space-between',width:'100%',padding:'10px 14px',background:'none',border:'none',cursor:'pointer',WebkitTapHighlightColor:'transparent'}}>
            <span style={{fontFamily:'Cinzel,serif',fontSize:'.65rem',letterSpacing:'.14em',textTransform:'uppercase',color:'#9a6820'}}>📋 Cosa fare oggi</span>
            <span style={{color:'#6a4a18',fontSize:'.75rem',transform:dayGuideOpen?'rotate(180deg)':'none',transition:'transform .2s'}}>▼</span>
          </button>
          {dayGuideOpen&&(
            <div style={{padding:'0 14px 12px',display:'flex',flexDirection:'column',gap:5}}>
              {[
                {n:1,icon:'🌅',lbl:'Annuncia gli eventi della notte'},
                {n:2,icon:'🏛️',lbl:round===1?'Eleggi il Sindaco (solo oggi)':'(elezione Sindaco già avvenuta)'},
                {n:3,icon:'💬',lbl:'Fase di discussione — i giocatori parlano liberamente'},
                {n:4,icon:'🗳️',lbl:'Votazione: seleziona chi viene eliminato'},
              ].map(s=>(
                <div key={s.n} style={{display:'flex',alignItems:'flex-start',gap:9,fontSize:'.84rem',color:'#7a6040',lineHeight:1.4}}>
                  <span style={{fontFamily:'Cinzel,serif',fontSize:'.68rem',color:'#5a4020',minWidth:16,marginTop:2}}>{s.n}.</span>
                  <span>{s.icon} {s.lbl}</span>
                </div>
              ))}
            </div>
          )}
        </div>
        <div className="lbl mb8">Cosa è successo stanotte</div>
        {de.map((e,i)=><div key={i} className={`ev ev-${e.t}`}>{e.tx}</div>)}
        {silName&&<div className="ev ev-info">🤫 <strong>{silName}</strong> è silenziato — non può parlare né votare oggi.</div>}
        {araldoUsed&&araldoCands.length>=2&&players[araldoCands[0]]&&players[araldoCands[1]]&&(
          <div className="ev" style={{background:'rgba(212,172,13,.1)',border:'1px solid rgba(212,172,13,.3)'}}>
            📯 L'Araldo ha parlato! Il villaggio deve scegliere SOLO tra: <strong style={{color:'#d4ac0d'}}>{players[araldoCands[0]].name}</strong> e <strong style={{color:'#d4ac0d'}}>{players[araldoCands[1]].name}</strong>.
          </div>
        )}
        {corvoThisRound.length>0&&<div className="ev ev-info" style={{fontSize:'.82rem'}}>🪶 Voti nascosti del Corvo: {corvoThisRound.map(([i,n])=>`${players[i].name} (+${n})`).join(', ')}<span style={{color:'#4a3a20',display:'block',fontSize:'.75rem',marginTop:4}}>(solo per il Narratore)</span></div>}
        {orfanoEff&&<div className="ev ev-info">🍵 L'Orfano è morto stanotte — oggi i voti contro Lupi e Misantropo valgono doppio!</div>}
        {suicidaWonInfo&&<div className="ev ev-info" style={{background:'rgba(99,110,114,.18)',borderColor:'rgba(99,110,114,.5)',marginBottom:10}}>🪦 <strong>{suicidaWonInfo}</strong> era il Suicida — il suo obiettivo è compiuto! Ha vinto 2.5 punti nello Scoreboard. La partita continua.</div>}
        <div className="div"/>

        {/* ── ELEZIONE SINDACO (solo Round 1, non ancora eletto) ── */}
        {round===1&&sindacoIdx===null&&(
          <div style={{background:'rgba(243,156,18,.07)',border:'1px solid rgba(243,156,18,.2)',borderRadius:12,padding:'14px 16px',marginBottom:14}}>
            <div className="lbl mb8">🏛️ Elezione del Sindaco</div>
            <p className="muted mb8">Il villaggio elegge il Sindaco: il suo voto varrà il doppio in ogni votazione.</p>
            <PList players={alive} sel={sindacoTmp} onSel={setSindacoTmp}/>
            <button className="btn btn-gold mb8" disabled={sindacoTmp===null} onClick={()=>{setSindacoIdx(sindacoTmp);setSindacoTmp(null);}}>🏛️ Eleggi Sindaco</button>
            <button className="btn btn-outline" onClick={()=>setSindacoIdx(-1)}>Salta (nessun Sindaco)</button>
          </div>
        )}

        {/* Sindaco morto → elezione successore */}
        {sindacoIdx>=0&&players[sindacoIdx]&&!players[sindacoIdx].alive&&(
          <div style={{background:'rgba(243,156,18,.07)',border:'1px solid rgba(243,156,18,.2)',borderRadius:12,padding:'14px 16px',marginBottom:14}}>
            <div className="lbl mb8">🏛️ Il Sindaco è morto</div>
            <p className="muted mb8">{players[sindacoIdx].name} non è più in vita. Eleggi un successore?</p>
            <PList players={alive} sel={sindacoTmp} onSel={setSindacoTmp}/>
            <button className="btn btn-gold mb8" disabled={sindacoTmp===null} onClick={()=>{setSindacoIdx(sindacoTmp);setSindacoTmp(null);}}>🏛️ Eleggi nuovo Sindaco</button>
            <button className="btn btn-outline" onClick={()=>setSindacoIdx(-1)}>Nessun successore</button>
          </div>
        )}

        {/* Sindaco attivo reminder */}
        {sindacoIdx>=0&&players[sindacoIdx]?.alive&&(
          <div className="ev ev-info" style={{marginBottom:14}}>🏛️ Sindaco: <strong>{players[sindacoIdx].name}</strong> — il suo voto vale doppio</div>
        )}

        <div className="lbl mb8">Il Villaggio vota</div>
        <p className="muted mb16">Dopo la discussione seleziona chi viene eliminato.</p>
        {araldoUsed&&araldoCands.length>=2&&players[araldoCands[0]]?.alive&&players[araldoCands[1]]?.alive&&(
          <div style={{background:'rgba(212,172,13,.1)',border:'1px solid rgba(212,172,13,.35)',borderRadius:10,padding:'8px 14px',marginBottom:10,fontSize:'.82rem',color:'#c8a227'}}>
            📯 <strong>Voto vincolato dall'Araldo</strong> — si può votare solo tra: <strong>{players[araldoCands[0]].name}</strong> e <strong>{players[araldoCands[1]].name}</strong>.
          </div>
        )}
        {players.some(p=>p.role==='avvocato'&&p.alive)&&(
          <div style={{marginBottom:14}}>
            <div className="nlbl">⚖️ Avvocato — toglie 1 voto a</div>
            <PList players={alive} sel={avvRm} onSel={setAvvRm}/>
            {avvRm!==null&&<p style={{fontSize:'.8rem',color:'#f39c12',fontStyle:'italic',marginBottom:8}}>-1 voto a {players[avvRm].name}</p>}
          </div>
        )}
        <PList players={alive.filter(p=>{
          if(silenced!==null&&p._i===silenced)return false;
          if(araldoUsed&&araldoCands.length>=2)return araldoCands.includes(p._i)&&(players[araldoCands[0]]?.alive||players[araldoCands[1]]?.alive);
          return true;
        })} sel={vi} onSel={i=>{setVi(i);setElimConfirm(false);}}/>
        {!elimConfirm?(
          <button className="btn btn-red mb8" onClick={()=>setElimConfirm(true)} disabled={vi===null}>Elimina dal Voto</button>
        ):(
          <div style={{background:'rgba(192,57,43,.1)',border:'1px solid rgba(192,57,43,.3)',borderRadius:10,padding:'14px 16px',marginBottom:8}}>
            <p style={{fontFamily:'Cinzel,serif',fontSize:'.8rem',color:'#e07060',letterSpacing:'.06em',marginBottom:10}}>
              ⚠️ Confermi l'eliminazione di <strong>{players[vi]?.name}</strong>?
            </p>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-red" style={{flex:1,padding:'10px'}} onClick={()=>{setElimConfirm(false);elimVote();}}>✓ Conferma</button>
              <button className="btn btn-outline" style={{flex:1,padding:'10px'}} onClick={()=>{setElimConfirm(false);setVi(null);}}>✗ Annulla</button>
            </div>
          </div>
        )}
        <button className="btn btn-outline" onClick={()=>{setElimConfirm(false);skipVote();}}>Nessuna eliminazione</button>
        <div className="div"/>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
          <div className="lbl" style={{marginBottom:0}}>Stato Giocatori</div>
          <button onClick={()=>setShowRoles(r=>!r)} style={{fontFamily:'Cinzel,serif',fontSize:'.62rem',letterSpacing:'.1em',textTransform:'uppercase',border:'1px solid rgba(200,160,90,.35)',borderRadius:20,padding:'4px 12px',background:showRoles?'rgba(200,160,90,.15)':'transparent',color:showRoles?'#c8a05a':'#6a5a40',cursor:'pointer',transition:'all .15s'}}>
            {showRoles?'👁 Nascondi Ruoli':'👁 Mostra Ruoli'}
          </button>
        </div>
        <div className="player-grid">
          {players.map(p=>{
            const r=ROLES[p.role];
            return(
              <div key={p.id} className={`p-tok ${p.alive?'alive':'dead'}`}>
                {sindacoIdx>=0&&players[sindacoIdx]?.id===p.id&&p.alive&&<span className="pt-sindaco">🏛️</span>}
                {!p.alive&&<span className="pt-dead-x">✕</span>}
                <span className="pt-em">{showRoles||!p.alive?r.emoji:'👤'}</span>
                <span className="pt-name">{p.name}</span>
                {(showRoles||!p.alive)&&<span className="pt-role" style={{color:r.color}}>{r.name}</span>}
                {showRoles&&p.role==='lupoAlpha'&&alphaTransf&&<span style={{fontSize:'.52rem',color:'#e74c3c',display:'block',marginTop:2,fontFamily:'Cinzel,serif'}}>🐺 In trasformazione...</span>}
                {ordineMode&&r.isOrdine&&p.alive&&<span style={{fontSize:'.55rem',fontFamily:'Cinzel,serif',color:'#1abc9c',display:'block',marginTop:2}}>Ordine</span>}
                {(showRoles||!p.alive)&&p.role==='mutaforma'&&mutRole&&<span style={{fontSize:'.52rem',color:ROLES[mutRole]?.color,display:'block',marginTop:1,fontFamily:'Cinzel,serif'}}>🔄 {ROLES[mutRole]?.emoji}{ROLES[mutRole]?.name}</span>}
                {(showRoles||!p.alive)&&p.role==='condor'&&conRole&&<span style={{fontSize:'.52rem',color:ROLES[conRole]?.color,display:'block',marginTop:1,fontFamily:'Cinzel,serif'}}>🦅 {ROLES[conRole]?.emoji}{ROLES[conRole]?.name}</span>}
              </div>
            );
          })}
        </div>
        <div className="div"/>
        {!menuConfirm?(
          <button className="btn btn-outline" style={{color:'#6a5a40',borderColor:'rgba(100,80,50,.3)',fontSize:'.68rem'}} onClick={()=>setMenuConfirm(true)}>↩ Menu Principale</button>
        ):(
          <div style={{background:'rgba(192,57,43,.08)',border:'1px solid rgba(192,57,43,.25)',borderRadius:10,padding:'14px 16px'}}>
            <p style={{fontFamily:'Cinzel,serif',fontSize:'.78rem',color:'#e07060',letterSpacing:'.06em',marginBottom:10}}>⚠️ Tornare al menu? La partita verrà salvata.</p>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-red" style={{flex:1,padding:'10px'}} onClick={()=>{setMenuConfirm(false);newGame();}}>✓ Conferma</button>
              <button className="btn btn-outline" style={{flex:1,padding:'10px'}} onClick={()=>setMenuConfirm(false)}>✗ Annulla</button>
            </div>
          </div>
        )}
      </div></div>
    );
  }

  // ── GAME OVER ───────────────────────────────────────────────────────────────
  if(sc==='gameOver'){
    const isSui=win==='suicida',isC=win==='criceto',isL=win==='lupi',isO=win==='ordine',isV=win==='vampiro';
    const em=isSui?'🪦':isC?'🐹':isL?'🐺':isO?'🔮':isV?'🧛':'🏘️';
    const col=isSui?'#636e72':isC?'#f39c12':isL?'#e74c3c':isO?'#1abc9c':isV?'#6c3483':'#2ecc71';
    const ttl=isSui?'Il Suicida Vince!':isC?'Il Criceto Mannaro Vince!':isL?'I Lupi Vincono!':isO?"L'Ordine Vince!":isV?'Il Vampiro Regna!':'Il Villaggio Vince!';
    const sub=isSui?'Voleva solo essere condannato. Finalmente qualcuno lo ha ascoltato.':isC?'La piccola creatura solitaria ha sopravvissuto a tutto.':isL?`I lupi hanno preso il controllo di ${vName}.`:isO?`Le forze mistiche dell'Ordine hanno prevalso su ${vName}.`:isV?`Il Vampiro ha corrotto abbastanza anime. ${vName} è nelle sue mani.`:`${vName} ha sconfitto i lupi e può dormire in pace!`;
    const winNote=p=>{
      const ek=(p.role==='mutaforma'&&mutRole)?mutRole:(p.role==='condor'&&conRole)?conRole:p.role;
      const er=ROLES[ek];
      if(win==='suicida'&&ek==='suicida'&&!p.alive)return'🏆 Vince';
      if(ek==='corvo'&&p.alive)return'🏆 Sopravvissuto';
      if(ek==='misantropo'&&win==='lupi'&&p.alive)return'🏆 Vince (con i lupi)';
      if(win==='lupi'&&(er.wolfTeam||er.winsWithWolves)&&p.alive)return'🏆 Vince';
      if(win==='villici'&&!er.wolfTeam&&!er.soloTeam&&!er.winsWithWolves&&!er.isOrdine&&p.alive)return'🏆 Vince';
      if(win==='ordine'&&er.isOrdine&&p.alive)return'🏆 Vince';
      if(win==='criceto'&&ek==='criceto'&&p.alive)return'🏆 Vince';
      if(win==='vampiro'&&p.role==='vampiro'&&p.alive)return'🏆 Vince';
      if(win==='vampiro'&&vampPrede.includes(p.id)&&p.alive)return'🩸 Preda';
      return null;
    };
    return(
      <div className="app"><MuteBtn/><div className="moon"/>
      {showScores&&<ScoreboardModal/>}
      <div className="screen fade">
        <div className="wh">
          <span className="we">{em}</span>
          <div className="wt" style={{color:col}}>{ttl}</div>
          <p className="ws">{sub}</p>
          {isO&&<div style={{marginTop:12,padding:'10px 14px',background:'rgba(26,188,156,.08)',borderRadius:10,border:'1px solid rgba(26,188,156,.2)'}}><p style={{fontSize:'.8rem',color:'#1abc9c',fontStyle:'italic'}}>I membri dell'Ordine hanno superato i Contadini dopo aver eliminato tutti i Lupi.</p></div>}
          {isV&&vampPrede.filter(i=>players[i]?.alive).length>0&&(
            <div style={{marginTop:12,padding:'10px 14px',background:'rgba(108,52,131,.08)',borderRadius:10,border:'1px solid rgba(108,52,131,.25)'}}>
              <div style={{fontFamily:'Cinzel,serif',fontSize:'.65rem',letterSpacing:'.15em',textTransform:'uppercase',color:'#9b59b6',marginBottom:5}}>🩸 Prede del Vampiro</div>
              <p style={{fontSize:'.82rem',color:'#b080d0',fontStyle:'italic'}}>{vampPrede.filter(i=>players[i]?.alive).map(i=>players[i].name).join(', ')}</p>
            </div>
          )}
        </div>

        {/* ── PUNTEGGI PARTITA ── */}
        <div className="div"/>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
          <div className="lbl" style={{marginBottom:0}}>🪙 Punteggi questa partita</div>
          <button className="dbtn" onClick={()=>setShowScores(true)}>🏆 Scoreboard</button>
        </div>
        {players.map(p=>{
          const pts=getPoints(p,win,mutRole,conRole);
          const won=pts>0;
          return(
            <div key={p.id} className={`pts-earned${won?' winner':''}`}>
              {(()=>{const ek=(p.role==='mutaforma'&&mutRole)?mutRole:(p.role==='condor'&&conRole)?conRole:p.role;const er=ROLES[ek];return(
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontSize:'1rem'}}>{er.emoji}</span>
                <span style={{textDecoration:!p.alive?'line-through':'none',opacity:!p.alive?.7:1}}>{p.name}</span>
                <span style={{fontSize:'.75rem',color:er.color,fontFamily:'Cinzel,serif'}}>{er.name}{(p.role==='mutaforma'||p.role==='condor')&&ek!==p.role&&<span style={{opacity:.6,marginLeft:4}}>({ROLES[p.role].name})</span>}</span>
              </div>);})()}
              <span style={{fontFamily:'Cinzel Decorative,serif',fontSize:won?'1rem':'.85rem',color:won?'#f1c40f':'#4a3a20',flexShrink:0}}>
                {won?`+${pts.toFixed(1)}`:'0'}
              </span>
            </div>
          );
        })}

        <div className="div"/>
        <div className="lbl mb8">Ruoli Rivelati</div>
        {players.map(p=>{const n=winNote(p);const ek2=(p.role==='mutaforma'&&mutRole)?mutRole:(p.role==='condor'&&conRole)?conRole:p.role;return(
          <div key={p.id} className={`fr${!p.alive?' fdead':''}`}>
            <span>{ROLES[ek2].emoji}</span>
            <span className="fn" style={{textDecoration:!p.alive?'line-through':'none'}}>{p.name}{sindacoIdx>=0&&players[sindacoIdx]?.id===p.id?'  🏛️':''}</span>
            {n&&<span style={{fontSize:'.7rem',color:'#f1c40f',marginRight:4}}>{n}</span>}
            <span className="frn" style={{color:isO&&ROLES[ek2].isOrdine?'#1abc9c':ROLES[ek2].color}}>{ROLES[ek2].name}{(p.role==='mutaforma'||p.role==='condor')&&ek2!==p.role?<span style={{opacity:.5,fontSize:'.75em',marginLeft:3}}>({ROLES[p.role].name})</span>:''}{isO&&ROLES[ek2].isOrdine?' (Ordine)':''}</span>
          </div>
        );})}
        <div style={{marginTop:24,display:'flex',gap:8}}>
          <button className="btn btn-gold" style={{flex:1}} onClick={replayGame}>🔁 Rigioca</button>
          <button className="btn btn-outline" style={{flex:1}} onClick={newGame}>🏠 Nuova Partita</button>
        </div>
      </div></div>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
