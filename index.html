              onClick={()=>setSc('modePick')}>⚔️ Nuova Partita</button>
            <div style={{display:'flex',gap:8}}>
              <button className="btn btn-magic" style={{flex:1,padding:'11px 6px',fontSize:'.82rem'}} onClick={()=>{setLibroTab('tutti');setLibro(true);}}>📖 Libro Magico</button>
              <button className="btn btn-outline" style={{flex:1,padding:'11px 6px',fontSize:'.82rem'}} onClick={()=>setShowScores(true)}>🏆 Scoreboard</button>
            </div>
            <div style={{display:'flex',gap:6}}>
              <button className="btn btn-outline" style={{flex:1,padding:'8px 4px',fontSize:'.66rem'}} onClick={()=>{setLibroTab('regole');setLibro(true);}}>📋 Regole</button>
              <button className="btn btn-outline" style={{flex:1,padding:'8px 4px',fontSize:'.66rem'}} onClick={()=>{setLibroTab('varianti');setLibro(true);}}>🎭 Varianti</button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  // ── MODE PICK ──────────────────────────────────────────────────────────────
  if(sc==='modePick'){
    const S={card:{display:'flex',alignItems:'center',gap:14,borderRadius:14,padding:'18px 20px',marginBottom:12,cursor:'pointer',transition:'border-color .2s'}};
    return(
      <div className="app night"><MuteBtn/><div className="astro moon"/>
      <div className="screen fade" style={{maxWidth:460}}>
        <button onClick={()=>setSc('home')} style={{background:'none',border:'1px solid rgba(200,160,90,.25)',borderRadius:8,padding:'5px 12px',color:'#7a6a50',fontFamily:'Cinzel,serif',fontSize:'.7rem',cursor:'pointer',letterSpacing:'.08em',marginBottom:22,alignSelf:'flex-start'}}>← Home</button>
        <h1 className="title" style={{marginBottom:6}}>Modalità di Gioco</h1>
        <p style={{color:'#6a5a40',fontSize:'.8rem',fontStyle:'italic',marginBottom:28,textAlign:'center'}}>Come vuoi giocare questa partita?</p>

        <div style={{...S.card,background:'rgba(201,162,39,.06)',border:'1px solid rgba(201,162,39,.2)'}}
          onClick={()=>{setGameMode('narrator');setSc('setup');}}
          onMouseEnter={e=>e.currentTarget.style.borderColor='rgba(201,162,39,.5)'}
          onMouseLeave={e=>e.currentTarget.style.borderColor='rgba(201,162,39,.2)'}>
          <span style={{fontSize:'2.2rem',flexShrink:0}}>🎭</span>
          <div>
            <div style={{fontFamily:'Cinzel,serif',fontSize:'.95rem',color:'#c9a227',fontWeight:700,marginBottom:3}}>Modalità Narratore</div>
            <div style={{fontSize:'.78rem',color:'#6a5a40',lineHeight:1.5}}>Un Narratore gestisce la partita dal suo dispositivo. Modalità classica.</div>
          </div>
        </div>

        <div style={{...S.card,background:'rgba(41,128,185,.06)',border:'1px solid rgba(41,128,185,.22)',opacity:joinLoading?.6:1,cursor:joinLoading?'not-allowed':'pointer'}}
          onClick={async()=>{
            if(joinLoading)return;
            setJoinError('');setJoinLoading(true);
            try{
              const code=genCode();
              await fbCreateRoom(code,myIdRef.current,'multiplayer');
              setRoomCode(code);setRoomRole('host');setGameMode('multiplayer');
              setSc('lobby');
            }catch(e){setJoinError('Errore di connessione. Verifica internet.');}
            setJoinLoading(false);
          }}
          onMouseEnter={e=>!joinLoading&&(e.currentTarget.style.borderColor='rgba(41,128,185,.5)')}
          onMouseLeave={e=>e.currentTarget.style.borderColor='rgba(41,128,185,.22)'}>
          <span style={{fontSize:'2.2rem',flexShrink:0}}>👥</span>
          <div>
            <div style={{fontFamily:'Cinzel,serif',fontSize:'.95rem',color:'#3498db',fontWeight:700,marginBottom:3}}>Crea Stanza Multiplayer</div>
            <div style={{fontSize:'.78rem',color:'#5a7a9a',lineHeight:1.5}}>Genera un codice — i giocatori si connettono dal loro telefono.</div>
          </div>
        </div>

        <div style={{...S.card,background:'rgba(39,174,96,.05)',border:'1px solid rgba(39,174,96,.2)',cursor:'default',flexDirection:'column',alignItems:'stretch'}}>
          <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:14}}>
            <span style={{fontSize:'2.2rem',flexShrink:0}}>🔑</span>
            <div>
              <div style={{fontFamily:'Cinzel,serif',fontSize:'.95rem',color:'#27ae60',fontWeight:700,marginBottom:3}}>Unisciti a una Stanza</div>
              <div style={{fontSize:'.78rem',color:'#4a7060',lineHeight:1.5}}>Inserisci il codice ricevuto dall'host.</div>
            </div>
          </div>
          <div style={{display:'flex',gap:8}}>
            <input type="text" placeholder="Codice (es. ABCD)"
              value={joinInput}
              onChange={e=>setJoinInput(e.target.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4))}
              onKeyDown={e=>e.key==='Enter'&&joinInput.length===4&&setSc('roomJoin')}
              style={{flex:1,textTransform:'uppercase',letterSpacing:'.25em',fontFamily:'Cinzel,serif',fontSize:'1.1rem',textAlign:'center',fontWeight:700}}
              maxLength={4}/>
            <button className="btn btn-gold" style={{padding:'10px 18px'}}
              disabled={joinInput.length!==4}
              onClick={()=>setSc('roomJoin')}>→</button>
          </div>
        </div>

        {joinError&&<p style={{color:'#e74c3c',fontSize:'.8rem',marginTop:10,textAlign:'center',fontStyle:'italic'}}>{joinError}</p>}
        {joinLoading&&<p style={{color:'#5a8a7a',fontSize:'.8rem',marginTop:6,textAlign:'center',fontStyle:'italic'}}>Connessione a Firebase...</p>}
      </div></div>
    );
  }

  // ── ROOM JOIN ──────────────────────────────────────────────────────────────
  if(sc==='roomJoin'){
    const doJoin=async()=>{
      if(!playerName.trim()||joinLoading)return;
      setJoinError('');setJoinLoading(true);
      try{
        await fbJoinRoom(joinInput,myIdRef.current,playerName.trim());
        setRoomCode(joinInput);setRoomRole('player');setGameMode('multiplayer');
        setSc('lobby');
      }catch(err){setJoinError(err.message||'Errore durante la connessione.');}
      setJoinLoading(false);
    };
    return(
      <div className="app night"><MuteBtn/><div className="astro moon"/>
      <div className="screen fade" style={{maxWidth:420}}>
        <button onClick={()=>{setJoinError('');setSc('modePick');}} style={{background:'none',border:'1px solid rgba(200,160,90,.25)',borderRadius:8,padding:'5px 12px',color:'#7a6a50',fontFamily:'Cinzel,serif',fontSize:'.7rem',cursor:'pointer',letterSpacing:'.08em',marginBottom:22,alignSelf:'flex-start'}}>← Indietro</button>
        <h1 className="title" style={{marginBottom:8}}>Unisciti alla Stanza</h1>
        <div style={{fontFamily:'Cinzel,serif',fontSize:'2.8rem',letterSpacing:'.4em',color:'#c9a227',textAlign:'center',margin:'14px 0',textShadow:'0 0 24px rgba(201,162,39,.4)',fontWeight:900}}>{joinInput}</div>
        <p style={{color:'#6a5a40',fontSize:'.82rem',fontStyle:'italic',marginBottom:18,textAlign:'center'}}>Come ti chiami in questa partita?</p>
        <input type="text" placeholder="Il tuo nome..." value={playerName}
          onChange={e=>setPlayerName(e.target.value.slice(0,20))}
          onKeyDown={e=>e.key==='Enter'&&doJoin()}
          style={{marginBottom:12,fontSize:'1rem',textAlign:'center'}} autoFocus/>
        {joinError&&<p style={{color:'#e74c3c',fontSize:'.8rem',marginBottom:10,textAlign:'center',fontStyle:'italic'}}>{joinError}</p>}
        <button className="btn btn-gold" style={{width:'100%',padding:14,fontSize:'.95rem'}}
          disabled={!playerName.trim()||joinLoading} onClick={doJoin}>
          {joinLoading?'Connessione...':'Entra nella Stanza 🚪'}
        </button>
      </div></div>
    );
  }

  // ── LOBBY ──────────────────────────────────────────────────────────────────
  if(sc==='lobby'){
    const isHost=roomRole==='host';
    const joinUrl=`${window.location.href.split('?')[0]}?join=${roomCode}`;
    return(
      <div className="app night"><MuteBtn/><div className="astro moon"/>
      <div className="screen fade" style={{maxWidth:460}}>
        <button onClick={()=>{fbLeaveRoom(roomCode,myIdRef.current);setRoomCode('');setRoomRole(null);setLobbyPlayers([]);setSc('modePick');}}
          style={{background:'none',border:'1px solid rgba(200,160,90,.25)',borderRadius:8,padding:'5px 12px',color:'#7a6a50',fontFamily:'Cinzel,serif',fontSize:'.7rem',cursor:'pointer',letterSpacing:'.08em',marginBottom:22,alignSelf:'flex-start'}}>
          {isHost?'← Annulla':'← Esci'}
        </button>

        <h1 className="title" style={{marginBottom:4}}>{isHost?'Stanza Creata':'Sala d\'Attesa'}</h1>

        <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4,margin:'16px 0'}}>
          <p style={{color:'#6a5a40',fontSize:'.72rem',letterSpacing:'.12em',fontFamily:'Cinzel,serif',textTransform:'uppercase'}}>Codice Stanza</p>
          <div title="Clicca per copiare" onClick={()=>navigator.clipboard?.writeText(roomCode)}
            style={{fontFamily:'Cinzel,serif',fontSize:'2.8rem',fontWeight:900,letterSpacing:'.45em',color:'#c9a227',textShadow:'0 0 28px rgba(201,162,39,.5)',cursor:'pointer'}}>
            {roomCode}
          </div>
          <p style={{color:'#3a2a10',fontSize:'.68rem',fontStyle:'italic'}}>Clicca per copiare</p>
        </div>

        {isHost&&(
          <div style={{background:'rgba(0,0,0,.25)',border:'1px solid rgba(201,162,39,.12)',borderRadius:14,padding:14,marginBottom:18,display:'flex',flexDirection:'column',alignItems:'center',gap:10}}>
            <QRDisplay text={joinUrl} size={150}/>
            <p style={{color:'#4a3a20',fontSize:'.7rem',fontStyle:'italic',textAlign:'center'}}>I giocatori scansionano il QR o inseriscono il codice nell'app</p>
          </div>
        )}

        <div style={{background:'rgba(255,255,255,.03)',border:'1px solid rgba(201,162,39,.1)',borderRadius:12,padding:'14px 16px',marginBottom:18}}>
          <p style={{fontFamily:'Cinzel,serif',fontSize:'.72rem',color:'#7a6040',letterSpacing:'.12em',marginBottom:10}}>GIOCATORI CONNESSI ({lobbyPlayers.length})</p>
          {lobbyPlayers.length===0
            ?<p style={{color:'#3a2a10',fontSize:'.82rem',fontStyle:'italic',textAlign:'center',padding:'8px 0'}}>In attesa di giocatori...</p>
            :lobbyPlayers.map(p=>(
              <div key={p.id} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 0',borderBottom:'1px solid rgba(201,162,39,.06)'}}>
                <span style={{color:'#27ae60',fontSize:'.7rem'}}>●</span>
                <span style={{fontFamily:'Cinzel,serif',fontSize:'.88rem',color:'#d4b866',flex:1}}>{p.name}</span>
                {p.id===myIdRef.current&&<span style={{fontSize:'.65rem',color:'#4a7060',fontStyle:'italic'}}>(tu)</span>}
              </div>
            ))
          }
        </div>

        {isHost
          ?<div>
            <button className="btn btn-gold" style={{width:'100%',padding:14,fontSize:'.95rem'}}
              disabled={lobbyPlayers.length===0}
              onClick={async()=>{
                await fbStartGame(roomCode);
                const map={};
                lobbyPlayers.forEach(p=>{map[p.name]=p.id;});
                setLobbyPlayerMap(map);
                setNames(lobbyPlayers.map(p=>p.name));
                setSc('setup');
              }}>
              ⚔️ Avvia Partita {lobbyPlayers.length>0&&`(${lobbyPlayers.length} gioc.)`}
            </button>
            {lobbyPlayers.length===0&&<p style={{color:'#3a2a10',fontSize:'.74rem',fontStyle:'italic',textAlign:'center',marginTop:8}}>Attendi almeno 1 giocatore</p>}
          </div>
          :<div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,padding:'8px 0'}}>
            <div style={{width:8,height:8,borderRadius:'50%',background:'#27ae60',boxShadow:'0 0 8px #27ae60'}}/>
            <span style={{color:'#4a9a70',fontSize:'.85rem',fontStyle:'italic'}}>Connesso — in attesa che il Narratore avvii...</span>
          </div>
        }
      </div></div>
    );
  }

  // ── PLAYER WAIT / COMPANION ────────────────────────────────────────────────
  if(sc==='playerWait'){
    const R=myRole?ROLES[myRole.role]:null;
    const isNight=mpPhase==='night';
    const isDay=mpPhase==='day';
    const isOver=mpPhase==='gameOver';
    const phaseColor=isNight?'#3d6fa8':isDay?'#c9a227':isOver?'#8e44ad':'#4a3a20';
    const phaseBg=isNight?'rgba(30,50,90,.4)':isDay?'rgba(100,75,20,.3)':isOver?'rgba(80,30,100,.3)':'rgba(0,0,0,.2)';

    // Storico notti per il log
    const nightLogEntries=Object.values(mpNightLog||{}).sort((a,b)=>(a.round||0)-(b.round||0));

    return(
      <div className="app night"><MuteBtn/><div className="astro moon"/>

      {/* Overlay trasformazione Lupo Mannaro */}
      {mpNotif?.type==='transform'&&(
        <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(80,0,0,.92)',zIndex:200,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:28,textAlign:'center'}}>
          <div style={{fontSize:'4rem',marginBottom:16}}>🐺</div>
          <h2 style={{fontFamily:'Cinzel Decorative,serif',color:'#e74c3c',fontSize:'1.3rem',marginBottom:12,lineHeight:1.3}}>La luna piena ti trasforma!</h2>
          <p style={{color:'#c9a227',fontSize:'.88rem',lineHeight:1.9,marginBottom:28}}>
            Sei diventato un <strong>Lupo Grande</strong>.<br/>
            Da questa notte agirai con i tuoi simili.<br/>
            <span style={{color:'#8a4040',fontStyle:'italic'}}>Non rivelare la trasformazione.</span>
          </p>
          <div style={{background:'rgba(201,162,39,.1)',border:'1px solid rgba(201,162,39,.3)',borderRadius:12,padding:'12px 20px',marginBottom:24}}>
            <p style={{color:'#c9a227',fontFamily:'Cinzel,serif',fontSize:'.8rem',letterSpacing:'.1em'}}>IL TUO NUOVO RUOLO</p>
            <p style={{fontSize:'1.8rem',margin:'6px 0'}}>🐺</p>
            <p style={{color:'#e74c3c',fontFamily:'Cinzel Decorative,serif',fontSize:'1rem',fontWeight:700}}>Lupo Grande</p>
          </div>
          <button className="btn btn-red" style={{padding:'12px 28px',fontSize:'.9rem'}}
            onClick={()=>{
              setMpNotif(null);
              if(roomCode)getDb().ref(`rooms/${roomCode}/playerNotif/${myIdRef.current}`).remove();
            }}>
            🐺 Ho capito
          </button>
        </div>
      )}
      {/* Overlay Reveal Veggente/Negromante */}
      {mpNightReveal&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.92)',zIndex:300,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:28,textAlign:'center'}}>
          <div style={{background:mpNightReveal.isGood?'rgba(46,204,113,.15)':'rgba(231,76,60,.15)',border:`1px solid ${mpNightReveal.isGood?'rgba(46,204,113,.4)':'rgba(231,76,60,.4)'}`,borderRadius:16,padding:'30px 20px',width:'100%',maxWidth:340,animation:'fadeUp .3s ease'}}>
            <p style={{fontFamily:'Cinzel,serif',fontSize:'.85rem',color:'#c8a05a',marginBottom:16}}>{mpNightReveal.title}</p>
            <div style={{fontSize:'3.5rem',marginBottom:10}}>{mpNightReveal.emoji}</div>
            <div style={{fontFamily:'Cinzel,serif',fontSize:'1.3rem',fontWeight:700,color:mpNightReveal.isGood?'#2ecc71':'#e74c3c',marginBottom:6}}>{mpNightReveal.roleName}</div>
            <p style={{fontSize:'.9rem',color:'#a09080',marginBottom:24}}>Bersaglio: <strong style={{color:'#fff'}}>{mpNightReveal.targetName}</strong></p>
            <button className="btn btn-gold" onClick={()=>{
              getDb().ref(`rooms/${roomCode}/nightReveal/${myIdRef.current}`).remove();
              setMpNightReveal(null);
            }}>✓ Ho capito</button>
          </div>
        </div>
      )}
      <div className="screen fade" style={{maxWidth:400,paddingTop:8}}>

        {/* Phase banner */}
        {mpPhase&&(
          <div style={{background:phaseBg,border:`1px solid ${phaseColor}44`,borderRadius:12,padding:'12px 16px',marginBottom:16,textAlign:'center'}}>
            <span style={{fontSize:'1.4rem'}}>{isNight?'🌙':isDay?'☀️':isOver?'🏁':'⏳'}</span>
            <span style={{fontFamily:'Cinzel,serif',fontSize:'.88rem',color:phaseColor,fontWeight:700,marginLeft:8}}>
              {isNight?'È Notte':isDay?'È Giorno':isOver?'Partita Terminata':'In attesa...'}
            </span>
          </div>
        )}

        {/* Dawn events */}
        {isDay&&mpDawn.length>0&&(
          <div style={{background:'rgba(0,0,0,.25)',border:'1px solid rgba(201,162,39,.15)',borderRadius:12,padding:'12px 16px',marginBottom:16}}>
            <p style={{fontFamily:'Cinzel,serif',fontSize:'.68rem',color:'#7a6040',letterSpacing:'.12em',marginBottom:10}}>ANNUNCI DELL'ALBA</p>
            {mpDawn.map((ev,i)=>(
              <div key={i} style={{display:'flex',alignItems:'flex-start',gap:8,padding:'5px 0',borderBottom:i<mpDawn.length-1?'1px solid rgba(201,162,39,.07)':'none'}}>
                <span style={{fontSize:'.9rem',flexShrink:0}}>{ev.t==='death'?'💀':ev.t==='revive'?'✝️':'📢'}</span>
                <span style={{fontSize:'.82rem',color:'#c4a882',lineHeight:1.6}}>{ev.tx}</span>
              </div>
            ))}
          </div>
        )}

        {/* Night action UI */}
        {isNight&&mpIsAlive&&myRole&&mpCurStep&&isMyTurn(myRole.role,mpCurStep)&&(
          <div style={{background:ROLES[myRole.role]?.wolfTeam?'rgba(120,20,20,.35)':'rgba(30,50,90,.4)',border:`1px solid ${ROLES[myRole.role]?.wolfTeam?'rgba(200,50,50,.4)':'rgba(60,100,180,.4)'}`,borderRadius:14,padding:'14px 16px',marginBottom:16}}>
            <p style={{fontFamily:'Cinzel,serif',fontSize:'.72rem',color:ROLES[myRole.role]?.wolfTeam?'#e57373':'#7aa8e0',letterSpacing:'.12em',marginBottom:6}}>
              {ROLES[myRole.role]?.wolfTeam?'⚔️ TURNO DEI LUPI':'⚡ IL TUO TURNO'}
            </p>
            <p style={{fontSize:'.85rem',color:'#c4a882',marginBottom:14,lineHeight:1.5}}>
              {ACTION_LABELS[mpCurStep]||'Scegli un giocatore:'}
            </p>

            {!mpActionSent?(
              <>
                <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:14,maxHeight:220,overflowY:'auto'}}>
                  {mpAlive.filter(p=>p.name!==myRole.name).map(p=>(
                    <div key={p.idx} onClick={()=>setMpSelTarget(p.idx)}
                      style={{padding:'10px 14px',borderRadius:10,border:`1px solid ${mpSelTarget===p.idx?'rgba(201,162,39,.7)':'rgba(201,162,39,.15)'}`,background:mpSelTarget===p.idx?'rgba(201,162,39,.12)':'rgba(255,255,255,.03)',cursor:'pointer',transition:'all .15s',fontFamily:'Cinzel,serif',fontSize:'.88rem',color:mpSelTarget===p.idx?'#c9a227':'#a08060',display:'flex',alignItems:'center',gap:8}}>
                      <span style={{color:mpSelTarget===p.idx?'#c9a227':'#4a3a20'}}>{mpSelTarget===p.idx?'●':'○'}</span>
                      {p.name}
                    </div>
                  ))}
                </div>
                <button className="btn btn-gold" style={{width:'100%',padding:12,fontSize:'.88rem'}}
                  disabled={mpSelTarget===null}
                  onClick={async()=>{
                    await fbSet(`rooms/${roomCode}/nightActions/${mpCurStep}`,{targetIdx:mpSelTarget});
                    setMpActionSent(true);
                  }}>
                  Conferma Scelta
                </button>
              </>
            ):(
              <div style={{textAlign:'center',padding:'8px 0'}}>
                <span style={{color:'#27ae60',fontSize:'.9rem'}}>✓ </span>
                <span style={{color:'#4a9a70',fontSize:'.85rem',fontStyle:'italic'}}>Azione inviata — in attesa del Narratore...</span>
              </div>
            )}
          </div>
        )}

        {/* Waiting for turn during night */}
        {isNight&&mpIsAlive&&myRole&&mpCurStep&&!isMyTurn(myRole.role,mpCurStep)&&(
          <div style={{background:'rgba(20,20,40,.4)',border:'1px solid rgba(60,80,120,.25)',borderRadius:12,padding:'12px 16px',marginBottom:16,textAlign:'center'}}>
            <span style={{color:'#4a5a80',fontSize:'.82rem',fontStyle:'italic'}}>🌙 Non è ancora il tuo turno...</span>
          </div>
        )}

        {/* Dead player during night */}
        {isNight&&!mpIsAlive&&(
          <div style={{background:'rgba(20,20,20,.4)',border:'1px solid rgba(80,80,80,.2)',borderRadius:12,padding:'12px 16px',marginBottom:16,textAlign:'center'}}>
            <span style={{color:'#4a4a4a',fontSize:'.82rem',fontStyle:'italic'}}>💀 Sei eliminato — osserva in silenzio</span>
          </div>
        )}

        {/* Day vote UI */}
        {isDay&&mpIsAlive&&!mpIsSilenced&&mpVoteOpen&&(
          <div style={{background:'rgba(41,128,185,.08)',border:'1px solid rgba(41,128,185,.3)',borderRadius:14,padding:'14px 16px',marginBottom:16}}>
            <p style={{fontFamily:'Cinzel,serif',fontSize:'.72rem',color:'#3498db',letterSpacing:'.12em',marginBottom:12}}>🗳️ VOTAZIONE IN CORSO</p>
            {mpVotedTarget===null?(
              <>
                <p style={{fontSize:'.83rem',color:'#7aa8d0',marginBottom:12}}>Chi vuoi eliminare?</p>
                <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:12,maxHeight:200,overflowY:'auto'}}>
                  {mpAlive.filter(p=>p.name!==myRole?.name).map(p=>(
                    <div key={p.idx} onClick={()=>setMpVoteTarget(p.idx)}
                      style={{padding:'10px 14px',borderRadius:10,border:`1px solid ${mpVoteTarget===p.idx?'rgba(52,152,219,.7)':'rgba(52,152,219,.15)'}`,background:mpVoteTarget===p.idx?'rgba(52,152,219,.12)':'rgba(255,255,255,.03)',cursor:'pointer',transition:'all .15s',fontFamily:'Cinzel,serif',fontSize:'.88rem',color:mpVoteTarget===p.idx?'#5dade2':'#7a8a9a',display:'flex',alignItems:'center',gap:8}}>
                      <span>{mpVoteTarget===p.idx?'●':'○'}</span>{p.name}
                    </div>
                  ))}
                </div>
                <button className="btn btn-gold" style={{width:'100%',padding:12}}
                  disabled={mpVoteTarget===null}
                  onClick={async()=>{
                    await fbSubmitVote(roomCode,myIdRef.current,mpVoteTarget);
                    setMpVotedTarget(mpVoteTarget);
                  }}>
                  Conferma Voto
                </button>
              </>
            ):(
              <div style={{textAlign:'center',padding:'8px 0'}}>
                <p style={{color:'#27ae60',fontSize:'.85rem',marginBottom:4}}>✓ Voto inviato</p>
                <p style={{color:'#4a7060',fontSize:'.78rem',fontStyle:'italic'}}>Hai votato per <strong style={{color:'#c9a227'}}>{mpAlive.find(p=>p.idx===mpVotedTarget)?.name||'...'}</strong></p>
              </div>
            )}
          </div>
        )}

        {/* Silenced - can't vote */}
        {isDay&&mpIsAlive&&mpIsSilenced&&mpVoteOpen&&(
          <div style={{background:'rgba(80,80,80,.15)',border:'1px solid rgba(120,120,120,.2)',borderRadius:12,padding:'12px 16px',marginBottom:16,textAlign:'center'}}>
            <span style={{color:'#6a6a6a',fontSize:'.82rem',fontStyle:'italic'}}>🤐 Sei silenziato — non puoi votare oggi</span>
          </div>
        )}

        {/* Day - vote not open yet */}
        {isDay&&mpIsAlive&&!mpVoteOpen&&(
          <div style={{background:'rgba(201,162,39,.04)',border:'1px solid rgba(201,162,39,.1)',borderRadius:12,padding:'10px 16px',marginBottom:16,textAlign:'center'}}>
            <span style={{color:'#6a5a30',fontSize:'.8rem',fontStyle:'italic'}}>💬 Fase discussione — la votazione non è ancora aperta</span>
          </div>
        )}

        {/* Game over recap */}
        {(isOver||mpGameOver)&&(
          mpGameOver?(
            <div>
              <div style={{textAlign:'center',padding:'18px 0 24px'}}>
                <span style={{fontSize:'3rem',display:'block',marginBottom:10}}>🎭</span>
                <h2 style={{fontFamily:'Cinzel Decorative,serif',color:'#c9a227',fontSize:'1.3rem',marginBottom:12}}>La partita è terminata</h2>
                {mpGameOver.log&&mpGameOver.log.length>0&&(
                  <div style={{marginTop:24}}>
                    <p style={{fontFamily:'Cinzel,serif',fontSize:'.8rem',color:'#d4b866',letterSpacing:'.1em',marginBottom:12}}>📖 LA STORIA DI QUESTA NOTTE</p>
                    <div className="nlog-wrap">
                      <table className="nlog-table">
                        <thead>
                          <tr>
                            <th className="nlog-corner">Giocatore</th>
                            {mpGameOver.log.map(r=><th key={r.round} className="nlog-th">🌙 {r.round}</th>)}
                          </tr>
                        </thead>
                        <tbody>
                          {mpGameOver.players.map((p,pi)=>{
                            const di = mpGameOver.deathRound?.[p.name];
                            return (
                              <tr key={pi} className={!p.alive?'nlog-row-dead':''}>
                                <td className="nlog-td-name">
                                  <div className="nlog-name-cell">
                                    <span className="nlog-name-em">{p.emoji}</span>
                                    <div>
                                      <span className="nlog-name-txt">{p.name}</span>
                                      <span className="nlog-name-role" style={{color:p.color}}>{p.roleName}</span>
                                    </div>
                                  </div>
                                </td>
                                {mpGameOver.log.map(r=>{
                                  const act = r.actions?.[pi];
                                  const diedNight = r.deaths?.[pi];
                                  const votedOut = r.voteVictim === pi;
                                  const alreadyDead = di && di.round < r.round;
                                  
                                  let choiceEl = null;
                                  if(!alreadyDead && act && act.target !== null && mpGameOver.players[act.target]){
                                    let icon = '';
                                    if(act.type==='wolf') icon='🐺'; else if(act.type==='seer') icon='👁️'; else if(act.type==='guard') icon='🛡️'; else if(act.type==='mer') icon='💃'; else if(act.type==='arc') icon='🏹'; else if(act.type==='custode') icon='🤫'; else if(act.type==='neg') icon='💀'; else if(act.type==='acc') icon='👉'; else if(act.type==='pir') icon='🔥'; else if(act.type==='alch') icon='⚗️'; else if(act.type==='vamp') icon='🧛';
                                    choiceEl = <><span className="nlog-action-icon">{icon}</span><span className="nlog-choice">{mpGameOver.players[act.target].name}</span></>;
                                  }
                                  
                                  let deathEl = null;
                                  if(diedNight) deathEl = <span className="nlog-death">💀</span>;
                                  else if(votedOut) deathEl = <span className="nlog-death">🗳️💀</span>;
                                  
                                  const cellCls=`nlog-td${diedNight?' dead-night':votedOut?' dead-vote':alreadyDead?' past-death':''}`;
                                  return (
                                    <td key={r.round} className={cellCls} style={{opacity:alreadyDead?0.22:1}}>
                                      {!alreadyDead && choiceEl}
                                      {deathEl}
                                    </td>
                                  );
                                })}
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                    <div style={{display:'flex',flexWrap:'wrap',gap:'6px 14px',marginBottom:6}}>
                      {[['🐺💀','Lupi'],['🗳️💀','Voto'],['💀','Altro']].map(([em,lb])=> <span key={lb} style={{fontSize:'.62rem',color:'#5a4830',fontFamily:'Cinzel,serif',letterSpacing:'.06em'}}>{em} {lb}</span> )}
                    </div>
                  </div>
                )}
              </div>
            </div>
          ):(
            <div style={{textAlign:'center',padding:'8px 0'}}>
              <span style={{color:'#8e44ad',fontSize:'.85rem',fontStyle:'italic'}}>Partita terminata. Attendi il recap...</span>
            </div>
          )
        )}

        {/* Role card - compact if phase is known */}
        {!myRole?(
          <div style={{textAlign:'center',padding:'20px 0'}}>
            <div style={{fontSize:'2rem',marginBottom:12}}>⏳</div>
            <p style={{color:'#6a5a40',fontSize:'.85rem',fontStyle:'italic',lineHeight:1.8}}>
              Il Narratore sta distribuendo i ruoli...<br/>Il tuo ruolo apparirà qui a breve.
            </p>
          </div>
        ):(
          <div style={{background:R?.bg||'rgba(201,162,39,.06)',border:`1px solid ${(R?.color||'#c9a227')}44`,borderRadius:16,padding:mpPhase?'16px 18px':'24px 20px',marginBottom:16}}>
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:mpPhase?6:12}}>
              <span style={{fontSize:mpPhase?'2rem':'3rem'}}>{R?.emoji||'❓'}</span>
              <div>
                <p style={{color:'#7a6040',fontSize:'.65rem',fontFamily:'Cinzel,serif',letterSpacing:'.12em',marginBottom:3}}>IL TUO RUOLO</p>

              </div>
              <div style={{marginLeft:'auto',textAlign:'right'}}>
                <span style={{fontSize:'.7rem',color:R?.color||'#c9a227',fontFamily:'Cinzel,serif',fontWeight:700}}>
                  {R?.wolfTeam?'🐺':R?.soloTeam?'👤':'🏘️'}
                </span>
              </div>
            </div>
            {!mpPhase&&<p style={{fontSize:'.82rem',color:'#8a7a60',lineHeight:1.7,fontStyle:'italic',margin:0}}>{R?.desc||''}</p>}
          </div>
        )}

        <p style={{color:'#3a2a10',fontSize:'.7rem',fontStyle:'italic',textAlign:'center',marginBottom:14}}>🤫 Non mostrare questo schermo agli altri</p>

        <button className="btn btn-outline" style={{fontSize:'.75rem',width:'100%'}}
          onClick={()=>{fbLeaveRoom(roomCode,myIdRef.current);newGame();}}>
          Esci dalla stanza
        </button>
      </div></div>
    );
  }

  // ── SETUP (Nuova Partita) ───────────────────────────────────────────────────
  if(sc==='setup'){
    const saved=loadGame();
    const P_ICONS=['🧑‍🌾','⚔️','🛡️','🔮','🏹','✝️','💋','💀','🌹','🎪','🥀','🦊','⚗️','🌙','🔔','🗝️','🎭','👁️','🕯️','🐾'];
    return(
      <div className="app night"><MuteBtn/><div className="astro moon"/>
      {libro&&<LibroMagico onClose={()=>{setLibro(false);setLibroTab('tutti');}} initialCat={libroTab}/>}
      {showScores&&<ScoreboardModal/>}
      <div className="screen fade">

        {/* ── HEADER ── */}
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:28}}>
          <button onClick={()=>setSc('home')} style={{background:'none',border:'1px solid rgba(200,160,90,.3)',borderRadius:8,padding:'6px 12px',color:'#8a7050',fontFamily:'Cinzel,serif',fontSize:'.7rem',cursor:'pointer',letterSpacing:'.08em',flexShrink:0}}>← Home</button>
          <h1 className="title glow" style={{fontSize:'1.2rem',marginBottom:0,flex:1,textAlign:'center'}}>Nuova Partita</h1>
        </div>

        {/* ── SAVE BANNER ── */}
        {saved&&(
          <div style={{background:'rgba(192,57,43,.07)',border:'1px solid rgba(192,57,43,.22)',borderRadius:10,padding:'9px 14px',marginBottom:22,display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
            <span style={{fontSize:'.78rem',color:'#9a7060',fontStyle:'italic'}}>Salvataggio: {saved.vName||'Villaggio'} — Giorno {saved.round||1}</span>
            <button className="btn btn-outline" style={{fontSize:'.65rem',padding:'4px 9px',flexShrink:0}} onClick={()=>{clearGame();window.location.reload();}}>✕</button>
          </div>
        )}

        {/* ── NOME VILLAGGIO ── */}
        <div className="vill-section">
          <div className="vill-frame">
            {/* Corner ornaments */}
            <span className="vill-corner vill-corner-tl">❧</span>
            <span className="vill-corner vill-corner-tr">❧</span>
            <span className="vill-corner vill-corner-bl">❧</span>
            <span className="vill-corner vill-corner-br">❧</span>
            {/* Top rule */}
            <div className="vill-rule-top">
              <div className="vill-rule-line"/><span className="vill-rule-gem">✦</span><div className="vill-rule-line"/>
            </div>
            {/* Label */}
            <div className="vill-eyebrow">— Il Villaggio di —</div>
            {/* Single input that IS the title */}
            <input
              type="text"
              className="vill-title-input"
              placeholder="Roccaverde..."
              value={vInp}
              onChange={e=>setVInp(e.target.value)}
              maxLength={30}
            />
            {/* Bottom rule */}
            <div className="vill-rule-bot">
              <div className="vill-rule-line"/><span className="vill-rule-gem">✦</span><div className="vill-rule-line"/>
            </div>
          </div>
        </div>

        {/* ── GIOCATORI ── */}
        <div className="players-section">
          <div className="players-header">
            <div className="players-heading">
              <span>🏘️</span>
              <span>Abitanti</span>
            </div>
            <div className={`players-counter${names.length>=2?' ready':''}`}>
              <span className="players-count-num">{names.length}</span>
              <span style={{margin:'0 2px',opacity:.4}}>/</span>
              <span>20</span>
            </div>
          </div>

          {/* Riga aggiunta */}
          <div className="players-add-row">
            <input
              type="text"
              className="players-add-input"
              placeholder="Nome giocatore..."
              value={inp}
              onChange={e=>setInp(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&addP()}
              maxLength={20}
            />
            <button className="players-add-btn" onClick={addP} disabled={!inp.trim()||names.length>=20}>+</button>
          </div>

          {/* Token grid */}
          {names.length>0&&(
            <div className="ptok-grid">
              {names.map((n,i)=>(
                <div key={n+i} className="ptok" style={{animationDelay:`${Math.min(i,8)*0.04}s`}}>
                  <button className="ptok-rm" onClick={()=>setNames(p=>p.filter((_,j)=>j!==i))}>✕</button>
                  <span className="ptok-icon">{P_ICONS[i%P_ICONS.length]}</span>
                  <span className="ptok-name">{n}</span>
                  <span className="ptok-num">#{i+1}</span>
                </div>
              ))}
              {names.length<20&&(
                <div className="ptok ptok-ghost">
                  <span className="ptok-icon" style={{opacity:.15}}>👤</span>
                  <span className="ptok-name" style={{color:'rgba(255,255,255,.08)'}}>·  ·  ·</span>
                </div>
              )}
            </div>
          )}

          {/* Empty state */}
          {names.length===0&&(
            <div className="players-empty">
              <span style={{fontSize:'2.2rem',display:'block',marginBottom:8,opacity:.2}}>👥</span>
              <p style={{fontSize:'.84rem',color:'#2e1e0c',fontStyle:'italic'}}>Nessun abitante ancora...</p>
            </div>
          )}

          {/* Status messages */}
          {names.length>0&&names.length<2&&(
            <p className="warn" style={{marginTop:6}}>⚠️ Minimo 2 giocatori ({2-names.length} mancante)</p>
          )}
          {names.length>=2&&(
            <p className="players-ready-msg">✓ {names.length} {names.length===1?'giocatore pronto':'giocatori pronti'} per la partita</p>
          )}
        </div>

        <button className="btn btn-gold" onClick={goRolePick} disabled={names.length<2}>
          Configura Ruoli →
        </button>

      </div></div>
    );
  }

  // ── ROLE PICK ──────────────────────────────────────────────────────────────
  if(sc==='rolePick'&&dist){
    const n=names.length;
    const nonV=ROLE_ORDER.filter(k=>k!=='villico').reduce((s,k)=>s+(dist[k]||0),0);
    const villici=n-nonV;
    const tw=(dist.lupo||0)+(dist.cucciolo||0);
    const to=n-tw;
    const valid=tw>=1&&villici>=0&&nonV<=n&&tw<to;
    const diffInfo=DIFFICULTY[difficulty];
    const changeDifficulty=(newDiff)=>{
      setDifficulty(newDiff);
      setUnlockedRoles(new Set());
      const newRoles=DIFFICULTY[newDiff].roles;
      setDist(p=>{const u={...p};Object.keys(u).forEach(k=>{if(k!=='villico'&&!newRoles.has(k))u[k]=0;});return u;});
    };
    const isLocked=(key)=>!diffInfo.roles.has(key)&&!unlockedRoles.has(key);
    const isAdvanced=(key)=>!diffInfo.roles.has(key)&&unlockedRoles.has(key);
    const unlockRole=(key)=>setUnlockedRoles(s=>{const n=new Set(s);n.add(key);return n;});
    const change=(key,delta)=>{
      if(key==='villico')return;
      setDist(p=>{
        const c=p[key]||0,nx=Math.max(0,Math.min(ROLE_MAX[key],c+delta));
        const u={...p,[key]:nx};
        if(key==='romeo')u.giulietta=nx;
        if(key==='giulietta')u.romeo=nx;
        return u;
      });
    };
    return(
      <div className="app night"><MuteBtn/><div className="astro moon"/>
      {infoModal&&<RoleModal roleKey={infoModal} onClose={()=>setInfoModal(null)}/>}
      <div className="screen fade">
        <h1 className="title">Configura Ruoli</h1>
        <p className="subtitle">{vName} — {n} giocatori</p>

        {/* ── DIFFICULTY SELECTOR ── */}
        <div style={{marginBottom:16}}>
          <div className="lbl" style={{marginBottom:8}}>Livello di difficoltà</div>
          <div style={{display:'flex',gap:6}}>
            {Object.entries(DIFFICULTY).map(([key,info])=>(
              <button key={key} onClick={()=>changeDifficulty(key)}
                style={{flex:1,fontFamily:'Cinzel,serif',fontSize:'.62rem',letterSpacing:'.05em',textTransform:'uppercase',
                  padding:'11px 4px',borderRadius:10,cursor:'pointer',transition:'all .18s',
                  background:difficulty===key?info.bg:'rgba(255,255,255,.03)',
                  border:difficulty===key?`1.5px solid ${info.color}88`:'1px solid rgba(255,255,255,.08)',
                  color:difficulty===key?info.color:'#4a3a28',
                  fontWeight:difficulty===key?700:400,lineHeight:1.3}}>
                {info.label}
              </button>
            ))}
          </div>
          <p style={{fontSize:'.77rem',color:'#5a4a30',fontStyle:'italic',marginTop:8,textAlign:'center',lineHeight:1.5}}>{diffInfo.desc}</p>
        </div>

        {/* ── SINDACO TOGGLE ── */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',background:'rgba(243,156,18,.06)',border:'1px solid rgba(243,156,18,.2)',borderRadius:12,padding:'12px 16px',marginBottom:14}}>
          <div>
            <span style={{fontFamily:'Cinzel,serif',fontSize:'.78rem',color:'#f39c12',letterSpacing:'.08em'}}>🏛️ Sindaco</span>
            <p style={{fontSize:'.74rem',color:'#7a6030',marginTop:3,fontStyle:'italic'}}>{useSindaco?'Il villaggio elegge un sindaco al primo giorno.':'Nessun sindaco in questa partita.'}</p>
          </div>
          <button onClick={()=>setUseSindaco(m=>!m)} style={{fontFamily:'Cinzel,serif',fontSize:'.65rem',letterSpacing:'.1em',textTransform:'uppercase',borderRadius:9,padding:'8px 14px',cursor:'pointer',transition:'all .2s',background:useSindaco?'rgba(243,156,18,.22)':'rgba(255,255,255,.06)',color:useSindaco?'#f39c12':'#5a4030',border:useSindaco?'1px solid rgba(243,156,18,.5)':'1px solid rgba(255,255,255,.1)'}}>
            {useSindaco?'✓ Sì':'No'}
          </button>
        </div>

        {/* ── ROLE CATEGORIES ACCORDION ── */}
        {ROLE_CATS_CONFIG.map(cat=>{
          const catTotal=cat.roles.reduce((s,k)=>s+(dist[k]||0),0);
          const isOpen=openCats[cat.id];
          return(
            <div key={cat.id} style={{marginBottom:10}}>
              <div onClick={()=>toggleCat(cat.id)} className={`cat-hdr${isOpen?' open':''}`}>
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                  <span style={{fontFamily:'Cinzel,serif',fontSize:'.82rem',color:'#c8a05a',letterSpacing:'.08em'}}>{cat.label}</span>
                  {catTotal>0&&<span style={{fontFamily:'Cinzel,serif',fontSize:'.65rem',padding:'2px 8px',borderRadius:10,background:'rgba(200,160,90,.15)',color:'#c8a05a',border:'1px solid rgba(200,160,90,.25)'}}>{catTotal} attivi</span>}
                </div>
                <span style={{color:'#6a5a40',fontSize:'.9rem',transform:isOpen?'rotate(180deg)':'none',transition:'transform .2s'}}>▼</span>
              </div>
              {isOpen&&(
                <div className="cat-body">
                  {cat.roles.map(key=>{
                    const r=ROLES[key];
                    const cnt=dist[key]||0;
                    const locked=isLocked(key);
                    const advanced=isAdvanced(key);
                    return(
                      <div key={key} className="role-row" style={{opacity:locked?.45:1,transition:'opacity .2s',background:locked?'rgba(0,0,0,.08)':'transparent'}}>
                        <span style={{fontSize:'1.2rem',marginRight:8,filter:locked?'grayscale(1) opacity(.5)':'none'}}>{r.emoji}</span>
                        <span style={{flex:1,fontSize:'.88rem',color:locked?'#3a2c18':advanced?r.color:'inherit'}}>
                          {r.name}
                          {advanced&&<span style={{marginLeft:6,fontSize:'.58rem',fontFamily:'Cinzel,serif',color:'#f39c12',border:'1px solid rgba(243,156,18,.35)',borderRadius:4,padding:'1px 5px',letterSpacing:'.05em',verticalAlign:'middle'}}>avanzato</span>}
                        </span>
                        {locked?(
                          (()=>{const dk=DIFFICULTY.medio.roles.has(key)?'medio':'difficile';const di=DIFFICULTY[dk];return(
                            <button onClick={e=>{e.stopPropagation();unlockRole(key);}}
                              style={{background:'rgba(255,255,255,.03)',border:`1px solid ${di.color}55`,borderRadius:8,padding:'5px 9px',cursor:'pointer',fontSize:'.64rem',color:di.color,whiteSpace:'nowrap',fontFamily:'Cinzel,serif',letterSpacing:'.04em',opacity:.75}}
                              title="Clicca per sbloccare">{di.label}</button>
                          );})()
                        ):(
                          <>
                            <button className="ibtn" onClick={e=>{e.stopPropagation();setInfoModal(key);}} style={{marginRight:10,fontStyle:'italic',fontFamily:'Georgia,serif',fontWeight:400,fontSize:'.9rem'}}>𝑖</button>
                            {key==='giulietta'?(
                              <span style={{fontFamily:'Cinzel,serif',fontSize:'.78rem',minWidth:80,textAlign:'center',color:'#e91e63',fontStyle:'italic'}}>= Romeo ({cnt})</span>
                            ):(
                              <div style={{display:'flex',alignItems:'center'}}>
                                <button onClick={e=>{e.stopPropagation();change(key,-1);}} className="rr-cnt-btn" style={{borderRadius:'8px 0 0 8px'}}>−</button>
                                <span className="rr-cnt-val" style={{color:cnt>0?r.color:'var(--text-muted)'}}>{cnt}</span>
                                <button onClick={e=>{e.stopPropagation();change(key,+1);}} className="rr-cnt-btn" style={{borderRadius:'0 8px 8px 0'}}>+</button>
                              </div>
                            )}
                          </>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}

        {/* Villici auto */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 16px',background:'rgba(255,255,255,.02)',border:'1px solid rgba(255,255,255,.06)',borderRadius:10,marginBottom:14}}>
          <span style={{display:'flex',alignItems:'center',gap:8}}><span style={{fontSize:'1.2rem'}}>🧑‍🌾</span><span style={{fontSize:'.88rem'}}>{ROLES.villico.name}</span></span>
          <span style={{fontFamily:'Cinzel,serif',fontSize:'.8rem',color:villici<0?'#e74c3c':'#6a5a40',fontStyle:'italic'}}>auto: {Math.max(0,villici)}</span>
        </div>
        {villici<0&&<p className="warn">⚠️ Troppi ruoli speciali! ({Math.abs(villici)} in eccesso)</p>}
        {tw===0&&<p className="warn">⚠️ Serve almeno 1 Lupo o Cucciolo.</p>}
        {tw>=to&&tw>0&&<p className="warn">⚠️ I lupi sono troppi rispetto agli altri.</p>}
        {(()=>{
          const soloKeys=['suicida','criceto','piromane','corvo','misantropo','vampiro','orfano','funambolo'];
          const ordineKeys=['veggente','negromante','alchimista','custode','araldo','condor','mutaforma','accusatore'];
          const tSolo=soloKeys.reduce((s,k)=>s+(dist[k]||0),0);
          const tOrd=ordineKeys.reduce((s,k)=>s+(dist[k]||0),0);
          const tVill=Math.max(0,villici);
          const tAll=tw+tSolo+tOrd+tVill;
          if(tAll===0)return null;
          return(<div style={{marginBottom:14}}>
            <div style={{display:'flex',height:8,borderRadius:4,overflow:'hidden',marginBottom:8}}>
              {tw>0&&<div style={{flex:tw,background:'#c0392b',opacity:.8}}/>}
              {tVill>0&&<div style={{flex:tVill,background:'#27ae60',opacity:.7}}/>}
              {tOrd>0&&<div style={{flex:tOrd,background:'#1abc9c',opacity:.7}}/>}
              {tSolo>0&&<div style={{flex:tSolo,background:'#9b59b6',opacity:.7}}/>}
            </div>
            <div style={{display:'flex',flexWrap:'wrap',gap:'6px 12px',fontSize:'.75rem',fontFamily:'Cinzel,serif',letterSpacing:'.06em'}}>
              {tw>0&&<span style={{color:'#e74c3c'}}>🐺 {tw} {tw===1?'Lupo':'Lupi'}</span>}
              {tVill>0&&<span style={{color:'#2ecc71'}}>🧑‍🌾 {tVill} Villici</span>}
              {tOrd>0&&<span style={{color:'#1abc9c'}}>⚖️ {tOrd} Ordine</span>}
              {tSolo>0&&<span style={{color:'#9b59b6'}}>🎭 {tSolo} Solisti</span>}
            </div>
          </div>);
        })()}
        {valid&&<p style={{color:'#2ecc71',fontSize:'.84rem',fontStyle:'italic',marginBottom:12,textAlign:'center'}}>✓ Configurazione valida</p>}

        {/* ── MODALITÀ DI GIOCO ── */}
        {(()=>{
          const selMod=modalitaSpeciale?MODALITA_SPECIALI.find(m=>m.id===modalitaSpeciale):null;
          return(
            <div style={{marginBottom:14}}>

              {/* ─ Header accordion ─ */}
              <div style={{background:selMod?selMod.color+'14':'rgba(155,89,182,.07)',border:`1px solid ${selMod?selMod.color+'55':'rgba(155,89,182,.22)'}`,borderRadius:modalitaOpen?'12px 12px 0 0':'12px',padding:'14px 16px',cursor:'pointer',transition:'all .2s'}}
                onClick={()=>setModalitaOpen(o=>!o)}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                  <div>
                    <span style={{fontFamily:'Cinzel,serif',fontSize:'.78rem',color:selMod?selMod.color:'#9b59b6',letterSpacing:'.08em'}}>🎭 Modalità di Gioco</span>
                    {selMod
                      ?<p style={{fontSize:'.74rem',color:selMod.color,marginTop:3,fontWeight:700,fontFamily:'Cinzel,serif'}}>{selMod.icon} {selMod.name}</p>
                      :<p style={{fontSize:'.74rem',color:'#5a4060',marginTop:3,fontStyle:'italic'}}>Partita Libera — configura i ruoli manualmente</p>
                    }
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    {selMod&&(
                      <button onClick={e=>{e.stopPropagation();setModalitaSpeciale(null);setOrdineMode(false);setDist(getSuggestedDist(names.length));}}
                        style={{fontFamily:'Cinzel,serif',fontSize:'.6rem',letterSpacing:'.08em',border:`1px solid ${selMod.color}66`,borderRadius:8,padding:'5px 10px',background:`${selMod.color}18`,color:selMod.color,cursor:'pointer'}}>
                        ✕ Reset
                      </button>
                    )}
                    <span style={{color:'#7a5a90',fontSize:'.85rem',transform:modalitaOpen?'rotate(180deg)':'none',transition:'transform .2s'}}>▼</span>
                  </div>
                </div>
              </div>

              {/* ─ Dropdown lista ─ */}
              {modalitaOpen&&(
                <div style={{background:'rgba(10,8,18,.9)',border:'1px solid rgba(155,89,182,.2)',borderTop:'none',borderRadius:'0 0 12px 12px',padding:'10px 10px 14px',display:'flex',flexDirection:'column',gap:6}}>
                  {/* Opzione "libera" */}
                  <div onClick={()=>{setModalitaSpeciale(null);setOrdineMode(false);setDist(getSuggestedDist(names.length));setModalitaOpen(false);}}
                    style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:10,border:`1px solid ${!modalitaSpeciale?'rgba(201,162,39,.5)':'rgba(255,255,255,.07)'}`,background:!modalitaSpeciale?'rgba(201,162,39,.1)':'rgba(255,255,255,.02)',cursor:'pointer',transition:'all .15s'}}>
                    <span style={{fontSize:'1.4rem'}}>🎲</span>
                    <div style={{flex:1}}>
                      <div style={{fontFamily:'Cinzel,serif',fontSize:'.8rem',color:!modalitaSpeciale?'#c9a227':'#7a6840',fontWeight:!modalitaSpeciale?700:400}}>Partita Libera</div>
                      <div style={{fontSize:'.7rem',color:'#4a3a20',fontStyle:'italic',marginTop:1}}>Configura i ruoli manualmente</div>
                    </div>
                    {!modalitaSpeciale&&<span style={{color:'#c9a227'}}>✓</span>}
                  </div>
                  {/* Separatore */}
                  <div style={{height:1,background:'linear-gradient(to right,transparent,rgba(155,89,182,.2),transparent)',margin:'2px 0'}}/>
                  {MODALITA_SPECIALI.map(m=>{
                    const isSel=modalitaSpeciale===m.id;
                    return(
                      <div key={m.id}
                        onClick={()=>{setModalitaSpeciale(m.id);setDist(m.preset(names.length,getSuggestedDist(names.length)));setOrdineMode(m.autoRoles.ordineMode);setModalitaOpen(false);}}
                        style={{display:'flex',alignItems:'flex-start',gap:10,padding:'10px 12px',borderRadius:10,border:`1px solid ${isSel?m.color+'88':'rgba(255,255,255,.07)'}`,background:isSel?m.color+'18':'rgba(255,255,255,.02)',cursor:'pointer',transition:'all .15s'}}>
                        <span style={{fontSize:'1.4rem',flexShrink:0,marginTop:2}}>{m.icon}</span>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontFamily:'Cinzel,serif',fontSize:'.8rem',color:isSel?m.color:'#a08060',fontWeight:isSel?700:400,marginBottom:2}}>{m.name}</div>
                          <div style={{fontSize:'.7rem',color:'#5a4a30',fontStyle:'italic',lineHeight:1.5,marginBottom:4}}>{m.short}</div>
                          <div style={{display:'flex',flexWrap:'wrap',gap:3}}>
                            {m.fazioni.map(f=>(
                              <span key={f} style={{fontFamily:'Cinzel,serif',fontSize:'.56rem',padding:'2px 6px',borderRadius:7,background:`${m.color}14`,border:`1px solid ${m.color}33`,color:m.color,letterSpacing:'.05em'}}>{f}</span>
                            ))}
                          </div>
                        </div>
                        {isSel&&<span style={{color:m.color,flexShrink:0}}>✓</span>}
                      </div>
                    );
                  })}
                </div>
              )}

              {/* ─ Riquadro guida modalità selezionata ─ */}
              {!modalitaOpen&&selMod&&(
                <div style={{background:`${selMod.color}0c`,border:`1px solid ${selMod.color}33`,borderTop:'none',borderRadius:'0 0 12px 12px',padding:'16px 16px 18px'}}>
                  {/* Descrizione */}
                  <p style={{fontSize:'.82rem',color:'#9a8870',fontStyle:'italic',lineHeight:1.75,marginBottom:14}}>{selMod.desc}</p>
                  {/* Fazioni */}
                  <div style={{display:'flex',flexWrap:'wrap',gap:5,marginBottom:10}}>
                    {selMod.fazioni.map(f=>(
                      <span key={f} style={{fontFamily:'Cinzel,serif',fontSize:'.6rem',padding:'3px 10px',borderRadius:10,background:`${selMod.color}18`,border:`1px solid ${selMod.color}44`,color:selMod.color,letterSpacing:'.08em'}}>{f}</span>
                    ))}
                  </div>
                  {selMod.nota&&<p style={{fontSize:'.68rem',color:'#5a4060',fontStyle:'italic',marginBottom:14}}>⚠ {selMod.nota}</p>}
                  {/* Schede guida */}
                  {selMod.guida&&selMod.guida.length>0&&(
                    <>
                      <div style={{height:1,background:`linear-gradient(to right,transparent,${selMod.color}33,transparent)`,margin:'4px 0 14px'}}/>
                      <div style={{fontFamily:'Cinzel,serif',fontSize:'.6rem',letterSpacing:'.18em',textTransform:'uppercase',color:selMod.color,opacity:.7,marginBottom:10}}>Guida per il Narratore</div>
                      <div style={{display:'flex',flexDirection:'column',gap:8}}>
                        {selMod.guida.map((g,gi)=>(
                          <div key={gi} style={{display:'flex',gap:10,padding:'10px 12px',background:'rgba(0,0,0,.2)',borderRadius:10,border:`1px solid ${selMod.color}22`}}>
                            <span style={{fontSize:'1.2rem',flexShrink:0,marginTop:1}}>{g.emoji}</span>
                            <div>
                              <div style={{fontFamily:'Cinzel,serif',fontSize:'.72rem',color:selMod.color,marginBottom:3,fontWeight:600}}>{g.titolo}</div>
                              <div style={{fontSize:'.8rem',color:'#8a7a60',lineHeight:1.6,fontStyle:'italic'}}>{g.testo}</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </>
                  )}
                  {/* Ordine mode info inline se attivo */}
                  {selMod.autoRoles.ordineMode&&(
                    <div style={{marginTop:12,padding:'8px 12px',background:'rgba(26,188,156,.07)',borderRadius:8,border:'1px solid rgba(26,188,156,.2)'}}>
                      <p style={{fontSize:'.75rem',color:'#1abc9c',fontFamily:'Cinzel,serif',marginBottom:3,letterSpacing:'.06em'}}>🔮 Modalità Ordine attiva</p>
                      <p style={{fontSize:'.75rem',color:'#4a8070',fontStyle:'italic',lineHeight:1.55}}>I ruoli Ordine (Veggente, Negromante, Alchimista, Custode, Araldo) formano una fazione separata. Vincono se tutti i Lupi sono morti <strong style={{color:'#1abc9c'}}>e</strong> superano i Contadini in vita.</p>
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })()}
        <button className="btn btn-gold mb8" onClick={confirmRoles} disabled={!valid}>Inizia Partita</button>
        <button className="btn btn-outline mb8" onClick={()=>setSc('setup')}>← Modifica Giocatori</button>
        <button className="btn btn-outline" onClick={()=>setDist(getSuggestedDist(names.length))}>↺ Reimposta Suggeriti</button>
      </div></div>
    );
  }

  // ── ROLE REVEAL ─────────────────────────────────────────────────────────────
  if(sc==='roleReveal'){
    const p=players[ri];const r=ROLES[p.role];
    const isOrdineRole=ordineMode&&r.isOrdine;
    const tl=r.soloTeam?'⚖️ Fazione Solitaria':r.wolfTeam?'🐺 Squadra Lupi':r.winsWithWolves?'😒 Vinci coi Lupi':isOrdineRole?'🔮 Ordine':'🏘️ Squadra Villaggio';
    const tc=r.soloTeam?'#f39c12':r.wolfTeam||r.winsWithWolves?'#e74c3c':isOrdineRole?'#1abc9c':'#2ecc71';
    return(
      <div className="app night"><MuteBtn/><div className="astro moon"/>
      <div className="screen fade">
        <h1 className="title" style={{fontSize:'1.3rem',marginBottom:4}}>Assegnazione Ruoli</h1>
        <p className="subtitle" style={{marginBottom:16}}>{vName}</p>
        <div className="pill-center" style={{marginBottom:20}}>
          <span className="pill">{ri+1} / {players.length} — {p.name}</span>
        </div>
        {!rv?(
          <div className="reveal-back" onClick={()=>setRv(true)}>
            <span style={{fontSize:'3.5rem',filter:'blur(2px)',opacity:.5}}>🃏</span>
            <span className="reveal-hint">Tocca per scoprire il tuo ruolo</span>
            <span style={{fontSize:'.8rem',color:'#3a2c14',fontStyle:'italic'}}>Assicurati di essere solo tu a guardare</span>
          </div>
        ):(
          <div className="reveal-front" style={{'--role-glow':r.color+'44'}}>
            <span className="re">{r.emoji}</span>
            <div className="rn" style={{color:r.color}}>{r.name}</div>
            <p className="rd">{r.desc}</p>
            <div className="rt" style={{color:tc,borderColor:tc+'44'}}>{tl}</div>
          </div>
        )}
        <button className="btn btn-gold" onClick={nextReveal} disabled={!rv}>
          {ri+1===players.length?'🌙 Inizia la Notte':`Passa a ${players[ri+1].name} →`}
        </button>
      </div></div>
    );
  }

  // ── NIGHT ───────────────────────────────────────────────────────────────────
  if(sc==='night'){
    if(ns==='guardia'){
      const guardIdx=players.findIndex(p=>p.role==='guardia'&&p.alive);
      const guardBlocked=ac!==null&&ac===guardIdx&&guardIdx!==-1;
      const guardBadges=!guardSelfUsed&&guardIdx>=0?{[guardIdx]:'(1×)'}:{};
      const guardDisabled=guardSelfUsed&&guardIdx>=0?new Set([guardIdx]):new Set();
      return(
        <NW color="#2980b9" emoji="🛡️" title="La Guardia del Corpo si sveglia">
          {guardBlocked?(
            <><div className="instr" style={{borderColor:'rgba(39,174,96,.3)',color:'#70a080'}}>🏹 L'Arciere ha bloccato la Guardia. Non può proteggere nessuno stanotte.</div>
            <button className="btn btn-gold" onClick={()=>advance('guardia',players)}>Continua →</button></>
          ):(
            <><div className="instr">La Guardia indica silenziosamente chi proteggere stanotte.{!guardSelfUsed&&<span style={{display:'block',fontSize:'.78rem',color:'#c9a227',marginTop:5,fontStyle:'normal'}}>💡 <strong>(1×)</strong> = può proteggersi una sola volta in tutta la partita.</span>}{guardSelfUsed&&<span style={{display:'block',fontSize:'.78rem',color:'#6a5030',marginTop:5,fontStyle:'normal'}}>🔒 Ha già usato l'auto-protezione — non può più scegliere se stesso.</span>}</div>
            <div className="nlbl">Chi protegge?</div>
            <PList players={alive} sel={gc} onSel={setGc} disabledIds={guardDisabled} badges={guardBadges}/>
            <button className="btn btn-gold" onClick={confGuard} disabled={gc===null}>Conferma Protezione</button></>
          )}
        </NW>
      );
    }

    if(ns==='arciere') return(
      <NW color="#27ae60" emoji="🏹" title="L'Arciere si sveglia">
        <div className="instr">L'Arciere scocca una freccia silenziosa — la persona scelta perde i suoi poteri stanotte.</div>
        <div className="nlbl">Chi blocca?</div>
        <PList players={alive.filter(p=>p.role!=='arciere')} sel={ac} onSel={setAc}/>
        <button className="btn btn-gold mb8" onClick={confArc} disabled={ac===null}>Conferma</button>
        <button className="btn btn-outline" onClick={skipArc}>Passa senza agire</button>
      </NW>
    );

    if(ns==='custode') return(
      <NW color="#95a5a6" emoji="🤫" title="Il Custode del Silenzio si sveglia">
        {isBlocked('custode')?(
          <><div className="instr" style={{borderColor:'rgba(39,174,96,.3)',color:'#70a080'}}>🏹 L'Arciere ha bloccato il Custode. Non può silenziare nessuno stanotte.</div>
          <button className="btn btn-gold" onClick={skipCus}>Continua →</button></>
        ):round<2?(
          <><div className="instr">Il Custode non può ancora agire — il suo potere si attiva dalla seconda notte.</div>
          <button className="btn btn-gold" onClick={skipCus}>Continua →</button></>
        ):(
          <><div className="instr">Il Custode indica chi sarà costretto al silenzio domani.</div>
          <div className="nlbl">Chi silenziare?</div>
          <PList players={alive.filter(p=>p.role!=='custode')} sel={cusC} onSel={setCusC}/>
          <button className="btn btn-gold mb8" onClick={confCus} disabled={cusC===null}>Conferma</button>
          <button className="btn btn-outline" onClick={skipCus}>Passa senza agire</button></>
        )}
      </NW>
    );

    if(ns==='funambolo'){
      const flipCoin=()=>{setFunamboloCoin(Math.random()<0.5?'testa':'croce');};
      return(
        <NW color="#16a085" emoji="🎪" title="Il Funambolo cammina sul filo">
          <div className="instr">Il Narratore lancia in segreto la moneta del destino. Il risultato è solo suo.</div>
          {!funamboloCoin?(
            <>
              <div style={{textAlign:'center',padding:'24px 0'}}>
                <div style={{fontSize:'4rem',marginBottom:16,filter:'drop-shadow(0 0 12px rgba(22,160,133,.6))'}}>🪙</div>
                <p style={{color:'#5a8070',fontStyle:'italic',fontSize:'.88rem',marginBottom:20}}>Testa = immune a qualsiasi morte stanotte<br/>Croce = muore comunque, anche se protetto</p>
              </div>
              <button className="btn btn-gold mb8" style={{background:'rgba(22,160,133,.2)',borderColor:'rgba(22,160,133,.5)',color:'#1abc9c'}} onClick={flipCoin}>🪙 Lancia la Moneta</button>
            </>
          ):(
            <>
              <div style={{textAlign:'center',padding:'20px 0'}}>
                <div style={{fontSize:'4rem',marginBottom:12,animation:'fadeUp .4s ease'}}>{funamboloCoin==='testa'?'⭕':'❌'}</div>
                <div style={{fontFamily:'Cinzel,serif',fontSize:'1.2rem',color:funamboloCoin==='testa'?'#1abc9c':'#e74c3c',marginBottom:8,fontWeight:600}}>
                  {funamboloCoin==='testa'?'TESTA — Immune!':'CROCE — Vulnerabile!'}
                </div>
                <p style={{color:'#5a8070',fontStyle:'italic',fontSize:'.85rem'}}>
                  {funamboloCoin==='testa'?'Il Funambolo non può morire stanotte.':'Il Funambolo muore anche se protetto dalla Guardia.'}
                </p>
              </div>
              <button className="btn btn-outline mb8" style={{fontSize:'.72rem',color:'#5a8070'}} onClick={flipCoin}>↺ Rilancia</button>
              <button className="btn btn-gold" onClick={()=>advance('funambolo',players)}>Conferma →</button>
            </>
          )}
        </NW>
      );
    }

    if(ns==='lupi'){
      const lupoOk=players.some(p=>p.role==='lupo'&&p.alive);
      const cucHere=!lupoOk&&players.some(p=>p.role==='cucciolo'&&p.alive);
      const cucBlock=cucHere&&cFirst;
      // Arciere logic: lupoAlpha (Lupo Mannaro) blocked = no attack; lupo (Lupo Grande) blocked = no attack; cucciolo-solo blocked = no attack
      const alphaIdx=players.findIndex(p=>p.role==='lupoAlpha'&&p.alive);
      const arcBlockedAlpha=ac!==null&&ac===alphaIdx&&alphaIdx!==-1;
      const arcBlockedLupo=ac!==null&&players[ac]?.role==='lupo';
      const arcBlockedCucSolo=cucHere&&ac!==null&&players[ac]?.role==='cucciolo';
      const wolvesBlocked=arcBlockedAlpha||arcBlockedLupo||arcBlockedCucSolo;
      return(
        <NW color="#e74c3c" emoji="🐺" title={cucHere?'Il Lupo Cucciolo si sveglia':'I Lupi si svegliano'}>
          {wolvesBlocked?(
            <><div className="instr" style={{borderColor:'rgba(39,174,96,.3)',color:'#70a080'}}>🏹 L'Arciere ha bloccato {arcBlockedAlpha?'il Lupo Mannaro':arcBlockedLupo?'il Lupo Grande':'il Cucciolo'}. Nessun attacco questa notte.</div>
            <button className="btn btn-gold" onClick={()=>confWolves(true)}>Conferma — nessuna vittima →</button></>
          ):cucBlock?(
            <><div className="instr">🐶 Il Cucciolo ha perso il suo branco. Questa notte non riesce ad agire — dalla prossima potrà uccidere.</div>
            <button className="btn btn-gold" onClick={()=>confWolves(true)}>Notte senza vittima →</button></>
          ):(
            <><div className="instr">{cucHere?'Il Cucciolo si è trasformato. Indica la vittima.':'I Lupi si riconoscono e scelgono la vittima in silenzio.'}</div>
            {lupoAlphaActivatedName&&<div style={{fontSize:'.82rem',color:'#e74c3c',fontWeight:600,marginBottom:10,padding:'8px 12px',background:'rgba(231,76,60,.1)',borderRadius:8,border:'1px solid rgba(231,76,60,.3)'}}>🐺 <strong>{lupoAlphaActivatedName}</strong> il Lupo Mannaro si è trasformato stanotte — è ora un Lupo Grande. Chiamatelo nel turno del branco!</div>}
            {(()=>{const mIdx=players.findIndex(p=>p.role==='mutaforma'&&p.alive);const cIdx=players.findIndex(p=>p.role==='condor'&&p.alive);const mutW=mutRole&&ROLES[mutRole]?.wolfTeam;const conW=conRole&&ROLES[conRole]?.wolfTeam;return(<>{mutW&&mIdx!==-1&&<div style={{fontSize:'.78rem',color:'#bdc3c7',fontStyle:'italic',marginBottom:8,padding:'6px 10px',background:'rgba(189,195,199,.08)',borderRadius:6,border:'1px solid rgba(189,195,199,.2)'}}>🔄 {players[mIdx].name} (Mutaforma → {ROLES[mutRole].emoji}{ROLES[mutRole].name}) si sveglia con il branco.</div>}{conW&&cIdx!==-1&&<div style={{fontSize:'.78rem',color:'#d35400',fontStyle:'italic',marginBottom:8,padding:'6px 10px',background:'rgba(211,84,0,.08)',borderRadius:6,border:'1px solid rgba(211,84,0,.2)'}}>🦅 {players[cIdx].name} (Condor → {ROLES[conRole].emoji}{ROLES[conRole].name}) si sveglia con il branco.</div>}</>);})()}
            <div className="nlbl">Chi attaccano i Lupi?</div>
            <PList players={alive.filter(p=>{const ek=(p.role==='mutaforma'&&mutRole)?mutRole:(p.role==='condor'&&conRole)?conRole:p.role;return!ROLES[ek].wolfTeam&&!ROLES[ek].winsWithWolves&&ek!=='cucciolo';})} sel={wc} onSel={setWc}/>
            <button className="btn btn-gold mb8" onClick={()=>confWolves(false)} disabled={wc===null}>Conferma Vittima</button>
            <button className="btn btn-outline" onClick={()=>confWolves(true)}>Nessuna vittima</button></>
          )}
        </NW>
      );
    }

    if(ns==='veggente') return(
      <NW color="#9b59b6" emoji="🔮" title="La Veggente si sveglia">
        {isBlocked('veggente')?(
          <><div className="instr" style={{borderColor:'rgba(39,174,96,.3)',color:'#70a080'}}>🏹 L'Arciere ha bloccato la Veggente. Non può scrutare nessuno stanotte.</div>
          <button className="btn btn-gold" onClick={endSeer}>Continua →</button></>
        ):<><div className="instr">La Veggente scruta l'anima di un giocatore.</div>
        {vr?(
          <><div className="vbox fade">
            <div className="vlbl">Solo per il Narratore</div>
            <div style={{marginBottom:8,fontSize:'.95rem'}}><strong style={{color:'#c8a05a'}}>{players[vr.idx].name}</strong> appare come...</div>
            {(()=>{
              const isLupo=vr.seen==='lupo';
              return(
                <><div style={{fontSize:'2.5rem',marginBottom:8}}>{isLupo?'🐺':'🧑‍🌾'}</div>
                <div style={{color:isLupo?'#e74c3c':'#2ecc71',fontFamily:'Cinzel,serif',fontWeight:600}}>{isLupo?'Lupo':'Innocente'}</div>
                {isLupo&&<div style={{fontSize:'.74rem',marginTop:6,color:'#8a4040',fontStyle:'italic'}}>{ROLES[vr.role]?.name||'Lupo'}</div>}
                {vr.role==='lupoAlpha'&&<div style={{fontSize:'.74rem',marginTop:6,color:'#6a5a40',fontStyle:'italic'}}>(In realtà è il Lupo Mannaro — ancora innocente)</div>}
                {vr.role==='cucciolo'&&<div style={{fontSize:'.74rem',marginTop:6,color:'#6a5a40',fontStyle:'italic'}}>(In realtà è il Lupo Cucciolo)</div>}
                {vr.role==='incompreso'&&<div style={{fontSize:'.74rem',marginTop:6,color:'#6a5a40',fontStyle:'italic'}}>(In realtà è l'Incompreso — è innocente)</div>}
                {vr.role==='criceto'&&<div style={{fontSize:'.74rem',marginTop:8,color:'#c0392b',fontStyle:'italic',borderTop:'1px solid rgba(192,57,43,.25)',paddingTop:8}}>⚠️ Narratore: è il Criceto — morirà all'alba.</div>}
                </>
              );
            })()}
          </div>
          <p className="muted mb8" style={{textAlign:'center'}}>La Veggente richiude gli occhi</p>
          <button className="btn btn-gold" onClick={endSeer}>Fine turno →</button></>
        ):(
          <><div className="nlbl">Chi scruta?</div>
          <PList players={alive.filter(p=>p.role!=='veggente')} sel={vc} onSel={setVc}/>
          <button className="btn btn-gold" onClick={confSeer} disabled={vc===null}>Rivela Identità</button></>
        )}</>}
      </NW>
    );

    if(ns==='meretrice') return(
      <NW color="#c0392b" emoji="💋" title="La Meretrice si sveglia">
        {isBlocked('meretrice')?(
          <><div className="instr" style={{borderColor:'rgba(39,174,96,.3)',color:'#70a080'}}>🏹 L'Arciere ha bloccato la Meretrice. Resta a casa stanotte.</div>
          <button className="btn btn-gold" onClick={skipMer}>Continua →</button></>
        ):(
          <><div className="instr">La Meretrice indica da chi vuole passare la notte.</div>
          <div className="nlbl">Da chi va?</div>
          <PList players={alive.filter(p=>p.role!=='meretrice')} sel={mc} onSel={setMc}/>
          <button className="btn btn-gold mb8" onClick={confMer} disabled={mc===null}>Conferma</button>
          <button className="btn btn-outline" onClick={skipMer}>Resta a casa stanotte</button></>
        )}
      </NW>
    );

    if(ns==='negromante') return(
      <NW color="#7f8c8d" emoji="💀" title="Il Negromante si sveglia">
        {isBlocked('negromante')?(
          <><div className="instr" style={{borderColor:'rgba(39,174,96,.3)',color:'#70a080'}}>🏹 L'Arciere ha bloccato il Negromante. Non può interrogare i morti stanotte.</div>
          <button className="btn btn-gold" onClick={()=>{setNegC(null);endNeg();}}>Continua →</button></>
        ):negR?(
          <><div className="vbox fade">
            <div className="vlbl">Solo per il Narratore</div>
            <div style={{marginBottom:8}}><strong style={{color:'#c8a05a'}}>{players[negR.idx].name}</strong> era...</div>
            <div style={{fontSize:'2rem',marginBottom:6}}>{ROLES[negR.role].emoji}</div>
            <div style={{color:ROLES[negR.role].color,fontFamily:'Cinzel,serif',fontWeight:600}}>{ROLES[negR.role].name}</div>
          </div>
          <button className="btn btn-gold" onClick={endNeg}>Fine turno →</button></>
        ):(
          <>{dead.length===0?(
            <><div className="instr">Non ci sono ancora morti.</div>
            <button className="btn btn-gold" onClick={()=>{setNegC(null);endNeg();}}>Continua →</button></>
          ):(
            <><div className="nlbl">Quale morto esamina?</div>
            <PList players={dead} sel={negC} onSel={setNegC}/>
            <button className="btn btn-gold mb8" onClick={confNeg} disabled={negC===null}>Rivela Ruolo</button>
            <button className="btn btn-outline" onClick={()=>{setNegC(null);endNeg();}}>Passa senza agire</button></>
          )}</>
        )}
      </NW>
    );

    if(ns==='accusatore'){
      const canAct=round>=2&&(accLast===-1||round-accLast>=2);
      return(
        <NW color="#c0392b" emoji="👉" title="L'Accusatore si sveglia">
          {isBlocked('accusatore')?(
            <><div className="instr" style={{borderColor:'rgba(39,174,96,.3)',color:'#70a080'}}>🏹 L'Arciere ha bloccato l'Accusatore. Non può accusare stanotte.</div>
            <button className="btn btn-gold" onClick={skipAcc}>Continua →</button></>
          ):!canAct?(
            <><div className="instr">{round<2?'L\'Accusatore agisce dalla seconda notte.':'L\'Accusatore deve aspettare ancora una notte.'}</div>
            <button className="btn btn-gold" onClick={skipAcc}>Continua →</button></>
          ):accR?(
            <><div className="vbox fade">
              <div className="vlbl">Solo per il Narratore</div>
              {accR.isWolf?(<><div style={{fontSize:'2rem',marginBottom:6}}>🐺</div><div style={{color:'#e74c3c',fontFamily:'Cinzel,serif',fontWeight:600}}>È un Lupo! Verrà rivelato all'alba.</div></>
              ):(<><div style={{fontSize:'2rem',marginBottom:6}}>☠️</div><div style={{color:'#e74c3c',fontFamily:'Cinzel,serif',fontWeight:600}}>È innocente. L'Accusatore muore.</div></>)}
            </div>
            <button className="btn btn-gold" onClick={endAcc}>Fine turno →</button></>
          ):(
            <><div className="instr">L'Accusatore punta il dito. Se sbaglia, paga con la vita.</div>
            <div className="nlbl">Chi accusa?</div>
            <PList players={alive.filter(p=>p.role!=='accusatore')} sel={accC} onSel={setAccC}/>
            <button className="btn btn-gold mb8" onClick={confAcc} disabled={accC===null}>Accusa</button>
            <button className="btn btn-outline" onClick={skipAcc}>Passa senza agire</button></>
          )}
        </NW>
      );
    }

    if(ns==='piromane') return(
      <NW color="#e67e22" emoji="🔥" title="Il Piromane si sveglia">
        {isBlocked('piromane')?(
          <><div className="instr" style={{borderColor:'rgba(39,174,96,.3)',color:'#70a080'}}>🏹 L'Arciere ha bloccato il Piromane. Non può incendiare stanotte.</div>
          <button className="btn btn-gold" onClick={skipPir}>Continua →</button></>
        ):pirUsed?(
          <><div className="instr">Il Piromane ha già usato il suo fuoco. Osserva in silenzio.</div>
          <button className="btn btn-gold" onClick={skipPir}>Continua →</button></>
        ):(
          <><div className="instr">Il Piromane può incendiare una casa. Se è un lupo muore lui; se è innocente muore il Piromane.</div>
          <div className="nlbl">Chi incendia?</div>
          <PList players={alive.filter(p=>p.role!=='piromane')} sel={pirC} onSel={setPirC}/>
          <button className="btn btn-gold mb8" onClick={confPir} disabled={pirC===null}>Appicca il fuoco</button>
          <button className="btn btn-outline" onClick={skipPir}>Passa senza agire</button></>
        )}
      </NW>
    );

    if(ns==='alchimista') return(
      <NW color="#1abc9c" emoji="⚗️" title="L'Alchimista si sveglia">
        {isBlocked('alchimista')?(
          <><div className="instr" style={{borderColor:'rgba(39,174,96,.3)',color:'#70a080'}}>🏹 L'Arciere ha bloccato l'Alchimista. Non può usare pozioni stanotte.</div>
          <button className="btn btn-gold" onClick={skipAlch}>Continua →</button></>
        ):alchUsed?(
          <><div className="instr">L'Alchimista ha già usato la sua pozione.</div>
          <button className="btn btn-gold" onClick={skipAlch}>Continua →</button></>
        ):!alchAct?(
          <><div className="instr">L'Alchimista sceglie quale pozione usare.</div>
          <button className="btn btn-gold mb8" onClick={()=>confAlchAct('rossa')}>🔴 Pozione Rossa — Resuscita</button>
          <button className="btn btn-gold mb8" onClick={()=>confAlchAct('nera')}>⚫ Pozione Nera — Avvelena</button>
          <button className="btn btn-outline" onClick={skipAlch}>Passa senza agire</button></>
        ):alchAct==='rossa'?(
          <><div className="instr">Scegli 2 giocatori morti: uno verrà resuscitato a caso.</div>
          <div className="nlbl">Scegli 2 morti ({alchTs.length}/2)</div>
          <PList players={dead} sel={alchTs} onSel={setAlchTs} multi={true}/>
          <button className="btn btn-gold mb8" onClick={confAlchTarget} disabled={alchTs.length!==2}>Usa Pozione</button>
          <button className="btn btn-outline" onClick={()=>{setAlchAct(null);setAlchUsed(false);}}>← Indietro</button></>
        ):(
          <><div className="instr">Scegli un giocatore vivo da avvelenare. Morirà la prossima notte.</div>
          <div className="nlbl">Chi avvelena?</div>
          <PList players={alive.filter(p=>p.role!=='alchimista')} sel={alchT} onSel={setAlchT}/>
          <button className="btn btn-gold mb8" onClick={confAlchTarget} disabled={alchT===null}>Usa Pozione</button>
          <button className="btn btn-outline" onClick={()=>{setAlchAct(null);setAlchUsed(false);}}>← Indietro</button></>
        )}
      </NW>
    );

    if(ns==='araldo') return(
      <NW color="#d4ac0d" emoji="📯" title="L'Araldo del Crepuscolo si desta">
        {isBlocked('araldo')?(
          <><div className="instr" style={{borderColor:'rgba(39,174,96,.3)',color:'#70a080'}}>🏹 L'Arciere ha bloccato l'Araldo. Non può agire stanotte.</div>
          <button className="btn btn-gold" onClick={()=>advance('araldo',players)}>Continua →</button></>
        ):araldoUsed?(
          <><div className="instr">L'Araldo ha già usato il suo potere. Giace in silenzio.</div>
          <button className="btn btn-gold" onClick={()=>advance('araldo',players)}>Continua →</button></>
        ):round>3?(
          <><div className="instr">Il potere dell'Araldo è scaduto — poteva agire solo entro la terza notte.</div>
          <button className="btn btn-gold" onClick={()=>advance('araldo',players)}>Continua →</button></>
        ):(
          <>
            <div className="instr">L'Araldo forza il villaggio a scegliere tra due soli candidati per la votazione di oggi. Scegli i due nomi da imporre — poi l'Araldo muore.</div>
            <div className="nlbl">Primo candidato ({araldoCands.length>=1?players[araldoCands[0]].name:'non scelto'})</div>
            <PList players={alive.filter(p=>p.role!=='araldo'&&p._i!==araldoCands[1])} sel={araldoCands[0]??null} onSel={i=>{
              setAraldoCands(prev=>{const n=[...prev];n[0]=i;return n.filter((_,idx)=>idx<2);});
            }}/>
            <div className="nlbl" style={{marginTop:8}}>Secondo candidato ({araldoCands.length>=2?players[araldoCands[1]].name:'non scelto'})</div>
            <PList players={alive.filter(p=>p.role!=='araldo'&&p._i!==araldoCands[0])} sel={araldoCands[1]??null} onSel={i=>{
              setAraldoCands(prev=>{const n=[...prev];n[1]=i;return n.filter((_,idx)=>idx<2);});
            }}/>
            <button className="btn btn-gold mb8" onClick={()=>{
              setAraldoUsed(true);
              // l'araldo muore dopo aver usato il potere
              const np=players.map(p=>p.role==='araldo'?{...p,alive:false}:p);
              setPlayers(np);
              advance('araldo',np);
            }} disabled={araldoCands.length<2}>📯 Attiva il Potere (e muori)</button>
            <button className="btn btn-outline" onClick={()=>advance('araldo',players)}>Passa senza agire</button>
          </>
        )}
      </NW>
    );


    // ── MIMIC ACTION RENDERER (Mutaforma & Condor) ─────────────────────────────
    const renderMimicAction=(copiedRole,skipFn,advFn,actLabel,actorRole)=>{
      const r=ROLES[copiedRole];
      if(!r)return(<><div className="instr">Ruolo sconosciuto.</div><button className="btn btn-gold" onClick={skipFn}>Continua →</button></>);
      const hdr=<p style={{fontSize:'.76rem',color:r.color,fontStyle:'italic',textAlign:'center',marginBottom:10}}>{actLabel} {r.emoji} {r.name}</p>;
      // Wolf → handled in lupi step
      if(r.wolfTeam)return(<><div className="instr">Agisce con il branco nel turno dei Lupi.</div>{hdr}<button className="btn btn-gold" onClick={skipFn}>Continua →</button></>);
      // Powerless roles
      const powerless=['villico','avvocato','gesu','cappuccetto','romeo','giulietta','orfano','contaminato','misantropo','incompreso','suicida','criceto','lupoAlpha'];
      if(powerless.includes(copiedRole))return(<><div className="instr">Nessun potere notturno da esercitare.</div>{hdr}<button className="btn btn-gold" onClick={skipFn}>Continua →</button></>);
      // Funambolo
      if(copiedRole==='funambolo'){
        const coin=funamboloCoin!==null?funamboloCoin:null;
